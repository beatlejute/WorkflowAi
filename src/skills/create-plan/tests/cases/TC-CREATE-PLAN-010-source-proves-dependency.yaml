id: TC-CREATE-PLAN-010
title: "Источник подтверждает то, от чего зависят задачи: артефакт во внешнем месте кладёт задача плана, фикстуры лежат в дереве продукта, область поиска инструмента названа, сверена с деревом и доказана записью, игнорируемый путь ищется с --no-exclude-standard"
origin:
  chg: ["ad-hoc-2026-10-01-analyze"]
  incidents:
    - "ListeningGlass PLAN-001 (2026-09-29): DOCS-003 назначила URL политики «адресом файла в публичном репозитории», а проверялся только ответ 200 корня репозитория; задачи, которая выкладывает код, в плане нет. Офлайн-фикстуры e2e план взял из research/harness/fixtures как «файлы репозитория», хотя у репозитория не было ни одного коммита. Первый push, .gitignore и перенос фикстур в test/e2e/fixtures сделал вне плана HUMAN-003 (2026-09-30)."
    - "ListeningGlass 2026-09-30: после добавления research/, spikes/, prototype/ и qa/ в .gitignore записи `git grep -q --untracked` по этим каталогам дают exit 1, с `--no-exclude-standard` — exit 0. Проверено запуском на git 2.52: файл из .gitignore `git grep --untracked` не видит, с `--no-exclude-standard` видит, `git check-ignore -q` на нём даёт exit 0."
    - "ListeningGlass PLAN-001 задача 3 (2026-09-29) → FIX-001 (2026-09-30): скрипт `test` заказан голым `node --test`; поиск по шаблонам по умолчанию подхватывал prototype/bg-test.mjs (сеть, 21–37 с) и e2e в каждом `npm test` у исполнителей, минимум в 6 прогонах. Запись задачи — `npm test`, `exit 0` — область поиска не доказывала: она зелёная и с лишними файлами."
  principle: "Источник подтверждает ровно то, от чего зависят задачи, и сверен с текущим деревом: адрес артефакта во внешнем месте — задачей, которая кладёт его туда, фикстуры — в дереве продукта, область поиска инструмента — явно, листингом и записью, красной при лишнем файле (workflows/create.md узлы P10S3, P10S7, P10S8; SKILL.md узлы P5S3, P5S6; knowledge/test-hygiene.md; фикстура шаблона плана)."
  backlog_sources: []
tags: [evidence, test-hygiene, verification-line, plan-quality]
severity: medium

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    (L0-only тест: scenario не запускает агентов, проверяется только static
    assertion над содержимым рабочих файлов скила.)

assertions:
  static:
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S3\\[\"[^\\n]*адрес артефакта плана во внешнем месте[^\\n]{0,120}не подтверждает ответ корня хранилища — артефакт туда кладёт задача плана"
      reason: "Доступность корня хранилища не подтверждает адрес артефакта в нём: артефакт кладёт задача плана (узел P10S3)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S3\\[\"[^\\n]*выкладка артефактов проекта во внешнее место — работа плана, а не внешняя зависимость"
      reason: "Выкладка собственных артефактов во внешнее место — работа плана, а не внешняя зависимость (узел P10S3)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S3\\[\"[^\\n]*«Файлы репозитория» — не источник: нужен вывод листинга отслеживаемых файлов"
      reason: "Наличие каталога на диске не подтверждает файлы репозитория (узел P10S3)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S3\\[\"[^\\n]*[Вв]ходные данные тестов лежат в дереве продукта рядом с тестами, каталог исследований, прототипов или черновиков входом тестов не служит"
      reason: "Фикстуры тестов — в дереве продукта, не в каталоге исследований (узел P10S3)."
    - kind: skill_contains
      file: "knowledge/test-hygiene.md"
      pattern: "## Входные данные тестов[\\s\\S]{0,400}Каталог исследований, прототипов, черновиков или ручных проверок входом тестов не служит"
      reason: "Справочник изоляции тестов фиксирует место входных данных теста."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S8\\[\"[^\\n]*корень изоляции, teardown и место фикстур в дереве продукта"
      reason: "Задача на автотест фиксирует место фикстур вместе с корнем изоляции (узел P10S8)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S7\\[\"[^\\n]*git check-ignore -q <путь>[^\\n]{0,60}--no-exclude-standard` рядом с `--untracked`"
      reason: "Поиск по игнорируемому git пути видит файл только с --no-exclude-standard (узел P10S7)."
    - kind: skill_contains
      file: "tests/fixtures/plan-template-check-forms/plan-template.md"
      pattern: "git check-ignore -q <путь>`[\\s\\S]{0,80}`git grep -q --untracked --no-exclude-standard"
      reason: "Фикстура шаблона плана — вход L1 — называет форму поиска по игнорируемому git пути."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P5S3\\[\"[^\\n]*собственным поиском файлов по шаблонам по умолчанию[^\\n]{0,120}называет явный каталог или шаблон своей области — один и тот же в задаче и в критерии успеха плана"
      reason: "Команда инструмента с поиском по умолчанию называет свою область, одну в задаче и в критерии успеха (узел P5S3)."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P5S3\\[\"[^\\n]*подтверждено листингом или пробным запуском с цитатой вывода"
      reason: "Область поиска сверена с текущим деревом запуском, а не рассуждением (узел P5S3)."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P5S3\\[\"[^\\n]*доказывает область записью, красной, когда поиск подхватывает файл вне области"
      reason: "Критерий задачи, которая заказывает скрипт с поиском по умолчанию, доказывает область записью, а не только кодом возврата 0 (узел P5S3)."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P5S6\\[\"[^\\n]*критерий задачи, которая её заказывает, доказывает область записью, красной при лишнем файле в поиске"
      reason: "Самопроверка перед сохранением ловит скрипт с поиском по умолчанию без записи, доказывающей область (узел P5S6)."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P5S6\\[\"[^\\n]*артефакт, адрес которого во внешнем месте получают задача или человек, кладёт туда задача плана, а фикстуры тестов лежат в дереве продукта"
      reason: "Самопроверка перед сохранением ловит артефакт во внешнем месте без задачи публикации и фикстуры вне дерева продукта (узел P5S6)."

execution:
  timeout_s: 60
