id: TC-CREATE-PLAN-008
title: "Команда записи check — только из программ, установленных на машине проекта: валидатор плана отклоняет отсутствующую и перечисляет доступные"
origin:
  chg: ["ad-hoc-2026-09-26-check-tools"]
  incidents:
    - "2026-09-26: на машине стейкхолдера нет rg. Пример записи check в шаблоне плана и проверки PLAN-002 записаны через rg; исполнитель проверок на такой команде получает spawn_failed: ENOENT, и проверка остаётся красной всегда — пункт DoD не закроется, тикет из ревью не выйдет. Валидатор плана такую запись пропускал: он разбирал только форму записи. Стейкхолдер: «нужно чтобы в критериях учитывались какие инструменты есть»."
  principle: "Проверка исполнима там, где её запустит пайплайн: исполняемый файл команды check установлен на машине проекта и разрешён исполнителем проверок (workflows/create.md узел P10S7; scripts/validate-completeness.js)."
  backlog_sources: []
tags: [verification-line, check-tools, plan-quality]
severity: high

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    (L0-only тест: scenario не запускает агентов, проверяются только static
    assertions над файлами скила. Набор установленных программ у машин прогона
    разный, и верный план на одной машине законно отличается от верного плана
    на другой, поэтому вывод агента здесь не сверяется.)

assertions:
  static:
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S7\\[\"[^\\n]*[Кк]оманда check[^\\n]{0,40}машине проекта[^\\n]{0,80}только из установленных"
      reason: "Шаг разбиения требует брать исполняемый файл команды check только из установленных на машине проекта (узел P10S7)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S7\\[\"[^\\n]*валидатор плана отклоняет запись с отсутствующим[^\\n]{0,20}перечисляет доступные"
      reason: "Узел P10S7 называет, откуда агент узнаёт доступные программы: валидатор плана перечисляет их в ошибке."
    - kind: skill_contains
      file: "scripts/validate-completeness.js"
      pattern: "checkStartProblem\\(\\{ check: command, expect \\}\\)"
      reason: "Валидатор проверяет команду записи check тем же разбором, что исполнитель проверок, без запуска (checkStartProblem)."
    - kind: skill_contains
      file: "scripts/validate-completeness.js"
      pattern: "Задача \\$\\{number\\}: запись проверки \\$\\{i \\+ 1\\} — на машине нет «\\$\\{problem\\.tool\\}» \\(установлены: \\$\\{available\\}\\)"
      reason: "Ошибка отсутствующей программы называет задачу, запись, программу и перечисляет установленные — из них выбирается замена."
    - kind: skill_contains
      file: "scripts/validate-completeness.js"
      pattern: "Задача \\$\\{number\\}: запись проверки \\$\\{i \\+ 1\\} отклонит исполнитель проверок \\(\\$\\{problem\\.reason\\}\\)"
      reason: "Команду, которую исполнитель проверок отклонит (оператор оболочки, запрещённая программа или подкоманда), валидатор отклоняет ошибкой с причиной."

execution:
  timeout_s: 60
