id: TC-CREATE-PLAN-011
title: "Жизненный цикл плана описывает правку утверждённого плана: что делать с тикетами в зависимости от момента правки и что записать в историю изменений"
origin:
  chg: ["ad-hoc-2026-10-01-analyze"]
  incidents:
    - "ListeningGlass PLAN-001 (2026-09-29): задачу 21 правили дважды после утверждения — архитектор во время стадии декомпозиции (08:26–08:41), стейкхолдер («обводку не добавлять») на уже активном плане. Обе правки дошли до IMPL-009, но ни одно правило этого не требовало: декомпозиция читает план в начале стадии, check-plan-decomposed.js план с тикетами на декомпозицию не отправляет, а в «Истории изменений» ID затронутых тикетов нет."
  principle: "Жизненный цикл плана описывает и правку утверждённого плана: какие тикеты затронуты, кто и как их меняет, что записывается в историю изменений (knowledge/plan-lifecycle.md)."
  backlog_sources: []
tags: [lifecycle, plan-quality]
severity: medium

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    (L0-only тест: scenario не запускает агентов, проверяется только static
    assertion над содержимым рабочих файлов скила.)

assertions:
  static:
    - kind: skill_contains
      file: "knowledge/plan-lifecycle.md"
      pattern: "## Правка утверждённого плана[\\s\\S]{0,600}Идёт декомпозиция[^\\n]{0,200}после стадии сверь тикеты изменённой задачи с новым текстом"
      reason: "Правка во время декомпозиции: после стадии тикеты изменённой задачи сверяются с новым текстом."
    - kind: skill_contains
      file: "knowledge/plan-lifecycle.md"
      pattern: "пайплайн правку к тикетам не переносит[^\\n]{0,300}Тикет вне `done/` меняется той же правкой"
      reason: "После создания тикетов правку к ним переносит тот, кто правит план: пайплайн этого не делает."
    - kind: skill_contains
      file: "knowledge/plan-lifecycle.md"
      pattern: "для тикета в `done/`, результат которого правка меняет, заводится новый тикет; новая задача получает тикет явно"
      reason: "Выполненный тикет не переписывается — заводится новый; новая задача активного плана сама не декомпозируется."
    - kind: skill_contains
      file: "knowledge/plan-lifecycle.md"
      pattern: "строка «Истории изменений» плана: дата, автор, номера изменённых задач и ID затронутых тикетов"
      reason: "История изменений называет затронутые тикеты."
    - kind: skill_contains
      file: "knowledge/plan-lifecycle.md"
      pattern: "отправляет на декомпозицию \\*\\*только\\*\\* планы со статусом `approved` без тикетов"
      reason: "Условие декомпозиции описано по коду check-plan-decomposed.js: approved без тикетов."

execution:
  timeout_s: 60
