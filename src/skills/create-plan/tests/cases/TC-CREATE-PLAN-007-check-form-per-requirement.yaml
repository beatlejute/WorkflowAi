id: TC-CREATE-PLAN-007
title: "У каждого требования ТЗ — запись «Проверка:» подходящей формы: check для команды, prose для суждения по тексту, visual для видимого глазами"
origin:
  chg: ["PLAN-002 задача 5 (2026-09-26)"]
  incidents:
    - "PLAN-002 задача 2 (2026-09-26): критерий приёмки задачи плана сопровождается строкой «**Проверка:**» в одной из трёх форм шаблона плана — check с командой и expect, prose с причиной, почему командой не проверить, visual с путём изображения для результата, который видно только глазами; прогон существующего теста помечается regression и единственной проверкой быть не может; самопроверка P5S2 не сохраняет задачу без строки. До задачи 2 скил требовал «чем это проверяется», но проверка записывалась прозой, не машиночитаемо (коммит 4e5aaf1, 2026-09-23, узел P10S7)."
    - "PLAN-002 задача 3 (2026-09-26): scripts/validate-completeness.js отклоняет задачу без строки «**Проверка:**», запись не по формату и задачу из одних регрессионных проверок — ошибкой с номером задачи."
    - "ListeningGlass PLAN-001 задача 5 → QA-001 (2026-09-29): задачу написания модульных тестов план проверял записью «check: `npm test`, expect: `exit 0`» без regression. На дереве плана `npm test` был заглушкой с exit 1, но задача 3 того же плана заменила его на `node --test`, и план сам записал «`npm test` без тестов проходит». Декомпозиция перенесла запись дословно, гейт перед стартом исполнил её после задач-зависимостей — check_green_before_start, тикет в blocked/. Правило P10S7 говорило о «прогоне уже существующего теста» и не называло дерево, на котором запись должна быть красной."
    - "ListeningGlass PLAN-001 задача 5 (2026-09-30, разбор той же задачи): критерий «тесты проходят и падают, если из набора по умолчанию убрать любой домен» доказывали прогон всего набора и поиск одного домена из девяти — «падают» не проверяла ни одна запись, обе записи check, и модель ревью критерий не увидела бы: пункт check закрывает скрипт, не читая текста. Причину prose модель ревью тоже не получает — вопросом идёт текст пункта. Правка P10S7: утверждения, которые доказывают разные записи, — своими строками критерия; запись доказывает, если красная, пока утверждение не выполнено; утверждение о другом коде заменяется свойством результата. Валидатор плана считает форму записей по строке «**Проверка:**», а не по задаче."
  principle: "Форма проверки следует за тем, чем проверяется требование: результат команды — check с expect, суждение по тексту — prose с причиной, результат, видимый только глазами, — visual с путём изображения (workflows/create.md узел P10S7; SKILL.md узел P5S2; scripts/validate-completeness.js)."
  backlog_sources: []
tags: [verification-line, check-forms, plan-quality]
severity: high

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    Создай план по входному документу. Входной документ целиком:

    # Задача: сводка расходов за месяц

    Пользователю нужна сводка расходов за месяц в консоли и в веб-панели.

    1. Команда `node scripts/summary.js --month 2026-09` печатает строку
       `Итого: <сумма> ₽` — сумму расходов за этот месяц из файла
       `data/expenses.csv`.
    2. Подпись под суммой в панели понятна пользователю без финансовой
       подготовки: из неё ясно, что возвраты в сумму не входят.
    3. На странице панели карточка со сводкой стоит над таблицей расходов
       и не перекрывает её заголовок на экране шириной 360 px.

    Разметка панели — `web/dashboard.html`, стили — `web/dashboard.css`.
    Скрипта `scripts/summary.js` ещё нет.

    Требование к итоговому ответу (не часть входного документа): кроме
    обязательных строк, перечисли задачи плана — номер, название, номера
    требований входного документа (1–3), которые закрывает критерий приёмки
    задачи (ни одного — «—»), и строки «**Проверка:**» с записями дословно
    из сохранённого файла плана.
  inputs:
    - kind: dir
      path: "../fixtures/plan-template-check-forms"
      dest_dir: ".workflow/templates"
      description: "Фрагмент templates/plan-template.md (строки 47–103): секция задач с тремя формами записи проверки. В рабочем каталоге прогона шаблонов нет — createTestWorkdir их не создаёт."

assertions:
  static:
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S7\\[\"[^\\n]*«\\*\\*Проверка:\\*\\*»[^\\n]*check[^\\n]*expect[^\\n]*prose[^\\n]*visual"
      reason: "Шаг разбиения требует у критерия приёмки строку «**Проверка:**» в одной из трёх форм — check с expect, prose, visual (узел P10S7)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S7\\[\"[^\\n]*prose[^\\n]{0,40}командой не проверить[^\\n]*visual[^\\n]{0,60}глазами"
      reason: "Выбор формы по требованию: prose — когда командой не проверить, visual — для результата, который видно только глазами (узел P10S7)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S7\\[\"[^\\n]*regression[^\\n]*не может быть единственной проверкой"
      reason: "Регрессионный прогон существующего теста не может быть единственной проверкой задачи (узел P10S7)."
    # 2026-09-29 (ListeningGlass QA-001): прогон всего набора без пометки regression у задачи,
    # которая пишет тесты, был зелёным до работы — задача-зависимость сделала набор проходящим.
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S7\\[\"[^\\n]*[Зз]апись check без regression до работы красная[^\\n]{0,20}на дереве, где задачи-зависимости выполнены, а эта задача ещё нет"
      reason: "«До работы» — дерево после задач-зависимостей, а не дерево на момент написания плана: там запись исполняет гейт перед стартом (узел P10S7)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S7\\[\"[^\\n]*[Кк]оманда, которая на этом дереве уже проходит[^\\n]{0,120}всего набора[^\\n]{0,80}помечается regression"
      reason: "Прогон всего набора, куда тесты задачи ещё не добавлены, на дереве после зависимостей проходит — это регрессия, а не проверка результата (узел P10S7)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S7\\[\"[^\\n]*[Зз]адачу, которая пишет тесты, проверяет запуск её собственных тестов[^\\n]{0,40}до работы их нет[^\\n]{0,60}P10R1"
      reason: "Задачу написания тестов проверяет запуск её собственных тестов, а ожидание записи подчиняется P10R1: дефект продукта, найденный тестом, не делает критерий невыполнимым (узел P10S7)."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P5S2\\[\"[^\\n]*запись check без regression красная на дереве, где задачи-зависимости выполнены[^\\n]{0,40}иначе она помечена regression"
      reason: "Самопроверка перед сохранением сверяет каждую запись check без regression с деревом после задач-зависимостей (узел P5S2)."
    # 2026-09-30 (ListeningGlass QA-001): «падают, если убрать любой домен» доказывали прогон
    # набора и поиск одного домена из девяти, оба пункта тикета получили одинаковый текст.
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S7\\[\"[^\\n]*[Уу]тверждения критерия, которые доказывают разные записи, записываются каждое своей строкой «\\*\\*Критерий приёмки:\\*\\*» со своей строкой «\\*\\*Проверка:\\*\\*»"
      reason: "Утверждения, которые доказывают разные записи, — каждое своей строкой критерия со своей строкой проверки (узел P10S7)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S7\\[\"[^\\n]*запись check доказывает утверждение, если она красная, пока оно не выполнено[^\\n]{0,20}поиск одного элемента набора проходит и без остальных"
      reason: "Запись доказывает утверждение, только если красная при невыполненном; поиск одного элемента набора — нет (узел P10S7)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S7\\[\"[^\\n]*[Зз]апись regression: `true` доказывает только то, что прежние тесты проходят"
      reason: "Регрессия утверждения о новом результате не доказывает (узел P10S7)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S7\\[\"[^\\n]*[Мм]одель ревью получает вопросом текст утверждения[^\\n]{0,40}, а причину prose не видит"
      reason: "Что должна оценить модель ревью, пишется утверждением: причина prose до модели не доходит (узел P10S7)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S7\\[\"[^\\n]*утверждение о другом коде[^\\n]{0,40}замени свойством результата"
      reason: "Утверждение о том, что было бы при другом коде, заменяется свойством результата (узел P10S7)."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P5S2\\[\"[^\\n]*утверждения критерия, которые доказывают разные записи, стоят каждое своей строкой"
      reason: "Самопроверка перед сохранением сверяет разбиение критерия по записям (узел P5S2)."
    # 2026-09-30 (ListeningGlass IMPL-003): задача каркаса заказала скрипт e2e-тестов без записи,
    # e2e-тесты писала более поздняя задача, исполнитель поставил заглушку, которая всегда проходит.
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S6\\[\"[^\\n]*[Зз]адача заказывает только результат, который доказывает сама"
      reason: "Задача плана заказывает только то, что доказывает сама (узел P10S6)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S6\\[\"[^\\n]*содержимое которого создаёт более поздняя задача N[^\\n]{0,80}переносится в задачу N вместе с записью, которая запускает сам этот результат"
      reason: "Скрипт запуска тестов, которые пишет более поздняя задача, переносится в неё с записью, запускающей сам скрипт (узел P10S6)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S6\\[\"[^\\n]*красная до работы и на заглушке, зелёная на настоящем результате без содержимого"
      reason: "Оставленный в ранней задаче результат доказывает запись, которая ловит заглушку и не зависит от поздней задачи (узел P10S6)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S7\\[\"[^\\n]*[Кк]аждый результат, который задача создаёт или меняет по своему описанию[^\\n]{0,120}стоит утверждением своей строки «\\*\\*Критерий приёмки:\\*\\*»"
      reason: "Результат из описания, которым пользуются другие, — своё утверждение критерия со своей записью (узел P10S7)."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P5S2\\[\"[^\\n]*результат, содержимое которого создаёт более поздняя задача, перенесён в ту задачу вместе с записью, запускающей сам результат"
      reason: "Самопроверка перед сохранением ловит результат, заказанный раньше своего содержимого (узел P5S2)."
    - kind: skill_contains
      file: "scripts/validate-completeness.js"
      pattern: "checks\\.some\\(\\(\\{ inline, listed \\}\\) => inline && listed\\)"
      reason: "Валидатор считает форму записей по каждой строке «Проверка:»: несколько строк критерия с разной формой записей — не ошибка."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P5S2\\[\"[^\\n]*«\\*\\*Проверка:\\*\\*»[^\\n]*без строки не сохраняется"
      reason: "Самопроверка перед сохранением не пропускает задачу без строки «**Проверка:**» (узел P5S2)."
    - kind: skill_contains
      file: "scripts/validate-completeness.js"
      pattern: "Задача \\$\\{[^}]+\\}: нет строки \\*\\*Проверка:\\*\\*"
      reason: "Валидатор плана отклоняет задачу без строки проверки ошибкой с номером задачи."
    - kind: skill_contains
      file: "scripts/validate-completeness.js"
      pattern: "Задача \\$\\{[^}]+\\}: только регрессионные проверки"
      reason: "Валидатор плана отклоняет задачу из одних регрессионных проверок ошибкой с номером задачи."
    # 2026-09-28 (PulseProxy QA-152, DOCS-10, QA-158): проверка тикета тестирования требовала
    # исправленного продукта — шесть исполнений и блокировка; prose требовал сверки с доской,
    # которой модель ревью не видит, — четыре отказа; git status каталога тестов ломали файлы
    # соседних тикетов. Правило, что проверяет проверка, — узел P10R1.
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10R1\\[\"П10 ПРАВИЛО: Проверку критерия проходит правильно сделанная задача[^\\n]*Задача тестирования[^\\n]*найденный дефект — выполненный критерий[^\\n]*а не что продукт прошёл"
      reason: "Проверка задачи тестирования подтверждает проведённый сценарий и записанный факт, а не исправность продукта."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10R1\\[\"[^\\n]*Проверка не зависит от чужой работы"
      reason: "Проверку не ломают файлы и коммиты других задач."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10R1\\[\"[^\\n]*prose оценивает модель ревью, которая видит только evidence[^\\n]*сверку с ними делает check"
      reason: "prose — только то, что видно в evidence; сверку с доской, файлами под .workflow/ и прогоном тестов делает check."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10E1 --> P10R1 --> P10S1"
      reason: "Правило читается на входе этапа, до разбиения на задачи и записи критериев."

  # L1 — по итоговому ответу: раннер отдаёт L1 и судье только его (evaluateTrialL1
  # в run-skill-tests.js; после прогона снимаются лишь файлы входов ticket_file),
  # созданный файл плана никому не доставляется. Поэтому кейс просит привести строки
  # «Проверка:» в ответе дословно из файла. Запись в обратных кавычках — формат,
  # который принимает валидатор (parseCheckRecord, src/lib/check-runner.mjs).
  # Проходной балл судьи задан в раннере: 4 (JUDGE_PASS_SCORE, src/lib/skill-judge.mjs;
  # pass_threshold кейса раннер не читает), а 4 — «два требования из трёх». Поэтому
  # форма требования про команду закреплена здесь: check, чья команда запускает
  # скрипт сводки или его тест. Форму требований про подпись (prose) и про карточку
  # (visual) проверяет только судья, и одна неподходящая из них проходит L2.
  deterministic:
    - kind: output_matches
      regex: "check:\\s*`[^`]*summary[^`\\s]*\\.[cm]?[jt]s\\b[^`]*`\\s*,\\s*expect:\\s*`[^`]*[^`\\s][^`]*`(?!\\s*,\\s*regression)"
      reason: "Требование про команду сводки проверяется командой — check, чья команда запускает скрипт сводки или его тест, с expect и без пометки regression."
    - kind: output_matches
      regex: "prose:\\s*`[^`]*[^`\\s][^`]*`"
      reason: "В плане есть запись prose с непустой причиной."
    - kind: output_matches
      regex: "visual:\\s*`[^`]*[^`\\s][^`]*`"
      reason: "В плане есть запись visual с путём изображения."

  rubric:
    - kind: llm_judge
      rubric_file: "../rubrics/check-form-per-requirement.md"
      criterion: "Получило ли каждое из трёх требований ТЗ запись подходящей формы — команда сводки: check с expect без пометки regression, понятность подписи: prose с причиной, расположение карточки над таблицей: visual с путём изображения? Запись относится к требованию, если стоит в строке «Проверка:» задачи, которую ответ называет закрывающей это требование; требование засчитывается, если среди записей таких задач есть запись подходящей формы; записи других форм рядом не мешают."
      pass_threshold: 4
      trials: 3
      aggregate: majority

execution:
  timeout_s: 2400
