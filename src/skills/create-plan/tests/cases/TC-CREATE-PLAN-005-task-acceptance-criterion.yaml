id: TC-CREATE-PLAN-005
title: "Задача плана несёт критерий приёмки, план не сочиняет реализацию"
origin:
  chg: []
  incidents:
    - "PulseProxy DEF-016-001: PLAN-016 задача 17 предписала конкретное значение без критерия приёмки; значение оказалось неверным, дефект нашёлся только ручной проверкой"
  principle: "Критерий приёмки у каждой задачи, перенос данных вместо сочинения кода"
  backlog_sources:
    - "d:/Dev/PulseProxy/.workflow/plans/archive/PLAN-016.md"
tags: [acceptance-criterion, plan-quality, anti-pattern]
severity: high

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    Создай план по входному документу. Входной документ целиком:

    # Задача: окно приложения занимает доступную высоту

    Сейчас окно открывается фиксированной высоты и обрезает содержимое:
    нижние элементы недоступны без прокрутки. Нужно, чтобы окно занимало
    всю доступную высоту, а список внутри прокручивался сам.

    Известные ограничения среды: платформа ограничивает высоту окна
    величиной 600 пикселей.

    Стили окна лежат в `style.css`, разметка — в `index.html`.

assertions:
  static:
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "Критерий приёмки задачи"
      reason: "Требование критерия приёмки у каждой задачи должно быть в шаге разбиения на задачи."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "Перенос — не сочинение"
      reason: "Граница между переносом данных и сочинением кода должна стоять в принципе «Конкретность»."

  # L1 не применим: скил сохраняет план в файл, а в выводе печатает сводку.
  # Прогон 2026-09-22: ни одна попытка не содержала строку «Критерий приёмки»
  # в выводе, хотя план на диске её нёс.

  rubric:
    - kind: llm_judge
      rubric_file: "../rubrics/task-acceptance-criterion.md"
      criterion: "Снабдил ли агент каждую задачу плана критерием-результатом со способом проверки, не предписывая реализацию?"
      pass_threshold: 4
      trials: 3
      aggregate: majority

execution:
  # Per-case override по явному согласию стейкхолдера 2026-09-23: «прогоны только
  # на клоде». Цель кейса — зафиксировать правило перед переводом скила на рельсы,
  # а не мерить сферу регрессии. Расширение обратно — решение стейкхолдера.
  target_agents:
    - claude-sonnet
  timeout_s: 1800
