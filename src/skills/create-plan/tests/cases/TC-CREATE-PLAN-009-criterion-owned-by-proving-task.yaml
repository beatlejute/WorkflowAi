id: TC-CREATE-PLAN-009
title: "Утверждение плана стоит у задачи, которая может его доказать в своём тикете: поведение пары «изменение кода + автотесты», покрытие у задач тестов, митигация по ответу задачи проверки, критерии успеха внутри плана"
origin:
  chg: ["ad-hoc-2026-10-01-analyze"]
  incidents:
    - "PulseProxy PLAN-020 (создан 2026-09-28, исполнен 2026-09-29…30): у 13 задач изменения кода проверка поведения записана prose «… проверяет задача N». Декомпозиция перенесла полный текст критерия в пункт prose, модель ревью получает вопросом только текст пункта, причину не видит. 8 из 9 отказов модели по плану пришлись на эти пункты (IMPL-112, IMPL-113, IMPL-115, IMPL-117 ×2, IMPL-119 ×2, IMPL-122), около 2 ч пайплайна, не меньше 5 платных запусков claude-opus; scripts/validate-completeness.js давал valid: true."
    - "PulseProxy PLAN-020 (2026-09-30): у 16 тикетов тестирования (QA-164…179) в DoD только счётчики тестов и typeof по полям отчёта — все закрыты all_green без модели ревью; e2e QA-177 записал в отчёт литералы вместо измерений, критерии успеха 2–4 не доказаны при статусе плана completed. У задач 9, 17, 22, 24, 27, 30 ожидание вида «numPassedTests не меньше N или numFailedTests не меньше 1» снимало порог числа тестов."
    - "PulseProxy PLAN-020 (2026-09-30): митигация «если webRequest не видит навигацию через service worker сайта — записать ограничение в CHANGELOG и shared knowledge» стояла только в таблице рисков. RSH-002 ответил «нет», DOCS-014 и DOCS-015 сделаны по тексту задач без ограничения, три разбора отчётов этого не увидели, план закрыт completed."
    - "ListeningGlass PLAN-001 (REPORT-001, 2026-09-30): критерий успеха «Итог модерации и дальнейшие шаги. Проверка: prose: `решение по итогам модерации принимает стейкхолдер`» — событие после последней задачи. При 26/26 тикетах в done план остаётся active, PLAN-002 ждёт в draft его закрытия. Образец шаблона плана «Критерий 3. Проверка: prose: `решение принимает человек`»."
    - "Ревью правок 2026-10-01: первый вариант правила валидатора ловил любой номер задачи в причине prose — на планах workflowAi PLAN-002…004 это 47 ошибок на причинах вида «красноту до задачи 66 одной командой не проверить». Правило сужено до глагола проверки рядом с номером задачи: попадания в PulseProxy и ListeningGlass (74) сохранены, в workflowAi осталось 1."
  principle: "Каждое утверждение плана стоит у задачи этого плана, которая может доказать его в своём тикете, или у критерия успеха, который закрывается сразу после последней задачи (workflows/create.md узлы P10R1, P10S3, P10S7, P10S8, P10S9, P10G2, P10S10, P10S12; SKILL.md узел P5S6; knowledge/task-verification-pairs.md; scripts/validate-completeness.js)."
  backlog_sources: []
tags: [criterion-ownership, verification-line, plan-quality, regression-guard]
severity: high

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    (L0-only тест: scenario не запускает агентов, проверяется только static
    assertion над содержимым рабочих файлов скила.)

assertions:
  static:
    # 1. Поведение, которое доказывают тесты парной задачи, — её критерий
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S8\\[\"[^\\n]*[Пп]оведение, которое доказывают только тесты парной задачи автотестов, — критерий парной задачи"
      reason: "Утверждение о поведении, которое доказывают тесты парной задачи, записывается её критерием, а не отсылкой prose у задачи изменения (узел P10S8)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S8\\[\"[^\\n]*правильность этого поведения закрывает критерий успеха плана с прогоном этих тестов"
      reason: "Правильность поведения, отданного тестам парной задачи, закрывает критерий успеха плана — иначе её не доказывает никто (узел P10S8)."
    - kind: skill_contains
      file: "knowledge/task-verification-pairs.md"
      pattern: "## Где стоит утверждение о поведении[\\s\\S]{0,1200}Парная задача автотестов для задачи N[\\s\\S]{0,600}Критерии успеха плана"
      reason: "Справочник пар раскладывает утверждение о поведении между задачей изменения, парной задачей автотестов и критерием успеха."
    - kind: skill_contains
      file: "knowledge/task-verification-pairs.md"
      pattern: "отдаёт проверку другой задаче плана[\\s\\S]{0,300}Валидатор плана такую причину отклоняет[\\s\\S]{0,200}[Нн]омер задачи как момент времени"
      reason: "Справочник пар говорит о причине prose то же, что узел P10S7 и валидатор: перенос проверки отклоняется, номер задачи как момент времени — нет."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S7\\[\"[^\\n]*[Пп]ричина prose у критерия задачи отвечает только на вопрос, почему утверждение не проверить командой[^\\n]{0,40}отдаёт проверку другой задаче плана[^\\n]{0,80}перенос проверки, а не причина"
      reason: "Причина prose у критерия задачи не отдаёт проверку другой задаче плана (узел P10S7)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S7\\[\"[^\\n]*[Нн]омер задачи как момент времени[^\\n]{0,80}причине не мешает"
      reason: "Номер задачи как момент времени — причина, а не перенос проверки (узел P10S7)."
    - kind: skill_contains
      file: "scripts/validate-completeness.js"
      pattern: "TASK_REFERENCE\\.exec\\(reason"
      reason: "Валидатор плана проверяет причину каждой записи prose на перенос проверки к задаче плана."
    - kind: skill_contains
      file: "scripts/validate-completeness.js"
      pattern: "const TASK_REFERENCE = new RegExp\\(\\s*`\\$\\{CHECK_VERB\\}"
      reason: "Перенос проверки валидатор узнаёт по глаголу проверки рядом с номером задачи: номер задачи как момент времени ошибкой не считается."
    - kind: skill_contains
      file: "scripts/validate-completeness.js"
      pattern: "причина prose отдаёт проверку другой задаче плана"
      reason: "Перенос проверки к задаче плана в причине prose — ошибка валидатора с номером задачи и записи."

    # 2. Задача тестов и сценария: строка prose о покрытии и измеренных значениях
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S12\\[\"П10 ШАГ: Задача, которая пишет тесты или проводит сценарий с записью значений[^\\n]*отдельную строку «\\*\\*Критерий приёмки:\\*\\*» с записью prose"
      reason: "У задачи тестов или сценария, кроме счётчика, — строка критерия с prose: тикет уходит к модели ревью (узел P10S12)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S12\\[\"[^\\n]*каждый из них проверяет свой тест с утверждением о названном в случае результате"
      reason: "Строка prose у задачи тестов — о покрытии каждого случая из описания своим тестом (узел P10S12)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S12\\[\"[^\\n]*вычислено из наблюдаемого в прогоне[^\\n]{0,80}а не задано в коде теста"
      reason: "Строка prose у сценария — о значениях, измеренных в прогоне, а не заданных литералом (узел P10S12)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S12\\[\"[^\\n]*альтернатива «или упал хотя бы один» снимает порог"
      reason: "Число тестов доказывает счётчик всех исполненных тестов, альтернатива по упавшим порог снимает (узел P10S12)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10R1\\[\"[^\\n]*покрытие случаев и то, что значения измерены, а не заданы, доказывает её отдельная строка критерия с prose"
      reason: "Правило задачи тестирования называет, чем доказывается покрытие и измерение (узел P10R1)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S6 --> P10S7 --> P10S11 --> P10S8 --> P10S12 --> P10G1"
      reason: "Шаг покрытия у задач тестов идёт после парных задач: он применяется и к созданным там задачам автотестов."
    - kind: skill_contains
      file: "scripts/validate-completeness.js"
      pattern: "thresholdBypass\\(expect\\)"
      reason: "Валидатор плана проверяет ожидание каждой записи check на альтернативу, снимающую порог числа тестов."
    - kind: skill_contains
      file: "scripts/validate-completeness.js"
      pattern: "альтернатива по упавшим тестам снимает порог числа тестов"
      reason: "Альтернатива по упавшим тестам — ошибка валидатора с номером задачи и записи."

    # 3. Митигация риска — критерий задачи-получателя
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S9\\[\"[^\\n]*[Мм]итигация, которая требует работы в артефакте плана[^\\n]{0,80}не остаётся только в таблице рисков: она утверждение критерия задачи-получателя"
      reason: "Митигация-действие становится критерием задачи, колонка «Митигация» называет её номер (узел P10S9)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S9\\[\"[^\\n]*зависит от ответа задачи проверки предположения или исследования[^\\n]{0,160}которая зависит от этой задачи"
      reason: "Митигация по ответу задачи проверки — критерий задачи, которая зависит от неё (узел P10S9)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S9\\[\"[^\\n]*при любом ответе она записывает в артефакт итог ответа[^\\n]{0,200}Запись «если ответ X — в артефакте есть Y» при другом ответе зелёная до работы"
      reason: "Запись митигации по ответу красная до работы при любом ответе: условная запись зелёная до работы, и гейт перед стартом блокирует тикет (узел P10S9)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S9 --> P10G2\\s+P10G2 -->\\|\"нет\"\\| P10S6"
      reason: "Риск, найденный после разбиения, возвращается в задачи: гейт после рисков ведёт назад к разбиению."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S3\\[\"[^\\n]*назови задачу, которая использует её ответ"
      reason: "У задачи проверки предположения названа задача-получатель её ответа (узел P10S3)."

    # 4. Критерии успеха закрываются внутри плана
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S10\\[\"[^\\n]*[Сс]обытие, которое наступает после последней задачи и зависит от внешней стороны[^\\n]{0,120}критерием успеха не бывает"
      reason: "Внешнее событие после последней задачи критерием успеха не бывает (узел P10S10)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S10\\[\"[^\\n]*событие уходит в раздел «Внешние зависимости»"
      reason: "Внешнее событие после плана записывается во «Внешних зависимостях» (узел P10S10)."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10S10\\[\"[^\\n]*записанным результатом задачи этого плана[^\\n]{0,40}или записью check или visual, исполнимой сразу после последней задачи"
      reason: "Критерий успеха закрывает задача плана или запись, исполнимая сразу после последней задачи (узел P10S10)."

    # 5. Самопроверка перед сохранением
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P5S6\\[\"П5 ШАГ: Чеклист структуры задач, продолжение[^\\n]*не отдаёт проверку другой задаче плана"
      reason: "Самопроверка ловит причину prose, которая отдаёт проверку другой задаче плана (узел P5S6)."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P5S6\\[\"[^\\n]*строка критерия с prose о покрытии перечисленных случаев и об измеренных значениях"
      reason: "Самопроверка ловит задачу тестов без строки prose о покрытии (узел P5S6)."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P5S6\\[\"[^\\n]*у каждой митигации-действия из таблицы рисков есть задача, критерий которой её доказывает"
      reason: "Самопроверка сверяет митигации с задачами (узел P5S6)."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P5S6\\[\"[^\\n]*каждый критерий успеха закрывает задача плана или запись, исполнимая сразу после последней задачи"
      reason: "Самопроверка ловит критерий успеха, который ждёт внешнего события (узел P5S6)."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P5E1 --> P5S1 --> P5S2 --> P5S6 --> P5S3 --> P5G1"
      reason: "Продолжение чеклиста структуры стоит в цепочке самопроверки до гейта."

execution:
  timeout_s: 60
