# Карта переноса скила create-plan на рельсы (CONVERT 2026-09-23).
# Каждая фраза-инвариант прозаической версии получила узел графа, справочник или
# обоснованный отказ. Проверка: node .workflow/src/scripts/check-rails-coverage.js
# --skill create-plan --baseline <ref> --map rails-migration.yaml
version: 1
skill: create-plan
baseline: HEAD
entries:
  # --- роль и границы компетенции -> П0 ---
  - phrase: "Ты — архитектор планов."
    target: "P0E1"
  - phrase: "- **Декомпозиция на тикеты** → скил декомпозиции"
    target: "P0R1"
  - phrase: "- **Анализ отчётов** → скил анализа отчётов"
    target: "P0R1"
  - phrase: "- **Выполнение задач** → скил выполнения задач"
    target: "P0R1"
  - phrase: "ТЗ\" или \"URL уже создан\"."
    target: "P0R2"

  # --- принцип гранулярности: правило в ядре, проверка во фрагменте ---
  - phrase: "Задача «Исправить X — сигнатура, порядок, удаление Y» содержит 3 независимых действия и должна быть разбита на 3 задачи уже на этапе плана."
    target: "P0R7"
  - phrase: "Структура задач плана — «якорь» для декомпозитора: крупная задача → крупный тикет → неатомарный артефакт."
    target: "P0R7"
  - phrase: "Мелкие задачи в плане дешевле, чем исправление неатомарных тикетов постфактум."
    target: "P0R7"
  - phrase: "Содержат ли нумерованные шаги независимые (параллельные) действия?"
    target: "P10G1"
  - phrase: "Если да — разбей задачу в плане."
    target: "P10G1"

  # --- назначение исполнителей ---
  - phrase: "При неопределённости — назначай агента с `fallback: HUMAN`."
    target: "P0R9"

  # --- шаги воркфлоу -> фрагмент П10 ---
  - phrase: "Прочитай входной документ (ТЗ, спецификация, задача) и **извлеки ВСЕ конкретные данные**:"
    target: "P10S2"
  - phrase: "**SMART-цели** — цель плана конкретна, измерима, достижима, релевантна, ограничена во времени."
    target: "P10S4"
  - phrase: "- **S**pecific — конкретной (что именно)"
    target: "P10S4"
  - phrase: "- **M**easurable — измеримой (как проверим)"
    target: "P10S4"
  - phrase: "- **A**chievable — достижимой (реалистичной)"
    target: "P10S4"
  - phrase: "- **R**elevant — релевантной (зачем нужна)"
    target: "P10S4"
  - phrase: "- **T**ime-bound — ограниченной во времени"
    target: "P10S4"
  - phrase: "**Включено:**"
    target: "P10S5"
  - phrase: "**Исключено:**"
    target: "P10S5"

  # --- самопроверка и сохранение -> П5, П6 ---
  - phrase: "Если хотя бы один пункт не выполнен — **вернись к шагу 2** и дополни план."
    target: "P5G1"
  - phrase: "**⛔ ОБЯЗАТЕЛЬНЫЙ ШАГ перед сохранением плана.**"
    target: "P5E1"
  - phrase: "Сообщи о проблеме и **остановись**."
    target: "P5S4"
  - phrase: "- **Если `valid: false`** (есть `errors`) → исправь план по указанным ошибкам, перезапиши файл и запусти скрипт повторно."
    target: "P5Q1"
  - phrase: "Не переходи к шагу 10, пока `valid` не станет `true`."
    target: "P5Q1"
  - phrase: "- **Если только `warnings`** (`valid: true`, но `warnings` не пуст) → оцени каждое предупреждение."
    target: "P5Q1"
  - phrase: "Допустимо продолжить, если предупреждения не критичны для контекста задачи."
    target: "P5Q1"
  - phrase: "**Статус: `draft`** — план создаётся как черновик."
    target: "P6R1"
