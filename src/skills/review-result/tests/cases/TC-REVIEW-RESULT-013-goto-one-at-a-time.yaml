id: TC-REVIEW-RESULT-013
title: "Переходы по графу по одному, команда из строки «Переходы», ID узла — не текст"
origin:
  chg: ["ad-hoc-2026-09-29"]
  incidents:
    - "PulseProxy, журнал отказов rails 2026-09-25…28: у исполнителя и ревью 964 отказа переходов в 142 сессиях (у остальных скилов — единицы). 271 отказ «нет ребра» из исполнителя — пачки одновременных goto с интервалом ~0,2 с (сессия ses_f1c46dff7f 2026-09-27 16:36:22–24: из P0R1 в P0R3…P0R9), 221 — цитата по памяти с опечаткой («П6 ШАГ: GATE-2, проверка файлов в Result» вместо лейбла P6S2), 109 — цитата короче 25 символов («П3 ШАГ: Изолируй scope»), 36 — текст лейбла вместо ID, 7 — next вместо ID. Команда перехода с точной цитатой уже печатается в строке «Переходы» ответа goto."
  principle: "Шапка ревьюера учит протоколу перехода: по одному goto после ответа на предыдущий, команда целиком из строки «Переходы», ID узла вместо текста; одновременные goto отклоняются, потому что проверяются от одного текущего узла."
  backlog_sources: []
tags: [rails, navigation, regression-guard]
severity: medium

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    (L0-only тест: scenario не запускает агентов, проверяется только static
    assertion над содержимым рабочих файлов скила.)

assertions:
  static:
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "Переходы\\s+—\\s+по\\s+одному:\\s+следующий\\s+`goto`\\s+отправляй\\s+только\\s+после\\s+ответа\\s+на\\s+предыдущий\\."
      reason: "Переходы по одному: следующий goto — после ответа на предыдущий."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "Одновременные\\s+вызовы\\s+`goto`\\s+проверяются\\s+от\\s+одного\\s+и\\s+того\\s+же\\s+текущего\\s+узла:\\s+проходит\\s+только\\s+переход\\s+в\\s+соседний\\s+узел,\\s+остальные\\s+отклоняются\\."
      reason: "Объяснено, почему пачка одновременных goto отклоняется."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "Команду\\s+перехода\\s+бери\\s+целиком\\s+из\\s+строки\\s+«Переходы»\\s+ответа\\s+предыдущего\\s+`goto`\\s+—\\s+в\\s+ней\\s+ID\\s+узла\\s+и\\s+дословная\\s+цитата\\s+нужной\\s+длины:\\s+не\\s+набирай\\s+цитату\\s+по\\s+памяти\\s+и\\s+не\\s+сокращай\\."
      reason: "Цитата берётся из ответа goto, а не набирается по памяти и не сокращается."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "`<узел>`\\s+—\\s+ID\\s+узла\\s+\\(например\\s+`P0R2`\\),\\s+а\\s+не\\s+текст\\s+лейбла\\s+и\\s+не\\s+`next`\\."
      reason: "Целевой узел — ID, не текст лейбла и не next."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "Переходы\\s+—\\s+по\\s+одному:[\\s\\S]*```mermaid"
      reason: "Протокол перехода стоит в шапке до графа — агент читает его до первого goto."
