id: TC-REVIEW-RESULT-014
title: "Шкала ревью по evidence: строка, которую написал сам тикет, — факт о своём тексте; у пункта о соответствии нужны обе стороны сравнения уже на уровне прохода"
origin:
  chg: ["ad-hoc-2026-10-01-judge-lenient-without-evidence"]
  incidents:
    - "ListeningGlass DOCS-003 (2026-09-29): пункт «политика описывает всё, что расширение хранит» оценён уровнем 5 (jev, уверенность 0.82) по одному диффу политики: source_refs пуст, кода хранилища в evidence нет. Дефекта нет — политика совпадает с кодом, риск скрытый."
    - "ListeningGlass IMPL-010 (2026-09-29): пункт visual о размерах изображений магазина после трёх верных отказов получил уровень 5 (claude-haiku-vision, уверенность null) по столбцу «Измерено» в README и коду теста, которые добавил тот же тикет; тест на ревью не запускался. Исполнитель в Result: «Строки попадают в дифф и в отрывок по ссылке, то есть становятся фактом репозитория, а не утверждением исполнителя». Размеры по IHDR верны, риск скрытый."
  principle: "Модель ревью видит только строки шкалы knowledge/dod-evidence-scale.md (prepare-review.js, rubricLevels). Строка диффа или исходника, которая утверждает результат о другом объекте, и код теста без вывода его запуска — факты о себе, а не о результате (уровень 2); пункт о соответствии или полноте без второй стороны сравнения в evidence — не выше уровня 3; на уровне прохода 4 обе стороны уже есть в фактах, косвенным бывает только вывод об их совпадении; уровень 5 у такого пункта — когда обе стороны видны прямо."
  backlog_sources: []
tags: [evidence-review, dod-evidence-scale, judge]
severity: medium

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    (L0-only тест: scenario не запускает агентов, проверяются только static
    assertions над строками таблицы шкалы — модель ревью получает только их,
    проза вокруг таблицы балл не назначает.)

assertions:
  static:
    - kind: skill_contains
      file: "knowledge/dod-evidence-scale.md"
      pattern: '\| 2 \|[^\n]*утверждает результат о другом объекте[^\n]*факт о своём тексте, а не об этом объекте'
      reason: "Строка уровня 2: строка диффа, которая сама утверждает результат о другом объекте, — факт о своём тексте (IMPL-010: таблица «Измерено» того же тикета)."
    - kind: skill_contains
      file: "knowledge/dod-evidence-scale.md"
      pattern: '\| 2 \|[^\n]*код теста без вывода его запуска — факт о тесте, а не о результате'
      reason: "Строка уровня 2: код теста без вывода запуска результат не подтверждает (IMPL-010: тест на ревью не запускался)."
    - kind: skill_contains
      file: "knowledge/dod-evidence-scale.md"
      pattern: '\| 3 \|[^\n]*пункт о соответствии или полноте относительно другого объекта[^\n]*не выше этого уровня'
      reason: "Строка уровня 3: пункт о соответствии или полноте без второй стороны сравнения в evidence — не выше 3 (DOCS-003: кода хранилища в evidence нет)."
    - kind: skill_contains
      file: "knowledge/dod-evidence-scale.md"
      pattern: '\| 4 \|[^\n]*у пункта о соответствии или полноте обе стороны сравнения есть в фактах evidence: косвенным бывает только вывод об их совпадении, а не вторая сторона'
      reason: "Строка уровня 4 — порог прохода: без второй стороны сравнения пункт о полноте не выходит на 4 как «следует косвенно» (DOCS-003 при запрете только уровня 5 прошёл бы на 4)."
    - kind: skill_contains
      file: "knowledge/dod-evidence-scale.md"
      pattern: '\| 4 \|[^\n]*строка, которая сама утверждает результат, и код теста без вывода его запуска вторую сторону не заменяют'
      reason: "Строка уровня 4: самоутверждающая строка тикета и код теста без запуска второй стороной сравнения не считаются (IMPL-010)."
    - kind: skill_contains
      file: "knowledge/dod-evidence-scale.md"
      pattern: '\| 5 \|[^\n]*у пункта о соответствии или полноте в них видны обе стороны сравнения'
      reason: "Строка уровня 5: у пункта о соответствии уровень 5 — только когда в evidence прямо видны обе стороны сравнения."

execution:
  timeout_s: 60
