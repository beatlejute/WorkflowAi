# Карта переноса прозы review-result в граф (CONVERT 2026-09-23).
# Используется check-rails-coverage.js: фраза-инвариант считается покрытой, если её подстрока
# >= 25 символов есть в текущих файлах скила либо она перечислена здесь с решением.
#
# Правило деления (П70S2 коуча): что агент обязан цитировать — в лейбл узла; что читается по
# надобности — остаётся справочником. Поэтому:
#   - SKILL.md и workflows/review.md переписаны графом: ядро (этапы 0 вход и правила,
#     1 быстрый выход, 2 механическая предпроверка, 5 правило QA-тикетов, 6 вердикт и запись)
#     в SKILL.md, этапы 3 (парсинг и проверка DoD) и 4 (специальные проверки) — фрагмент;
#   - knowledge/dod-patterns.md, knowledge/test-hygiene.md,
#     knowledge/baseline-snapshot-validation.md, algorithms/verification.md,
#     templates/verdict.md и scripts/verify-artifacts.js не тронуты — справочники и скрипт;
#   - tests/cases/** и tests/rubrics/** не тронуты — L0-anchors и L2-рубрики остаются в силе.
#
# Виды решений: <узел> — смысл фразы живёт в лейбле этого узла, формулировка была служебной
# (заголовок раздела прозы, подпись таблицы, ссылка на номер шага); "ребро A -> B" — фраза
# описывала переход между шагами, теперь это стрелка графа; "dropped: <обоснование>".
version: 1
skill: review-result
baseline: e4891f5
entries:
  - phrase: "Последние строки твоего ответа ВСЕГДА должны быть блоком"
    target: P0R3
  - phrase: "Допустимы ТОЛЬКО два статуса"
    target: P0R2
  - phrase: "Последняя строка = последнее ревью."
    target: P0R7
  - phrase: "Создание планов/тикетов"
    target: P0R1
  - phrase: "| **Стандартное ревью** | Любой тикет в `review/` | → `workflows/review.md` |"
    target: "dropped: строка таблицы маршрутизации из одной ветки. Все тикеты в review/ проходят один путь, поэтому маршрутизация выражена самим графом: вход P0E1 и переходы этапов, а не таблицей прозы"
  - phrase: "Автоматическая проверка (основной путь)"
    target: P2S1
  - phrase: "Ручная проверка (fallback)"
    target: P2S2
  - phrase: "Применяется** при выполнении **любого** из двух условий"
    target: P4R3
  - phrase: "Если хотя бы один TC содержит такую формулировку"
    target: P4R3
  - phrase: "Шаг 4.7.0 (при триггере B, без явных PNG-ссылок в тикете)"
    target: P4S1
  - phrase: "Основная проверка (для каждого скриншота)"
    target: P4S2
  - phrase: "Вердикты по скриншоту"
    target: P4S3
  - phrase: "В записи ревью указать: «VV: {что видно} → MATCH»"
    target: P4S3
  - phrase: "**Правила:**"
    target: P4S3
  - phrase: "Если относится — применяй следующую логику"
    target: P5E1
  - phrase: "PASS ревью QA-тикета** если тестировщик"
    target: P5R2
  - phrase: "FAIL ревью QA-тикета** если"
    target: P5R3
