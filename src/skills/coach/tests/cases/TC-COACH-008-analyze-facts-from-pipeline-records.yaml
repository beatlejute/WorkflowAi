id: TC-COACH-008
title: "ANALYZE берёт факт исполнения из записей пайплайна, а срабатывание канарейки не считает отказом"
origin:
  chg: ["ad-hoc-2026-10-01-analysis"]
  incidents:
    - "Анализ 2026-10-01 (PulseProxy PLAN-020, ListeningGlass PLAN-001): поля «Agent used» и Started/Completed секции результата исполнитель заполнял копией чужой строки «Истории работы» или выдумкой — своей строки он во время работы не видит, раннер дописывает её после вызова. IMPL-121: Started=Completed=02:55:37Z и «Agent used: Kilo» — это строка rate_limit другой модели, итог дал claude-opus в 03:34:18. IMPL-124, IMPL-118, QA-170, QA-174: местное время с меткой Z, сдвиг до 5 ч. IMPL-006, IMPL-010, IMPL-002: назван упавший или первый агент смены. QA-004: время 20:00 при истории 15:39. В QA-168, QA-176, QA-178 агенты дописали свои строки в «Историю работы» (QA-176: «2026-09-30 14:30:00 | … | Claude Haiku 4.5 | PASS»). Узел P30S3 коуча называл «Agent used» и «Что сделано» источниками сверки процесса, P30S6 считал время без источника."
    - "Ревью 2026-10-01: журнал запусков агентов .workflow/metrics/agent-runs.jsonl начинается в PulseProxy с 2026-09-27T11:29Z, в ListeningGlass с 2026-09-29T08:41Z, в workflowAi его нет; строки «Истории работы» пишутся местным временем без зоны, ts журнала — UTC. Без оговорки об охвате ANALYZE за длинный период объявил бы каждую строку истории «дописанной агентом»."
    - "Анализ 2026-10-01: rails report по скилу coach за 2 дня показал «P0S1 (сессия fceb2ffb…): 20» — все 20 записей были канарейкой перезапусков, а не отказами. В журнале PulseProxy канарейка — 332 записи из 1786 отказов, в ListeningGlass — 48 из 156. B1 по такому отчёту дал бы 0–5 баллов вместо 10 и ложную рекомендацию переформулировать P0S1."
  principle: "Факт исполнения — машинные записи пайплайна (журнал запусков агентов, лог пайплайна, журнал отказов, состояния сессий рельс) за период, который они покрывают, а не самоописание исполнителя в секции результата. Срабатывание канарейки — проверка живости, а не отказ (принцип 12 концепции рельс, метрика B1)."
  backlog_sources: []
tags: [analyze, evidence-based, rails, regression-guard]
severity: high

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    (L0-only тест: scenario не запускает агентов, проверяется только static
    assertion над содержимым рабочих файлов скила.)

assertions:
  static:
    # 1. Сверка процесса опирается на записи пайплайна (P30S3)
    - kind: skill_contains
      file: "workflows/analyze.md"
      pattern: "P30S3\\[\"[^\\n]*Факт исполнения — только записи пайплайна: журнал запусков агентов \\.workflow/metrics/agent-runs\\.jsonl"
      reason: "Факт исполнения (агент, модель, статус, длительность) берётся из журнала запусков агентов, который пишет пайплайн, — не из секции результата."
    - kind: skill_contains
      file: "workflows/analyze.md"
      pattern: "P30S3\\[\"[^\\n]*Секция результата, которую пишет исполнитель[^\\n]*— заявление для сверки, а не факт"
      reason: "Самоописание исполнителя («Что сделано», поля агента и времени) — заявление: в IMPL-121, IMPL-006, IMPL-010, QA-004 оно не совпадало с историей."
    - kind: skill_contains
      file: "workflows/analyze.md"
      pattern: "P30S3\\[\"[^\\n]*«История работы»[^\\n]*сверяй с журналом запусков: строку, которой в журнале нет, дописал агент"
      reason: "В QA-168/176/178 агенты дописали свои строки в «Историю работы» — история без сверки с журналом тоже не факт."
    - kind: skill_contains
      file: "workflows/analyze.md"
      pattern: "P30S3\\[\"[^\\n]*Сверка с журналом — только для запусков после его первой записи\\. Журнала нет или период раньше — «не проверено», а не finding"
      reason: "Журнал запусков начинается 27–29.09, в части проектов его нет: без охвата каждая строка истории за длинный период была бы ложной находкой."
    - kind: skill_contains
      file: "workflows/analyze.md"
      pattern: "P30S3\\[\"[^\\n]*Время строки истории — местное без часового пояса, ts журнала — UTC[^\\n]*сопоставляй по стадии, порядку запусков и сдвигу пояса"
      reason: "Строки истории и журнала сопоставляются с учётом пояса и разной подписи агента, а не по точному времени."
    - kind: skill_contains
      file: "workflows/analyze.md"
      pattern: "^(?![\\s\\S]*из «Agent used», «Что сделано», лога пайплайна)"
      reason: "Прежняя формулировка, делавшая «Agent used» источником сверки, не возвращается."
    # 2. Данные собираются, время считается по записям пайплайна (P30S1, P30S6)
    - kind: skill_contains
      file: "workflows/analyze.md"
      pattern: "P30S1\\[\"[^\\n]*журнал запусков агентов \\.workflow/metrics/agent-runs\\.jsonl"
      reason: "Источник, на который опираются P30S3 и P30S6, входит в сбор данных этапа."
    - kind: skill_contains
      file: "workflows/analyze.md"
      pattern: "P30S6\\[\"[^\\n]*время выполнения \\(среднее по типам тикетов: длительности запусков стадии исполнения из журнала запусков агентов, а не поля времени, заполненные моделью\\. За период до первой записи журнала и в проекте без журнала — «не проверено»"
      reason: "Время в Result неверно минимум в 10 тикетах одного проекта (местное время с меткой Z) — метрика времени берётся из duration_ms журнала запусков и только за период, который он покрывает."
    # 3. Канарейка — не отказ (P30S4, B1, принцип 12, шаблон отчёта)
    - kind: skill_contains
      file: "workflows/analyze.md"
      pattern: "P30S4\\[\"[^\\n]*Срабатывание канарейки[^\\n]*RAILS_CANARY: рельсы активны[^\\n]*а не отказ: в подсчёт отказов по узлу и порог повторов не входит"
      reason: "Узел поведенческого анализа отсекает канарейку: иначе 20 канареек P0S1 в одной сессии читаются как дефект формулировки узла."
    - kind: skill_contains
      file: "algorithms/rails-compliance.md"
      pattern: "\\| B1 \\| Отказы по узлу \\| `denials\\[node\\]` за период без срабатываний канарейки"
      reason: "Метрика B1 считается без канарейки."
    - kind: skill_contains
      file: "algorithms/rails-compliance.md"
      pattern: "\\*\\*Канарейка — не отказ\\.\\*\\*[^\\n]*RAILS_CANARY: рельсы активны[^\\n]*В B1–B5 такие записи не считаются[^\\n]*вычти их число по журналу"
      reason: "Правило для всех поведенческих метрик и способ вычета для журналов, где канарейка записана отказом."
    - kind: skill_contains
      file: "knowledge/rails-concept.md"
      pattern: "Третий отказ по одному узлу — узел сформулирован плохо\\. Срабатывание канарейки — проверка живости, а не отказ"
      reason: "Принцип 12 концепции — источник B1 — содержит ту же оговорку."
    - kind: skill_contains
      file: "templates/audit-report.md"
      pattern: "\\*\\*Узлы-спотыкачи \\(≥ 3 отказа в сессии, без срабатываний канарейки\\):\\*\\*"
      reason: "Строка отчёта, которую заполняют по B1, не пускает в список узел с канарейками."
