id: TC-COACH-007
title: "Черновик правила «заведи новый артефакт» отвечает, что станет со старым"
origin:
  chg: ["ad-hoc-2026-09-29"]
  incidents:
    - "workflowAi 1.16.5, 2026-09-28: коуч добавил скилу декомпозиции пробелов правило «дефект из тестирования — исправление и новый тикет повторной проверки». В PulseProxy по нему заведены FIX-032 и QA-163, а заблокированный тикет проверки QA-162 остался на доске: скилу запрещено двигать чужие тикеты. План не закрылся (69 из 70). Стейкхолдер спросил, почему создан новый тикет, а не разблокирован старый."
    - "Ревью workflowAi 1.18.0, 2026-09-29: исправляя это, коуч дал скилу декомпозиции ветки по дефекту — «исправление, которое вернёт заблокированный тикет проверки» и «новая проверка, которая его закроет». У заблокированного тикета с двумя дефектами (один исправлен, второму нужно исправление) сработали бы обе, и новая проверка закрыла бы тикет до второго исправления. Черновик называл судьбу старого тикета для каждой ветки отдельно, но не для их сочетания."
    - "Ревью workflowAi 1.18.0, 2026-09-29 (раунд 4): новое исправление с `unblocks`, само вставшее в blocked/, держало бы заблокированный тикет проверки навсегда, а каждый следующий разбор заводил бы тикеты, которые его не снимают. Черновик не отвечал, что будет, если застрянет сам новый артефакт."
  principle: "Точка контроля — черновик коуча (этап П3): правка, заводящая новый артефакт на месте существующего, обязана назвать судьбу старого и не решать её новым артефактом там, где скилу запрещено двигать чужие — нужны данные для пайплайна (узел P3R8). Ветки, выбираемые по элементу, но решающие судьбу общего старого артефакта по-разному, выбираются по артефакту."
  backlog_sources: []
tags: [draft, anti-pattern, regression-guard]
severity: high

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    (L0-only тест: scenario не запускает агентов, проверяется только static
    assertion над содержимым рабочих файлов скила.)

assertions:
  static:
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P3R7\\[\"[^\\n]*Правка, по которой скил заводит новый артефакт на месте уже существующего[^\\n]*отвечает в черновике, что станет со старым[^\\n]*не решает это новым артефактом"
      reason: "Черновик правила нового артефакта называет судьбу старого и не плодит дубль там, где скилу нельзя двигать чужие артефакты."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P3R7\\[\"[^\\n]*Скил выбирает ветку по элементу \\(gap, дефект\\), а у нескольких элементов один старый артефакт — черновик отвечает и за сочетание веток на нём: ветки, по-разному решающие судьбу старого, выбираются по артефакту, а не по элементу"
      reason: "Ревью 2026-09-29: судьба старого артефакта названа для каждой ветки, но не для их сочетания на одном артефакте — две ветки по разным дефектам закрывали бы тикет проверки до второго исправления."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P3R7\\[\"[^\\n]*Черновик отвечает и за новый артефакт, если он сам застрянет \\(заблокирован, отклонён, не выполнен\\): кто и чем снимет его и старый, которого он держит"
      reason: "Ревью 2026-09-29: застрявший новый артефакт держал бы старый навсегда, а следующие прогоны плодили бы артефакты, которые ничего не снимают."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P3R7\\[\"[^\\n]*Ответ нужен для каждого вида нового артефакта, который вводит правка \\(у каждой ветки свой\\), а не для одного"
      reason: "Ревью 2026-09-29 (раунд 6): судьба застрявшего нового артефакта названа для исправления, но не для повторной проверки — рядом с заблокированной проверкой заводилась вторая."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P3R4 --> P3R7 --> P3S1"
      reason: "Правило стоит в этапе черновика до чеклиста — там, где правка ещё не записана."
