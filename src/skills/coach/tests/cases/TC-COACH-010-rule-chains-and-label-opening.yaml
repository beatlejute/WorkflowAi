id: TC-COACH-010
title: "Грамматика узла: не больше 3 R-узлов подряд, в первых 60 символах лейбла — законченная фраза, переходное правило для существующих графов"
origin:
  chg: ["ad-hoc-2026-10-01-analysis"]
  incidents:
    - "Анализ 2026-10-01, прогоны 29–30.09: граф скила исполнения задач ведёт через цепочки R-узлов P0R1–P0R9, P3R1–P3R8, P4R1–P4R4 — 27 переходов до первой правки (медиана и в PulseProxy, n=171, и в ListeningGlass, n=31), из них 13 — правила; только переходы правило → правило — около 87 с на сессию (14–16 %). Цепочки выросли при конверсии 2026-09-23 (каждая фраза — отдельный R-узел) и от правок по инцидентам новым узлом (P4R4 2026-09-28, P3R8 2026-09-30); узел конверсии П70S3 задавал только порядок E, R, S, G/Q."
    - "Анализ 2026-10-01: у скила исполнения задач 65 из 435 отказов цитаты (14,9 %, 27 из 125 сессий) после подсказки «возьми команду перехода целиком». Готовая цитата кончалась висящим словом («…тикета, а не», «…с более чем 5»), модель дописывала фразу своими словами; у P3E1, P3R1, P2S2, P0R9 первая фраза длиннее 60 символов, в P0Q1 модель вклеила в цитату ответ ветки «да»."
    - "Ревью 2026-10-01: норма начала лейбла не имела переходного правила — в первых 60 символах нет законченной фразы у десятков лейблов коуча и ручного тестирования, а черновик сам дописывал гейты P70G1 и P10G1 с вопросом длиннее 60 символов; переходное правило для цепочек не называло снимаемое требование P3S2."
  principle: "Концепция рельс, грамматика узла: каждый узел — отдельный платный переход с цитатой, поэтому правила одной темы — один R-узел списком (не больше 3 R подряд, новое правило — пунктом в R-узел своей темы); цитата берётся из начала лейбла, поэтому в первых 60 символах — законченная фраза, вопрос G/Q — до ответов веток. Существующие цепочки и лейблы исправляются отдельной или следующей правкой узла — это исключение из P3S2 названо явно."
  backlog_sources: []
tags: [rails, anatomy, graph-grammar, regression-guard]
severity: medium

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    (L0-only тест: scenario не запускает агентов, проверяется только static
    assertion над содержимым рабочих файлов скила.)

assertions:
  static:
    # 1. Цепочки R-узлов
    - kind: skill_contains
      file: "knowledge/rails-concept.md"
      pattern: "\\*\\*Правила этапа — не цепочкой\\.\\*\\*[^\\n]*Подряд идущих `R`-узлов в этапе — не больше 3[^\\n]*дописывается пунктом в `R`-узел своей темы, а не новым узлом"
      reason: "Грамматика узла ограничивает цепочку и задаёт, куда идёт новое правило."
    - kind: skill_contains
      file: "knowledge/rails-concept.md"
      pattern: "\\*\\*Правила этапа — не цепочкой\\.\\*\\*[^\\n]*Цепочка длиннее 3 в существующем скиле — finding аудита MEDIUM[^\\n]*снимает требование узла P3S2 исправлять в той же правке цепочки, которые правка не удлиняет"
      reason: "Существующие цепочки — finding и отдельная правка; исключение называет снимаемое требование P3S2."
    - kind: skill_contains
      file: "workflows/convert.md"
      pattern: "P70S3\\[\"[^\\n]*Подряд идущих R-узлов в этапе — не больше 3: правила одной темы — один R-узел списком"
      reason: "Шаг раздачи этапов при конверсии ограничивает цепочку — там, где цепочки появились."
    - kind: skill_contains
      file: "workflows/convert.md"
      pattern: "P70G1\\{\"[^\\n]*в этапе не больше 3 R-узлов подряд"
      reason: "Гейт конверсии принуждает норму."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P3R6\\[\"[^\\n]*Новое правило этапа, где уже 3 R-узла подряд, дописывается пунктом в R-узел своей темы, а не новым узлом"
      reason: "Черновик правки по инциденту не удлиняет цепочку (P4R4 и P3R8 скила исполнения добавлены новым узлом)."
    - kind: skill_contains
      file: "knowledge/common-antipatterns.md"
      pattern: "\\| R12 \\| Рельсы \\| Цепочка из 4 и более R-узлов подряд в этапе"
      reason: "Аудит ищет цепочки по таблице антипаттернов."
    - kind: skill_contains
      file: "README.md"
      pattern: "\\| Новое правило \\|[^\\n]*в этапе, где уже 3 `R` подряд, — пунктом в `R`-узел своей темы"
      reason: "Инструкция расширения скила не противоречит норме цепочек."
    - kind: skill_contains
      file: "algorithms/graph-conversion.md"
      pattern: "подряд не больше 3 `R`: правила одной темы — один `R`-узел списком"
      reason: "Процедура конверсии согласована с узлом П70S3."
    # 2. Начало лейбла
    - kind: skill_contains
      file: "knowledge/rails-concept.md"
      pattern: "\\*\\*Начало лейбла — законченная фраза\\.\\*\\*[^\\n]*первые 60 символов лейбла вместе с префиксом[^\\n]*по последней границе фразы"
      reason: "Механизм готовой цитаты описан так, как режет раннер: по границе фразы в 60 символах."
    - kind: skill_contains
      file: "knowledge/rails-concept.md"
      pattern: "\\*\\*Начало лейбла — законченная фраза\\.\\*\\*[^\\n]*в первых 60 символах лейбла кончается законченная фраза не короче 25 символов"
      reason: "В окне готовой цитаты есть граница фразы не короче минимума цитаты."
    - kind: skill_contains
      file: "knowledge/rails-concept.md"
      pattern: "\\*\\*Начало лейбла — законченная фраза\\.\\*\\*[^\\n]*У `G` и `Q` вопрос целиком стоит в первых 60 символах"
      reason: "Ответ ветки рядом с окном цитаты агент вклеивает в цитату (P0Q1, «да»)."
    - kind: skill_contains
      file: "knowledge/rails-concept.md"
      pattern: "\\*\\*Начало лейбла — законченная фраза\\.\\*\\*[^\\n]*Лейбл существующего скила с оборванным началом — finding аудита[^\\n]*при следующей правке этого узла[^\\n]*снимает требование узла P3S2"
      reason: "Переходное правило для существующих лейблов называет снимаемое требование P3S2."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P3R6\\[\"[^\\n]*Лейбл, который правка пишет или меняет, — по грамматике узла: в первых 60 символах законченная фраза"
      reason: "Черновик правки выполняет норму для каждого узла, который пишет или меняет."
    - kind: skill_contains
      file: "workflows/convert.md"
      pattern: "P70G1\\{\"П70 ГЕЙТ: Все проверки конверсии пройдены\\?"
      reason: "Вопрос гейта конверсии укладывается в первые 60 символов лейбла."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10G1\\{\"П10 ГЕЙТ: Новый скил прошёл валидацию\\?[^\\n]*в первых 60 символах каждого лейбла — законченная фраза"
      reason: "Гейт CREATE короткий в начале и проверяет норму начала лейбла у нового скила."
    - kind: skill_contains
      file: "knowledge/skill-anatomy.md"
      pattern: "\\*\\*Граф ядра\\*\\*[^\\n]*не больше 3 `R` подряд[^\\n]*в первых 60 символах лейбла — законченная фраза"
      reason: "Эталон качества графа содержит обе нормы."
    - kind: skill_contains
      file: "knowledge/common-antipatterns.md"
      pattern: "\\| R13 \\| Рельсы \\| В первых 60 символах лейбла нет законченной фразы"
      reason: "Аудит ищет оборванное начало лейбла."
