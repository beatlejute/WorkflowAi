id: TC-COACH-002
title: "Coach начинает анализ с root cause первого порядка, а не с формулировок"
origin:
  chg: [CHG-038, CHG-046, CHG-098]
  incidents:
    - "workflowAi: CHG-038 — повторный инцидент коллизии ID после текстового усиления"
    - "PulseProxy: CHG-046 — уход в формулировки вместо root cause"
    - "workflowAiVsCode: CHG-098 — рационализация «формулировка достаточна»"
  principle: "Root Cause First (#1) + Evidence-Based (#2)"
  backlog_sources:
    - ".workflow/coach-backlog.yaml"
    - "d:/Dev/PulseProxy/.workflow/coach-backlog.yaml"
    - "d:/Dev/workflowAiVsCode/.workflow/coach-backlog.yaml"
tags: [root-cause, evidence-based, anti-pattern]
severity: critical

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    Стейкхолдер просит: «Агент выполнил тикет, но файлы не созданы — только stdout показал "успех".
    Это уже второй раз за неделю. Разберись.»
  inputs:
    - kind: inline
      as: incident_description
      content: |
        Инцидент: execute-task агент (claude-sonnet) заявил ✅ в stdout,
        но в тикете Result пуст, DoD 0/5. Файл knowledge/test-authorship.md
        не создан. Инструкция против «призрачного выполнения» уже есть
        в execution-strategy.md — commit-дата этой правки (текстовое усиление):
        2026-04-10. Тикет-нарушитель XXX-054: completed_at: 2026-04-17. Два
        агента проигнорировали инструкцию.

assertions:
  static:
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "[Rr]oot.?[Cc]ause"
      reason: "Принцип Root Cause First должен быть в SKILL.md коуча."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "машинн.+защит"
      reason: "Эскалация в машинную защиту при повторном инциденте."
    # 2026-09-28, коррекция стейкхолдера: конфликт «правило исполнителя против механической
    # проверки» коуч отнёс к исполнителю, а дефект был в определении критерия.
    - kind: skill_contains
      file: "knowledge/incident-analysis.md"
      pattern: "Антипаттерн «правило против проверки»:[^\\n]*может ли правильно сделанная работа этого тикета его пройти[^\\n]*дефект определения критериев[^\\n]*а не в исполнителе"
      reason: "Прежде чем винить правило исполнителя, коуч проверяет, выполним ли сам критерий для правильной работы тикета."

    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P0R1\["[^"]*Каноническая правка скила обязательна для самой коррекции только, если evidence подтверждает пробел, противоречие или недостаточный механизм в инструкции[.;] Тест-кейс коуча обязателен по П5'
      reason: "Каноническая правка требует доказанного дефекта инструкции; обязательный тест-кейс по П5 не доказывает необходимость такой правки."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P0R1\["[^"]*Если evidence подтверждает, что требование применимо, выполнимо и непротиворечиво, но агент пропустил предписанное действие, выполни его без фиктивной правки скила'
      reason: "Доказанное нарушение выполнимого правила исправляется выполнением пропущенного действия."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P0R1\["[^"]*Недостаток evidence означает «не проверено», а не ошибку исполнения'
      reason: "Неизвестные данные не превращаются в finding об ошибке исполнения."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P7S1\["[^\"]*Сам факт коррекции не доказывает дефект инструкции или ошибку исполнения'
      reason: "Коррекция запускает диагностику, но не доказывает дефект текста."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P7S1\["[^\"]*Недостаток evidence означает «не проверено», а не ошибку исполнения'
      reason: "Недостаток evidence оставляет причину неизвестной."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P7S2\["[^\"]*Если evidence подтвердил пробел, противоречие или недостаточный механизм в инструкции, исправь её на стадии, где проверка пропущена'
      reason: "Коуч усиливает инструкцию, только если diagnosis подтверждает дефект механизма."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P7Q1\{"[^\"]*выполни пропущенное действие без фиктивной правки скила'
      reason: "Известный промах исполнения закрывается фактическим действием, не фиктивной правкой."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P7Q2\{"[^\"]*Если причина не установлена, собери evidence дальше'
      reason: "Неизвестные данные не используются для обвинения или правки."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P7S2\["[^\"]*Повторный инцидент и обязательная эскалация определяются по П2S5–П2S6 и остаются в силе'
      reason: "Условная правка сохраняет повторный инцидент и эскалацию."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P0R1\["[^\"]*не отменяет требуемую основной задачей правку скила и её обязательный регрессионный тест'
      reason: "Обработка коррекции не отменяет отдельные обязательные действия основной задачи."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P7S1\["[^\"]*редакцию требования, реально действовавшую в момент события, её применимость, выполнимость и непротиворечивость, а также фактическое действие агента'
      reason: "Диагностика проверяет действовавшее требование и фактическое действие."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P7S1 --> P7G2'
      reason: "Каждая коррекция проходит обязательный evidence gate."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P7G2 -->.*нет.*P1E1'
      reason: "Недостаток evidence возвращает к сбору данных, а не к обвинению."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P7G2 -->.*да.*P7Q2'
      reason: "Достаточное evidence переходит к выбору доказанной причины."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P7Q2 -->.*дефект инструкции.*P7S2'
      reason: "Доказанный дефект инструкции идёт на правку источника."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P7Q2 -->.*доказанное нарушение.*P7Q1'
      reason: "Доказанная ошибка исполнения идёт к выполнению пропущенного действия."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P7Q2 -->.*причина не установлена.*P1E1'
      reason: "Неустановленная причина возвращается к сбору evidence."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P7S2 --> P4E1'
      reason: "Доказанный дефект проходит через штатный этап правки."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P7Q1\{"[^\"]*выполни пропущенное действие без фиктивной правки скила'
      reason: "Ошибка исполнения устраняется действием, не фиктивной канонической правкой."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: '^(?![\s\S]*P7S1 --> P7S2 --> P4E1)[\s\S]*$'
      reason: "Безусловный переход от диагностики к правке запрещён."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: '^(?![\s\S]*P7Q2 -->.*причина не установлена.*P7Q1)[\s\S]*$'
      reason: "Неизвестная причина не классифицируется как ошибка исполнения."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: '^(?![\s\S]*P7Q2 -->.*дефект инструкции.*P4E1)[\s\S]*$'
      reason: "Дефект не обходит назначенный этап его обработки."

    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P2E1 --> P2S7 --> P2Q2'
      reason: "Классификация evidence предшествует положительной атрибуции."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P2Q2 -->\|"подтверждённый skill finding"\| P2S1'
      reason: "Подтверждённый finding входит в прежнюю процедуру атрибуции."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P2S1 --> P2S2 --> P2S3 --> P2S4 --> P2G1'
      reason: "Положительная ветка сохраняет проверку физического скил-источника."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P2G1 -->\|"да"\| P2S5'
      reason: "Атрибуция не обходит проверку повторного инцидента."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P2Q2 -->\|"достаточный bounded анализ без finding"\| P2G2'
      reason: "Отрицательный результат проходит отдельный гейт достаточности."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P2G2 -->\|"да"\| P6E1'
      reason: "Отрицательный анализ сохраняет применимый бэклог и последующий П7."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P2G2 -->\|"нет"\| P1E1'
      reason: "Неполное покрытие возвращается к evidence."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P2Q2 -->\|"недостаток evidence"\| P1E1'
      reason: "Недостаток данных не становится отрицательным итогом."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P2S7\["[^"\n]*конечный manifest[^"\n]*исторические и ранее закрытые пункты[^"\n]*оставшиеся обязательства основной задачи'
      reason: "Реестр включает источники, исторические пункты и обязательства."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P2G2\{"[^"\n]*Все обязательные источники согласованного manifest прочитаны[^"\n]*необработанных подтверждённых findings и невыполненных обязательств основной задачи нет'
      reason: "Отрицательный итог не скрывает непрочитанное, findings или основную задачу."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P2G2\{"[^"\n]*«не проверено» по обязательному пункту исключает ответ «да»'
      reason: "Неизвестное по обязательному пункту не становится отрицательным доказательством."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P2Q2\{"[^"\n]*Подтверждённый skill finding имеет приоритет'
      reason: "Отрицательная и внешняя ветки не маскируют skill finding."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P2Q2 -->\|"доказанный внешний незавершённый остаток"\| P2S8'
      reason: "Внешняя передача требует доказанного незавершённого остатка."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P2S8 --> P7E1'
      reason: "Внешняя передача не обходит П7."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P7Q1 -->\|"к передаче вне компетенции"\| P0H1'
      reason: "Передача использует существующий out_of_scope-контракт."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P0R1\["[^"\n]*не снимает требуемую основной задачей правку, её регрессионный тест'
      reason: "Отрицательный анализ не отменяет основную работу."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P0R1\["[^"\n]*Недостаток evidence[^"\n]*RAILS_OUTCOME: needs_user[^"\n]*но не успешное завершение'
      reason: "Недостаток данных допускает честную паузу, не успех."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P5E1\["[^"\n]*Единственное исключение для отрицательного результата ANALYZE — доказанный исход P2G2'
      reason: "Освобождение от фиктивного теста ограничено доказанным отрицательным исходом."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P8S1\["[^"\n]*повторно проверь актуальность условий P2G2 после П7'
      reason: "Перед итогом повторно проверяется актуальность покрытия после коррекций."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P8S1\["[^"\n]*verdict=no_new_skill_findings[^"\n]*не выдумывай блок ---RESULT--- или passed'
      reason: "Отрицательный отчёт не подменяет непройденный тест успешным."
    - kind: skill_contains
      file: "workflows/analyze.md"
      pattern: 'P30S7\["[^"\n]*не заполняй квоту выдуманными findings[^"\n]*классификацию П2'
      reason: "Выводы ANALYZE не требуют фиктивного finding."
    - kind: skill_contains
      file: "workflows/analyze.md"
      pattern: 'P30S7 --> P1E1'
      reason: "Результат ANALYZE проходит evidence-проверку перед классификацией."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: '^(?![\s\S]*P2E1 --> P2S1)(?![\s\S]*P2Q2 -->[^\n]*P8)(?![\s\S]*P2G2 -->\|"нет"\| P[678])[\s\S]*$'
      reason: "Нет обхода классификации или гейта прямым отчётом."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P1G1\{"[^"\n]*Положительная атрибуция требует проверки всей необходимой для доказательства истории'
      reason: "Положительная атрибуция сохраняет доказательную историю."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P1G1\{"[^"\n]*Для bounded отрицательного анализа обработай согласованный конечный manifest'
      reason: "Отрицательная проверка ограничена согласованным конечным покрытием."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P1G1\{"[^"\n]*Неизвестная история явно ограничивает выводы: по ней не утверждай отсутствие дефекта и не назначай виновника'
      reason: "Неизвестная история не доказывает отсутствие дефекта или виновность."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P1G1\{"[^"\n]*Непрочитанный обязательный источник означает недостаток evidence: нельзя самостоятельно объявить его необязательным ограничением'
      reason: "Обязательный источник нельзя самовольно исключить из покрытия."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P2S7\["[^"\n]*Самостоятельно исключать обязательный источник из manifest или объявлять его необязательным ограничением запрещено'
      reason: "Реестр не позволяет превратить непрочитанный обязательный источник в ограничение."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P6S1\["[^"\n]*существующую структуру analyzed_tickets[^"\n]*если её поля подтверждены реальными данными'
      reason: "Служебная запись использует существующую структуру и реальные данные."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P6S1\["[^"\n]*Не выдумывай ticket IDs, scores или новые структуры[^"\n]*Если применимой записи нет[^"\n]*не создавая фиктивную запись'
      reason: "Отрицательный отчёт не порождает выдуманные идентификаторы и оценки."
    - kind: skill_contains
      file: "workflows/analyze.md"
      pattern: 'P30S7\["[^"\n]*Неприменимые разделы шаблона обозначь «неприменимо», неизмеренные показатели — «неизмерено»[^"\n]*не выдумывай оценки и не требуй три проблемы ради квоты'
      reason: "Шаблон не вынуждает фиктивные проблемы или оценки."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P2S8\["[^"\n]*Только доказанно внешний незавершённый запрос или остаток вне роли допускает эту ветку'
      reason: "Передача ограничена реально незавершённой внешней работой."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P2S8\["[^"\n]*REQUEST — точный передаваемый запрос или остаток[^"\n]*REASON — доказанное основание[^"\n]*DONE — фактически выполненное[^"\n]*REMAINING — конкретная незавершённая работа'
      reason: "Передача сохраняет точный запрос, причину, выполненное и остаток."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P2Q2\{"[^"\n]*Принятые исправленные инфраструктурные findings[^"\n]*не требуют передачи всего аудита и не блокируют отрицательный вывод'
      reason: "Закрытая инфраструктурная находка не принуждает handoff всего аудита."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P7Q1\{"[^"\n]*только для подготовленного в P2S8 доказанно внешнего незавершённого запроса или остатка без необработанных skill findings'
      reason: "Возврат к handoff после П7 не обходит приоритет skill finding."

  deterministic:
    # Регистронезависимо и с русским синонимом: `output_contains_all` сравнивает через
    # includes() с учётом регистра — прогон 2026-09-22 не засчитал «Root cause»,
    # «Машинная защита» и «Причина первого порядка» (формулировка узла П2 коуча).
    - kind: output_matches
      regex: "[Rr][Oo][Oo][Tt].?[Cc][Aa][Uu][Ss][Ee]|[Пп]ричин\\S* перв\\S* порядк"
    - kind: output_matches
      regex: "[Мм]ашинн"
    - kind: output_does_not_contain
      values: ["формулировк достаточн", "наблюдать"]

  rubric:
    - kind: llm_judge
      rubric_file: "../rubrics/root-cause-first.md"
      criterion: "Начинает ли коуч с невыполненного действия (1-й порядок), а затем анализирует почему инструкции допустили?"
      pass_threshold: 4
      trials: 3
      aggregate: majority

execution:
  timeout_s: 1200
