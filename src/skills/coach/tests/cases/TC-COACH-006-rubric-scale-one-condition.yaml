id: TC-COACH-006
title: "Coach строит шкалу рубрики по одному условию на балл и покрывает ветку без срабатывания триггера"
origin:
  chg: []
  incidents:
    - "workflowAi 2026-09-24: пилот сравнения судей на 201 сохранённом вызове — 18 расхождений вердикта; поштучный разбор показал, что часть из них не решается ни одним судьёй, потому что ответ закрывает половину составного уровня"
  principle: "Шкала рубрики — один балл, одно условие (П5R3)"
  backlog_sources:
    - ".workflow/coach-backlog.yaml"
tags: [rubric-scale, test-authorship, anti-pattern]
severity: high

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    Стейкхолдер просит: «Два разных судьи поставили одному и тому же ответу
    разные баллы по этой рубрике, и оба сослались на её текст. Ответ был такой:
    артефакт получился один, в нём 5 пунктов, в выводе агента строка
    "Атомарность: 5 пунктов < порог 7". Разберись и перепиши шкалу так, чтобы
    у такого ответа был единственный балл.»
  inputs:
    - kind: file
      path: "../fixtures/rubric-compound-scale.md"
      as: rubric_under_review

assertions:
  static:
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "Шкала рубрики — один балл, одно условие"
      reason: "Норма построения шкалы должна стоять узлом графа на этапе тестирования."
    - kind: skill_contains
      file: "knowledge/test-authorship.md"
      pattern: "закрывающий ровно половину любого уровня"
      reason: "Проверка шкалы перед сохранением должна быть в руководстве по авторству тестов."

  # L1 не применим: коуч перестраивает шкалу в тексте ответа свободной формой,
  # детерминированной сигнатуры у такого вывода нет.

  rubric:
    - kind: llm_judge
      rubric_file: "../rubrics/rubric-scale-one-condition.md"
      criterion: "Перестроил ли коуч шкалу так, что каждый балл проверяет одно условие, ветка без срабатывания триггера получила свой балл, проза баллов не назначает, а уровни ссылаются только на доставленное судье доказательство?"
      pass_threshold: 4
      trials: 3
      aggregate: majority

execution:
  timeout_s: 2400
