id: TC-COACH-009
title: "Финальный ответ и литералы final_requires — в лейбле терминального узла: шаблон нового скила, анатомия, конверсия, S10"
origin:
  chg: ["ad-hoc-2026-10-01-analysis"]
  incidents:
    - "Анализ 2026-10-01, журналы рельс трёх проектов 27–30.09: у скила исполнения задач 8 stop_block на нетерминальном P7S1 у claude-haiku (в том числе QA-164, QA-169, QA-171, QA-176; не хватало только позиции) и 3 на P7S2 без RESULT; у скила отчётов — 5 блоков на P6S2 (литерала ---RESULT--- нет ни в одном узле); у скилов декомпозиции — 3 и 2, у скила планирования — 5, у скила ручного тестирования — 2 на P9S1 (27.09, нет ---RESULT--- и status). У бесплатных моделей через kilo 4 повтора output-check на терминале: «Выведи блок ---RESULT---» выполнено командой echo, у IMPL-117 попытка потеряна."
    - "Физический источник — шаблон коуча templates/new-skill.md: P9S1 «Обязательные строки ответа: RAILS: P9S2, status=значение, Файлы: список», P9S2 «Остановиться», terminal: [P9S2]; по нему шла конверсия 23–24.09. Контрольная группа — скил, у которого весь формат ответа в лейбле терминала, — ни одного stop_block на терминале."
    - "Ревью 2026-10-01: у одного скила выражение final_requires многострочное и привязано к концу ответа — с лейблом оно не совпадёт ни при какой правке, поэтому S10 проверяет его литеральные маркеры; ответ в нетерминальных узлах вида «<ветка> — финальный ответ: …» закрытый список начал лейбла («Выведи», «Сообщи») не ловил."
  principle: "Концепция рельс, принцип 9 (рельсы на выходе): агент видит лейбл узла, где отвечает, поэтому действие «финальный ответ», оговорка «текстом, не командой оболочки» и литералы всех output.final_requires стоят в лейбле терминального узла; узел перед ним собирает содержание, но ответа не выводит."
  backlog_sources: []
tags: [rails, anatomy, output-layer, regression-guard]
severity: high

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    (L0-only тест: scenario не запускает агентов, проверяется только static
    assertion над содержимым рабочих файлов скила.)

assertions:
  static:
    # 1. Шаблон нового скила — физический источник формы
    - kind: skill_contains
      file: "templates/new-skill.md"
      pattern: "P9S2\\[\"П9 ШАГ: Финальный ответ — текстом, не командой оболочки\\.[^\\n]*RAILS: P9S2, status=значение, Файлы: список"
      reason: "Литералы final_requires шаблона и оговорка «не командой оболочки» — в лейбле терминала P9S2."
    - kind: skill_contains
      file: "templates/new-skill.md"
      pattern: "P9S1\\[\"П9 ШАГ: Собери содержание отчёта, но ответ здесь не выводи\\.[^\\n]*одним сообщением в P9S2"
      reason: "Предпоследний узел собирает содержание, но ответа не выводит."
    - kind: skill_contains
      file: "templates/new-skill.md"
      pattern: "^(?![\\s\\S]*P9S2\\[\"П9 ШАГ: Остановиться\"\\])"
      reason: "Терминал «Остановиться» без формата ответа не возвращается в шаблон."
    # 2. Анатомия, концепция, антипаттерны
    - kind: skill_contains
      file: "knowledge/skill-anatomy.md"
      pattern: "\\*\\*Этап отчёта\\*\\*[^\\n]*терминальный `S` \\(узел в `terminal`\\): «Финальный ответ — текстом, не командой оболочки», литералы всех `output\\.final_requires`"
      reason: "Эталон анатомии задаёт литералы и оговорку в лейбле терминала."
    - kind: skill_contains
      file: "knowledge/skill-anatomy.md"
      pattern: "\\*\\*Этап отчёта\\*\\*[^\\n]*Узел вне `terminal` и `pause_nodes` не велит дать ответ на нём самом"
      reason: "Ответ на нетерминальном узле — нарушение: claude-haiku отвечал на P7S1 скила исполнения."
    - kind: skill_contains
      file: "knowledge/rails-concept.md"
      pattern: "\\*\\*Рельсы стоят и на выходе\\.\\*\\*[^\\n]*Литералы обязательных строк и оговорка «текстом, не командой оболочки» стоят в лейбле терминального узла"
      reason: "Принцип 9 концепции — источник нормы."
    - kind: skill_contains
      file: "knowledge/common-antipatterns.md"
      pattern: "\\| R14 \\| Рельсы \\| Строки финального ответа вне терминального узла"
      reason: "Аудит ищет ответ вне терминала по таблице антипаттернов."
    # 3. Статическая проверка, конверсия, создание
    - kind: skill_contains
      file: "algorithms/rails-compliance.md"
      pattern: "\\| S10 \\| Финальный ответ — в терминале \\|[^\\n]*каждое выражение `output\\.final_requires`[^\\n]*находит совпадение в лейбле узла из `terminal`[^\\n]*проверяется по его литеральным маркерам[^\\n]*не велит дать ответ на нём самом[^\\n]*`final_requires` ради S10 не меняется"
      reason: "S10: литералы final_requires в лейбле терминала (многострочное выражение — по маркерам), оговорка, критерий ответа вне терминала; ослаблять final_requires ради балла нельзя."
    - kind: skill_contains
      file: "algorithms/rails-compliance.md"
      pattern: "\\| B4 \\|[^\\n]*сначала проверь S10"
      reason: "Остановки выходного слоя ведут к статической причине."
    - kind: skill_contains
      file: "workflows/convert.md"
      pattern: "P70S5\\[\"[^\\n]*Лейбл терминального узла — «Финальный ответ — текстом, не командой оболочки» с литералами всех выражений output\\.final_requires"
      reason: "Конверсия пишет граф и rails.yaml и сразу ставит литералы в лейбл терминала — иначе следующая конверсия воспроизведёт дефект."
    - kind: skill_contains
      file: "workflows/convert.md"
      pattern: "P70G1\\{\"[^\\n]*литералы output\\.final_requires стоят в лейбле терминального узла"
      reason: "Гейт конверсии принуждает норму."
    - kind: skill_contains
      file: "workflows/create.md"
      pattern: "P10G1\\{\"[^\\n]*литералы output\\.final_requires стоят в лейбле терминального узла"
      reason: "Гейт CREATE проверяет ту же норму для скила, созданного по шаблону."
    - kind: skill_contains
      file: "algorithms/graph-conversion.md"
      pattern: "терминальный узел — в `terminal`; его лейбл — «Финальный ответ — текстом, не командой оболочки» с литералами всех `output\\.final_requires`"
      reason: "Процедура конверсии согласована с узлом П70S5."
    - kind: skill_contains
      file: "templates/audit-report.md"
      pattern: "Структурные \\(S1–S10, `algorithms/rails-compliance\\.md`\\)"
      reason: "Отчёт аудита считает структурные проверки вместе с S10."
    # 4. Граф самого коуча
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P8S2\\[\"П8 ШАГ: Финальный ответ — текстом, не командой оболочки\\.[^\\n]*RAILS: P8S2, verdict=значение, Файлы: список"
      reason: "Терминал коуча несёт свои литералы final_requires."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P8S1\\[\"П8 ШАГ: Собери содержание отчёта, но ответ здесь не выводи\\.[^\\n]*одним сообщением в P8S2"
      reason: "Предпоследний узел коуча ответа не выводит."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P8S1\["[^\n]*проверь фактический узел командой status[^\n]*вне terminal или pause_nodes продолжай разрешённые переходы[^\n]*не повторяй отклонённый ответ'
      reason: "Перед ответом проверяется фактическая позиция, а блокировка не превращается в повтор того же ответа."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P8S1\["[^\n]*Номер RAILS берётся из состояния, не из намерения перейти[^\n]*Служебный вывод хука не заменяет человеческий итог'
      reason: "Итог содержит реальное состояние и ответ человеку, а не имитацию служебного вывода."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P8S1\["[^\n]*Отказ инструмента укажи как блокировку[^\n]*разрешение в чате не меняет машинную область записи'
      reason: "Запрет записи сообщается честно и не снимается одним разрешением в чате."
