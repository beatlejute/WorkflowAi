# H2 — git и регистрация хуков.
deny_shell:
  - pattern: "\\bgit\\s+(commit|add|push|checkout|switch|restore|reset|rebase|merge|stash|tag|rm|mv)\\b"
    reason: "Коуч не выполняет git-операции — коммит делает исключительно пользователь"
    incident: "SKILL.md P0R4 «Коуч не выполняет git-операции»"
  - pattern: "\\bworkflow\\s+init\\b|\\binit\\.mjs\\b"
    reason: "Регистрацию хуков и перегенерацию реестра агентов выполняет только человек командой workflow init"
    incident: "knowledge/rails-concept.md принцип 17 «Рельсы, которые агент может снять сам, — не рельсы»"
deny_mcp:
  - git_commit
  - git_create_branch
  - git_open_pr
  - create_ticket
  - create_coach_ticket
  - move_ticket
  - start_pipeline
  - resume_pipeline
  - approve_step
  - resolve_human_ticket

# H3 — действие только на своём этапе. E-узел этапа прозрачен: нужен R/S/G/Q.
stage_actions:
  edit_skill:
    kind: [edit, write]
    match: ".workflow/src/skills/**"
    stages: [4, 5, 10, 70]
  edit_shared:
    kind: [edit, write]
    match: ".workflow/shared/**"
    stages: [4, 5, 10, 70]
  edit_backlog:
    kind: [edit, write]
    match: ".workflow/coach-backlog.yaml"
    stages: [6]
  next_test_id:
    kind: [shell]
    match: "(^|[;&|(]\\s*)node(\\.exe)?\\s+\\S*get-next-test-id\\.js"
    stages: [5]
  run_tests:
    kind: [shell]
    match: "(^|[;&|(]\\s*)node(\\.exe)?\\s+\\S*run-skill-tests\\.js"
    stages: [5]
    max_per_session: 3

# H4 — потолки. from == to означает возврат к узлу, определённому в этапе раньше текущего.
cycles:
  - { from: 5, to: 4, max: 3, reason: "Три круга «правка → тест» не сошлись — выход к человеку: сообщи, что именно не сходится" }
  - { from: 1, to: 1, max: 3, reason: "Гейт evidence не проходит трижды — выход к человеку с перечнем утверждений без цитаты" }
  - { from: 2, to: 2, max: 3, reason: "Гейт диагноза не проходит трижды — выход к человеку с текущей гипотезой" }
  - { from: 3, to: 3, max: 3, reason: "Чеклист черновика не проходит трижды — выход к человеку с непройденными вопросами" }
  - { from: 4, to: 4, max: 3, reason: "Self-check правки не проходит трижды — выход к человеку с найденным нарушением" }
  - { from: 10, to: 10, max: 3, reason: "Валидация нового скила не проходит трижды — выход к человеку" }
  - { from: 70, to: 70, max: 3, reason: "Покрытие или checker не сходятся трижды — выход к человеку с пропущенными фразами" }

# H5 — выходной слой: финальный ответ только в terminal и pause_nodes, с обязательными строками.
output:
  final_requires:
    - "RAILS:\\s*P\\d+[ERSGQ]\\d+"
    - "verdict\\s*="
    - "Файлы:"
  pause_requires:
    - "RAILS:\\s*P\\d+[ERSGQ]\\d+"
  max_stop_blocks: 2
