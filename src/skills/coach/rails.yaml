# Конфиг гардов rails для скила coach. Машинный конфиг хука, не проза.
# Схема — .workflow/src/rails/README.md §4. Правки этого файла коуч не делает (write_deny):
# гарды коуча ослабляет или усиливает только человек.
version: 1
skill: coach
entry: P0E1
terminal: [P8S2]
pause_nodes: [P3S5, P10S2]
fragments: ["workflows/*.md"]
quote_min: 25
canary: "echo RAILS_CANARY"

# H1 — запись только в область скилов, shared knowledge проекта и бэклог коуча.
# Инциденты 2026-09-21: пробный запуск коуча в песочнице теста правил канонический файл
# чужого скила; фикстура декомпозиции создала реальные тикеты в проекте.
# .workflow/shared/ — с 2026-09-30: shared проекта вынесен из каталога скилов
# (PulseProxy DOCS-014), коуч по-прежнему переносит в него проектную специфику (P3S1).
write_scope:
  - ".workflow/src/skills/**"
  - ".workflow/shared/**"
  - ".workflow/coach-backlog.yaml"
  - 'C:\Users\Denis\.claude\plans\keen-forging-comet.md'
  - 'D:\Dev\workflowAi\src\rails\paths.mjs'
  - 'D:\Dev\workflowAi\src\rails\core.mjs'
