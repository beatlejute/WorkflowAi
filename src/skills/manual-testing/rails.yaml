# Рельсы скила manual-testing (CONVERT 2026-09-24).
# Схема — .workflow/src/rails/README.md §4. Гард добавляется только по инциденту с датой и
# ценой — источники в tests/cases/*.origin.incidents. Правки этого файла делает человек.
version: 1
skill: manual-testing
entry: P0E1
terminal: [P9S2]
pause_nodes: []
fragments: ["workflows/*.md"]
quote_min: 25
canary: "echo RAILS_CANARY"

# H1 — область записи. Тестировщик пишет результаты в собственный тикет в in-progress/,
# артефакты evidence — в reports/ в корне проекта, а ассерты для не-UI инвариантов — рядом
# с тестами проекта (узел P0R4: это легитимная работа QA).
write_scope:
  - "**"
allow_temp: true

# H2 — запреты записи. Создание тикета — исключительная зона скилов декомпозиции:
# инцидент 2026-05-02 — исполнитель в роли тестировщика создал парный тикет в backlog,
# чтобы делегировать live-проверки UI человеку; стейкхолдер откатил созданное, проверки
# так и не выполнены. Аудит 2026-09-21 (CRITICAL) нашёл ту же инструкцию в двух файлах
# скила («создай тикет» при блокировке инструмента) — текст исправлен, гард закрывает
# действие. Правка плана, отчёта и чужих колонок доски — работа других стадий.
write_deny:
  - ".workflow/tickets/backlog/**"
  - ".workflow/tickets/ready/**"
  - ".workflow/tickets/review/**"
  - ".workflow/tickets/done/**"
  - ".workflow/plans/**"
  - ".workflow/reports/**"
  - ".workflow/config/**"
  - ".workflow/src/skills/manual-testing/rails.yaml"
  - ".workflow/src/skills/manual-testing/tests/rails/**"
  - ".workflow/src/rails/**"

# H3 — чужие стадии. Перемещение тикета и выделение ID нового тикета не входят в работу
# тестировщика: узел P5R2 — перемещение ломает пайплайн (тикет оказывается в done/ без
# ревью, auto-correct возвращает его в backlog), узел P0R6 — создание тикетов запрещено
# (инцидент 2026-05-02).
deny_shell:
  - pattern: "\\bmove-ticket(\\.js)?\\b"
    reason: "Перемещение тикета — стадия пайплайна, тестировщик тикет не двигает"
    incident: "SKILL.md P5R2: тикет окажется в done/ без ревью (инцидент 2026-05-02)"
  - pattern: "\\b(mv|rename|Move-Item)\\b[^\\n]*\\.workflow[\\\\/]tickets"
    reason: "Перемещение файла тикета запрещено"
    incident: "SKILL.md P5R2: ручное перемещение ломает пайплайн"
  - pattern: "\\bget-next-id(\\.js)?\\b"
    reason: "Выделение ID нового тикета — зона скилов декомпозиции, не тестирования"
    incident: "SKILL.md P0R6: парный тикет для делегирования, инцидент 2026-05-02"

deny_mcp:
  - create_ticket
  - move_ticket
  - start_pipeline

# H4 — действия по этапам. Результат TC пишется в тикет сразу по ходу проверки (узел P0S5),
# отметки DoD — на self-check: запись в тикет разрешена на этапах работы и на этапе 5.
# Артефакты evidence пишутся там же, где проверка, и вычищаются на self-check (узел P5S4).
stage_actions:
  edit_ticket:
    kind: [edit, write]
    match: ".workflow/tickets/in-progress/**"
    stages: [5, 10, 20, 30, 40, 50]
  write_evidence:
    kind: [edit, write]
    match: "reports/**"
    stages: [5, 10, 20, 30, 40, 50]

# H5 — потолки циклов. from == to — возврат гейта к шагам своего этапа. Порог «TC дороже
# 12 MCP-вызовов равно BLOCKED» и экономный режим — algorithms/mcp-budget.md.
cycles:
  - { from: 5, to: 5, max: 3, reason: "Три круга по self-check не сошлись — перечисли в выводе, какой пункт не выполняется, и заверши со status blocked" }
  - { from: 10, to: 10, max: 3, reason: "Три круга «проверки не сходятся» не сошлись — зафиксируй BLOCKED по незакрытым сценариям и остановись" }
  - { from: 20, to: 20, max: 3, reason: "Три круга по набору регрессии не сошлись — зафиксируй BLOCKED по незакрытым тест-кейсам и остановись" }
  - { from: 30, to: 30, max: 3, reason: "Три круга исследования не сошлись — запиши покрытые и непокрытые области и остановись" }
  - { from: 40, to: 40, max: 3, reason: "Три круга по AC не сошлись — вердикт PARTIALLY ACCEPTED с перечислением заблокированных AC" }
  - { from: 50, to: 50, max: 3, reason: "Три круга проектирования тест-кейсов не сошлись — перечисли непокрытые требования и остановись" }

# H6 — выходной слой. Финальный ответ разрешён только в терминале и обязан нести блок
# результата: без него следующая стадия не знает исхода проверки. Упоминание созданного
# тикета в выводе запрещено — инцидент 2026-05-02: делегирование через парный тикет
# обошло зону декомпозиции, стейкхолдер откатил созданное.
output:
  final_requires:
    - "RAILS:\\s*P9S2"
    - "verdict\\s*="
    - "Файлы:"
    - "---RESULT---"
    - "status:\\s*(default|blocked)"
  final_forbids:
    - "HUMAN-тикет"
    - "созда(л|н|ны|ние|ю)[^\\n]{0,40}тикет"
  max_stop_blocks: 2
