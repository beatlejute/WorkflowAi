      pattern: "^(?![\\s\\S]*(\\b(analyze-report|coach|create-plan|create-report|decompose|deep-research|execute-task|review-result)\\b|\\b(GML|PMA|CSM|CRO|PMK)\\b|workflowAiVsCode|PulseProxy|documentaions|\\b(REPORT|PLAN|HUMAN|IMPL|FIX|COACH|ADMIN|ARCH|RSH|ANL|RPT|CHG|QA)-[0-9]{1,4}\\b|sandbox-desktop|CLAUDE\\.md))"
