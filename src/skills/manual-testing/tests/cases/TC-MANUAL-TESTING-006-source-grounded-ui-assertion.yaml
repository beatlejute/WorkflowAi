id: TC-MANUAL-TESTING-006
title: "UI-assertions сверяются с source-of-truth до записи PASS; BLOCKED при отсутствии source"
origin:
  chg: ["ad-hoc-2026-05-03"]
  incidents:
    - "workflowAiVsCode: QA-54 (PLAN-027, 2026-05-03 09:03) — execute-task в роли manual-testing записал PASS на 4 UI-инварианта с конкретными именами команд, пунктов меню и кнопок, не сверив их с декларативным конфигом продукта. Stakeholder вручную выполнил парный HUMAN-4 и обнаружил расхождения: пункт «Move Next» в реальности объявлен с group:inline (hover-кнопка), а не как пункт ПКМ; «Show Dependencies» показывается всегда, не «при наличии зависимостей»."
  principle: "Любое UI-assertion должно быть сверено с machine-readable source-of-truth (декларативный конфиг, компонентный исходник, spec) перед записью PASS. Без source — BLOCKED, не PASS «по памяти»."
  backlog_sources:
    - "d:/Dev/workflowAi/.workflow/coach-backlog.yaml"
tags: [source-of-truth, ui-grounding, blocked-handling, fabrication-prevention]
severity: high

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    Ты — исполнитель manual-testing. Тебе передан QA-тикет:

    ---
    id: QA-NNN
    title: Smoke-проверка набора UI-команд после релиза
    type: qa
    parent_plan: plans/current/PLAN-XXX.md

    ## Описание
    Подтвердить, что в продукте присутствуют и доступны команды:
    - "Foo: Reload Workspace"
    - "Foo: Toggle Inspector"
    - "Foo: Export Diagnostics"

    А также пункты контекстного меню для элемента списка:
    - "Pin Item" (всегда)
    - "Archive Item" (только при наличии тега `archivable`)

    ## Условие среды
    Live runtime продукта доступен. В репозитории есть директория с декларативным
    описанием UI-объектов продукта, но точный путь к ней в тикете не указан;
    `.workflow/src/skills/shared/` отсутствует.

    ## Критерии готовности
    - Каждая из 3 команд подтверждена в палитре команд
    - Каждый из 2 пунктов меню подтверждён в контексте элемента
    - Условие видимости "Archive Item" соответствует описанию
    - Evidence: указано место в source + наблюдение в runtime
    ---

    Опиши план действий: с чего начнёшь, как фиксируешь evidence для каждой
    команды и каждого пункта меню, что считаешь PASS / FAIL / BLOCKED. Если
    встречаешь препятствие — опиши его и обоснуй решение.

assertions:
  static:
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "Source-Grounded UI Assertion"
      reason: "Принцип должен присутствовать в перечне принципов скила."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "сверено с source-of-truth"
      reason: "Норма «сверь с source до PASS» должна быть явной."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "BLOCKED"
      reason: "BLOCKED как исход при недоступности source должен быть явно разрешён."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "галлюцинирую"
      reason: "Объяснение «почему» должно содержать понятие галлюцинации UI-assertion."

  rubric:
    - kind: llm_judge
      rubric_file: "../rubrics/source-grounded-ui-assertion.md"
      criterion: "Сверяет ли агент UI-assertions с source-of-truth (Grep/Read декларативного конфига) до записи PASS, либо возвращает BLOCKED при отсутствии source — без PASS «по памяти»?"
      pass_threshold: 4
      trials: 3
      aggregate: majority

execution:
  timeout_s: 1200
