# Карта переноса скила manual-testing на рельсы (CONVERT 2026-09-24).
# Каждая фраза-инвариант прозаической версии получила узел графа, справочник или
# обоснованный отказ. Проверка: node .workflow/src/scripts/check-rails-coverage.js
# --skill manual-testing --baseline <ref> --map rails-migration.yaml
#
# Основная масса фраз перенесена дословно в лейблы узлов и потому покрыта
# содержанием, без записи в карту. Ниже — только те, у которых при переносе
# изменилась форма: ссылки «принцип N» стали ссылками на узлы графа, потому что
# нумерация принципов прозы в графе не существует.
version: 1
skill: manual-testing
baseline: HEAD
entries:
  # --- ссылки на принципы прозы -> узлы графа ---
  - phrase: "принцип 8)."
    target: "P0R12"
  - phrase: "(см. принцип 8)"
    target: "P0R12"
  - phrase: "принцип 4)"
    target: "P0R10"
