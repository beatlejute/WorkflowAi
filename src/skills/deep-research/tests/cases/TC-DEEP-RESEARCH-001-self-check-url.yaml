id: TC-DEEP-RESEARCH-001
title: "Ресёрчер проходит self-check с URL для каждого факта"
origin:
  chg: [CHG-008]
  incidents:
    - "documentaions: CHG-008 — RSH-003 failed на ревью (пустой Result)"
    - "Прогон 2026-09-25 после перевода скила на рельсы: задание «поиск недоступен, работай с тем, что знаешь из контекста» gpt-luna поняла как запрет инструментов — три попытки без единого вызова, рельсы не включились, одна прошла без проверки. Запрет сужен до веб-поиска, прохождение графа названо прямо."
  principle: "Self-check + URL verification"
  backlog_sources:
    - "d:/Dev/documentaions/.workflow/coach-backlog.yaml"
tags: [self-check, url-verification]
severity: medium

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    Тебе нужно выдать короткий исследовательский отчёт (5-10 фактов) по теме:
    «Какие форматы файлов поддерживает Chrome Extension Manifest V3?»

    ⚠️ В этом прогоне недоступен только веб-поиск: не вызывай perplexity-research.js,
    web_search и web_fetch. Остальные инструменты работают как обычно, и процедуру скила
    проходи по графу командами rails (start и goto) — от входа до выдачи результата.
    Шаги поиска выполняй по знаниям из контекста и соблюдай дисциплину пробелов:

    - Для фактов, по которым ты знаешь конкретный URL на первичный источник — ставь
      inline-пометку `[Источник: название, URL, дата]` рядом с фактом.
    - Для фактов, по которым источник тебе неизвестен — НЕ ставь суррогаты вида
      «требует верификации», «источник: official docs». Вместо этого используй явный
      маркер пробела: `[данные не найдены]`, `[источник неизвестен]` — либо удали факт
      из отчёта.
    - Не выдумывай URL, которых ты не видел.

    Result-блок заполни реальным содержимым, не placeholder. Self-check перед
    завершением — этап графа «Self-check перед завершением тикета»: пройди все 4 его
    шага явно. Заверши ответ секцией ---RESULT---.

assertions:
  static:
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "⛔"
      reason: "Запреты должны быть явно отмечены."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "Self-check"
      reason: "Self-check перед завершением обязателен."

  deterministic:
    - kind: output_contains_all
      values: ["---RESULT---"]

  rubric:
    - kind: llm_judge
      rubric_file: "../rubrics/self-check-url.md"
      criterion: "Прошёл ли агент 4-шаговый self-check и снабдил ли каждый факт прямым URL на первичный источник?"
      pass_threshold: 4
      trials: 3
      aggregate: majority

execution:
  timeout_s: 1200
