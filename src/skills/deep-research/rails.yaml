# Рельсы скила deep-research (CONVERT 2026-09-25).
# Схема — .workflow/src/rails/README.md §4. Гард добавляется только по инциденту с датой и
# ценой — источники в tests/cases/*.origin.incidents. Правки этого файла делает человек.
version: 1
skill: deep-research
entry: P0E1
# Ответ и остановка — один узел: прогон 2026-09-25 (TC-DEEP-RESEARCH-001, claude-haiku, trial 3)
# выдал отчёт на шаге перед прежним узлом остановки P9S2 и получил отказ выходного слоя по положению.
terminal: [P9S1]
pause_nodes: []
fragments: ["workflows/*.md"]
quote_min: 25
canary: "echo RAILS_CANARY"

# H1 — область записи. Исследователь пишет отчёт по пути из тикета и секцию Result тикета.
write_scope:
  - "**"
allow_temp: true
# Каталог скилов закрыт целиком (узел P0R2): прогон 2026-09-25 (TC-DEEP-RESEARCH-001, kilo-free,
# trial 1) писал отчёт в .workflow/src/skills/deep-research/reports/ — в проекте этот путь ведёт
# в общую копию скилов ~/.workflow/skills, которую читают все проекты и перезаписывает обновление.
# Сюда же входят собственные гарды (принцип 17). Ядро рельс агент тоже не снимает.
write_deny:
  - ".workflow/src/skills/**"
  - ".workflow/src/rails/**"

# Правило P0R4 (perplexity-research.js вместо web_search/web_fetch, инцидент 2026-03-22) гарда
# не получает: stage_actions сопоставляет только shell и edit/write, веб-инструменты — kind other,
# правило для них никогда не срабатывает (core.mjs ruleMatches). Держится формулировкой узла.

# H4 — потолки возвратов из гейтов.
cycles:
  - { from: 3, to: 3, max: 3, reason: "Валидация базового чеклиста не сходится трижды — недособранные данные пометь маркерами knowledge/data-validation.md и перечисли в «Пробелы и ограничения» отчёта: явная пометка закрывает пункт честно" }
  - { from: 5, to: 5, max: 3, reason: "Self-check не проходит трижды — тикет НЕ завершён: выход к человеку с перечнем непройденных пунктов" }
  - { from: 10, to: 10, max: 3, reason: "Дополнительная проверка MARKET не проходит трижды — перечисли непройденные пункты в «Пробелы и ограничения» отчёта" }
  - { from: 20, to: 20, max: 3, reason: "Дополнительная проверка COMPETITOR не проходит трижды — перечисли непройденные пункты в «Пробелы и ограничения» отчёта" }
  - { from: 30, to: 30, max: 3, reason: "Дополнительная проверка TREND не проходит трижды — перечисли непройденные пункты в «Пробелы и ограничения» отчёта" }
  - { from: 40, to: 40, max: 3, reason: "Дополнительная проверка BENCHMARK не проходит трижды — перечисли непройденные пункты в «Пробелы и ограничения» отчёта" }
  - { from: 50, to: 50, max: 3, reason: "Дополнительная проверка TECHNOLOGY не проходит трижды — перечисли непройденные пункты в «Пробелы и ограничения» отчёта" }
  - { from: 60, to: 60, max: 3, reason: "Дополнительная проверка CUSTOM не проходит трижды — перечисли непройденные пункты в «Пробелы и ограничения» отчёта" }

# H5 — выходной слой: финальный ответ только в терминале P9S1; суррогат вместо маркера пробела
# отклоняется. Инцидент 2026-09-21 (TC-DEEP-RESEARCH-001, claude-haiku, trial 1): в Executive
# Summary «…требует верификации через …», а self-check того же ответа отметил «Нет суррогатов
# вроде «требует верификации»» — самопроверка подписала ложь, пробел остался замаскирован.
# Упоминание суррогата в кавычках (цитата правила) не ловится.
output:
  final_requires: []
  final_forbids:
    - "(?<![«\"„'])требует\\s+(?:дополнительной\\s+)?верификации"
  max_stop_blocks: 2
