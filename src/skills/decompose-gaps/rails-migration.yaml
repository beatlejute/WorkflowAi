# Карта переноса скила decompose-gaps на рельсы (CONVERT 2026-09-24).
# Каждая фраза-инвариант прозаической версии получила узел графа, справочник или
# обоснованный отказ. Проверка: node .workflow/src/scripts/check-rails-coverage.js
# --skill decompose-gaps --baseline <ref> --map rails-migration.yaml
version: 1
skill: decompose-gaps
baseline: HEAD
entries:
  # --- маршрутизация и границы -> П0 ---
  - phrase: "| **DECOMPOSE** | «декомпозировать gaps», «создать тикеты из пробелов» | → `workflows/decompose.md` |"
    target: "P0Q1"
  - phrase: "- **Управление workflow** → пайплайн и его скрипты"
    target: "P0R1"
  - phrase: "**Атомарность** — один gap = один тикет."
    target: "P0R4"
  - phrase: "- **Атомарный** — одна конкретная работа"
    target: "P0R4"

  # --- проверка scope -> П10G1, П10S4 ---
  - phrase: "**ОБЯЗАТЕЛЬНО** перед созданием тикетов."
    target: "P10G1"
  - phrase: "**Для gap вне scope:** НЕ создавать тикет."
    target: "P10S4"

  # --- префиксы -> П10S6 ---
  - phrase: "Используй **только** префиксы, определённые в конфиге."
    target: "P10S6"
  - phrase: "**⛔ ЗАПРЕТ на изобретение префиксов:**"
    target: "P0R6"
  - phrase: "**Никогда** не придумывай префиксы, которых нет в конфиге (даже если они кажутся логичными)."
    target: "P0R6"
  - phrase: "Если не совпадает — **СТОП**, исправь префикс."
    target: "P10S6"

  # --- output вне .workflow -> П0R7, П10S9 ---
  - phrase: "**⛔ ВАЖНО:** Артефакты НИКОГДА не складываются в `.workflow/`."
    target: "P0R7"
  - phrase: "Директория `.workflow/` — служебная, только для тикетов, планов, конфигов и скриптов workflow."
    target: "P0R7"

  # --- стоп-гейты перед записью -> П10G2 ---
  - phrase: "- **Перед записью — два обязательных гейта:**"
    target: "P10G2"
  - phrase: "Если файл уже существует — **СТОП**: не перезаписывай."
    target: "P10G2"
  - phrase: "`parent_plan` заполнен (см."
    target: "P10G2"
