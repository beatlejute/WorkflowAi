      file: "workflows/decompose.md"
      pattern: 'P10R2\["[^"]*[Тт]икет тестирования, которого держит его собственная запись проверки, — по узлу P10R4'
      reason: "Ветки P10R2 уступают P10R4."
    - kind: skill_contains
