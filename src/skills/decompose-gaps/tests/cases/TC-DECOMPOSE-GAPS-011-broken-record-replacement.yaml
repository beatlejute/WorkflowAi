    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P0R7\["[^"]*двигает его пайплайн \(узлы P10R2 и P10R4\)'
      reason: "Поля — данные для пайплайна и в замене по записи."
    - kind: skill_contains
