id: TC-DECOMPOSE-GAPS-011
title: "Тикет тестирования, которого держит его собственная запись проверки, заменяется повторной проверкой с переписанной записью и supersedes, а не возвращается по unblocks"
origin:
  chg: ["ad-hoc-2026-09-30"]
  incidents:
    - "PulseProxy PLAN-020 → QA-180 (2026-09-29…30): записи проверки сводного тикета правильная работа пройти не могла — `stdout matches /0 failed/` под построчным отчётом (при нуле провалов такой строки нет) и `npm test --json` (флаг до `--`). Разбор отчёта вынес это в «За пределами скоупа» как процессный риск, разбиение пробелов завело исправление найденного дефекта с `unblocks: [QA-180]`, а переписать запись отказалось как «управление тикетами, вне scope». Тикет вернулся с той же записью, прогнан заново и в третий раз ушёл в blocked/ при выполненном критерии; сдвинула его только ручная правка записи."
    - "Ревью правила 2026-09-30 (два раунда): признак по словам исполнителя пропускал запись `npm test` с `exit 0` и провалами, названными посторонними; выдержка в секции результата скрывала провал; дословная копия записи, читающей артефакт тикета тестирования, у замены зелёная до работы; каждый новый разбор заводил бы ещё одну замену того же тикета."
  principle: "Тикет тестирования в blocked/, которого держит его собственная запись проверки, — невыполненный DoD задачи плана, в scope (P10R4). Признаки — по blocked_reason и evidence ревью, а не по словам исполнителя: отказ гейта в записи пункта, пункт со статусом timeout, denied или dod_record_invalid, ожидание по тексту вывода, которое не совпало; не совпало ожидание по коду выхода — дефект продукта. Уже названный в `supersedes` незавершённой проверки тикет новой замены не получает. Замена (P10R5) — те же критерии дословно, запись пункта с признаком читает артефакт по коду выхода, остальные записи — с поправками под замену (ID артефакта и снимков, `regression: true` у прогона существующих тестов); каждому дефекту и провалу без исправления — исправление без `unblocks`, замена зависит от исправлений (workflows/decompose.md узлы P10R4, P10R5, P10R2, P10R1, P10S3, P10S5, P10G3; SKILL.md P0R4, P0R7, P0R8, P6S1; algorithms/scope-check.md шаг 2b и граничные случаи; knowledge/scope-validation.md)."
  backlog_sources:
    - "D:/Dev/PulseProxy/.workflow/logs/pipeline_2026-09-29_18-55-50.log"
tags: [scope-check, recheck, supersedes, check-record, regression-guard]
severity: high

scenario:
  system_prompt_file: "../fixtures/TC-DECOMPOSE-GAPS-011-decision-context.md"
  extra_instructions: |
    По полному inline-входу дай текстовую декомпозицию U1–U4: необходимые
    работы, поля frontmatter, критерии DoD и прежние/новые записи проверок.
    Это синтетический регрессионный сценарий, не исторические документы.
    Не ищи реальные проекты, не запускай команды/агентов, не меняй файлы.
    Имена новых работ символические. Не выдавай их за выделенные ID.
    Не пиши, что тикеты созданы или старые записи уже изменены.
  inputs:
    - kind: inline
      as: synthetic_regression_fixture
      content: |
        PLAN status: in_progress, не completed. Все часы — одного дня.
        REPORT содержит перечисленные U в находках текущего прогона, не в рекомендациях.
        PLAN-S011: QA-A в blocked/, dod_format: 2. Исправление найденных
        дефектов и повторная проверка в scope; исключений нет.
        U1: критерий DoD 1 дословно «Сценарий проверен, фактический итог записан».
        check: npm test; expect: stdout matches /0 failed/.
        blocked_reason: dod_check_failed: stdout expectation mismatch.
        evidence: exit_code 1; stdout «12 failed; title mismatch; popup fails».
        Артефакт старой проверки: qa/QA-A/result.json.
        Требуется предложить новую запись, не запускать её сейчас.
        U2: остальные критерии дословно:
        DoD 2 «Полный npm test зелёный»: check npm test, expect exit 0.
        DoD 3 «Снимок popup записан»: visual qa/QA-A/popup-*.png.
        Эти записи перенесены из плана. После исправлений npm test может
        стать зелёным ещё до работы новой QA. Новая QA обозначается QA-NEW.
        U3: дефекты title и popup подтверждены stdout DoD 1. FIX-OPEN в ready/
        исправляет title и содержит unblocks: [QA-A]; исправления popup нет.
        Существующие тикеты редактировать нельзя. Других исправлений нет.
        U4: отдельный QA-B в blocked/ из-за собственной записи проверки;
        QA-B-RETRY в ready/ уже содержит supersedes: [QA-B].
        Gap QA-B повторно поступил в разбор; причин править retry не дано.

assertions:
  rubric:
    - kind: llm_judge
      rubric_file: "../rubrics/broken-record-replacement.md"
      criterion: "Построена ли замена сломанной проверки без потери критериев, продуктовых провалов и существующих зависимостей?"
      pass_threshold: 5
      trials: 3
      aggregate: majority
  static:
    # P10R4 — распознавание
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R4\["П10 ПРАВИЛО: Тикет тестирования в blocked/ может держать его собственная запись проверки, а не продукт'
      reason: "Блокировку записью проверки разбиение пробелов распознаёт отдельно от дефекта продукта."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R4\["[^"]*Признаки — по пунктам DoD, в blocked_reason тикета и в файле evidence его ревью `\.workflow/state/evidence/<имя файла тикета>\.json` \(вывод, который получила проверка, а не пересказ в секции результата\)'
      reason: "Ревью 2026-09-30: признак по словам исполнителя или по выдержке в секции результата скрывает провалы продукта."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R4\["[^"]*отказ гейта в записи пункта \(check_denied, check_tool_missing, check_timeout, check_malformed, check_green_before_start\)'
      reason: "Признак — все коды отказа гейта перед работой."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R4\["[^"]*пункт со статусом timeout или denied или с причиной dod_record_invalid в evidence — запись красная при любой работе'
      reason: "Таймаут на ревью у вернувшегося тикета гейт не видит — только evidence."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R4\["[^"]*пункт с ожиданием по тексту вывода \(`stdout contains`, `stdout not contains`, `stdout matches`\), которое в evidence не совпало'
      reason: "Ожидание по тексту — признак записи; провалы при этом получают исправления."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R4\["(?![^"]*отказы ревью)'
      reason: "Отказы ревью при записанном «критерий выполнен» — слова исполнителя, признаком не служат."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R4\["[^"]*Не совпало ожидание по коду выхода — не запись, а дефект продукта, даже если исполнитель назвал провалы посторонними, прежними или не связанными с тикетом: нет пункта с признаком — ветки P10R2'
      reason: "Запись `npm test` с `exit 0` и провалами, названными посторонними, идёт по дефекту продукта, а не в замену по артефакту."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R4\["[^"]*Такой gap — невыполненный DoD задачи плана, в scope\. Переписать запись в новом тикете — не управление workflow'
      reason: "Переписать запись в новом тикете — в scope, а не «управление тикетами»."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R4\["[^"]*Тикет уже назван в `supersedes` незавершённой повторной проверки \(blocked/, backlog/, ready/, in-progress/, review/\) — новый тикет для него не создавай'
      reason: "Ревью 2026-09-30: признаки заблокированного тикета не меняются, и каждый разбор заводил бы ещё одну замену."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R4\["[^"]*[Тт]икет тестирования не называй в `unblocks` ни одного нового тикета'
      reason: "Возврат по unblocks вернул бы тикет с той же сломанной записью."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R4\["[^"]*Открытое исправление, которое уже называет его в `unblocks`, не правь'
      reason: "Состояние инцидента: исправление с unblocks уже заведено."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R4\["[^"]*Узел важнее веток P10R2'
      reason: "Старшинство над ветками дефекта."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R4\["(?![^\n]*\b(analyze-report|coach|create-plan|create-report|decompose-plan|deep-research|execute-task|manual-testing|review-result|move-ticket)\b)'
      reason: "Изоляция: узел не называет другие скилы и стадии пайплайна."
    # P10R5 — построение замены
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R5\["П10 ПРАВИЛО: Замена по узлу P10R4 — тикет повторной проверки того же сценария с `supersedes: \[ID тикета тестирования\]`\. Пункты DoD — те же критерии дословно'
      reason: "Механизм — замена с supersedes, критерий не подменяется."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R5\["[^"]*Запись пункта с признаком переписывается по правилам секции DoD шаблона тикета: исполнитель пишет фактический итог прогона в артефакт вне \.workflow/, запись читает этот артефакт и укладывается в таймаут исполнителя проверок, найденный дефект — выполненный пункт, ожидание — только `exit <N>` команды, читающей артефакт'
      reason: "Текст вывода на этой стадии запуском не сверить — ожидание по несверенному тексту и было корнем инцидента."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R5\["[^"]*Остальные записи — те же команды и ожидания, в том числе перенесённые из плана, с двумя поправками под замену: путь артефакта и маска снимков с ID тикета тестирования — с ID замены; запись, которую до работы замены делает зелёной работа тикета тестирования или исправлений, от которых замена зависит \(прогон существующих тестов, проба продукта, поиск написанного тикетом тестирования\), — с `regression: true`'
      reason: "Ревью 2026-09-30: дословная копия у замены зелёная до работы — гейт отправил бы замену в blocked/."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R4\["[^"]*Вывод пункта с признаком в evidence показывает, что критерий не выполнен \(найден запрещённый текст, другое значение, провал\), — это ещё и дефект продукта: исправление по узлу P10R5, запись всё равно переписывается'
      reason: "Ревью 2026-09-30: найденный запрещённый текст — дефект, переписанная запись без исправления его скрыла бы."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R5\["[^"]*и каждому пункту с признаком, вывод которого показывает невыполненный критерий, если у него нет исправления'
      reason: "Дефект, показанный выводом пункта с признаком, получает исправление."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10G3\{"[^"]*остальные записи — те же с поправками под замену \(при исключённом исправлении дефектов записи пунктов с провалами переписаны так же\)'
      reason: "Чеклист не требует дословной копии записи с провалами при исключённых исправлениях."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R5\["[^"]*Перенесённая из плана запись с признаком переписывается тоже'
      reason: "Исключение из «запись плана не меняется» — только для записи с признаком."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R5\["[^"]*Каждому дефекту, который тикет записал, каждому провалу в выводе его пунктов в evidence \(stdout и stderr\)[^"]*если у него нет исправления — ни готового, ни открытого, — тикет исправления без `unblocks`'
      reason: "Каждый провал получает исправление, а не только записанные дефекты; второго исправления того же дефекта нет."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R5\["[^"]*План исключает исправление найденных дефектов \(шаг 2a algorithms/scope-check\.md\) — исправлений нет: запись пункта с провалами переписывается так же, а провалы идут в «Новые требования»'
      reason: "При исключённых исправлениях дословная копия записи с провалами повторила бы провал."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R5\["[^"]*Замена зависит от каждого исправления дефектов и провалов этого тикета, нового и открытого, — в dependencies и в условии tasks_completed'
      reason: "Замена прогоняется после исправлений дефектов продукта."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R5\["[^"]*Исправление, от которого она зависит, само в blocked/ — создай замену этого исправления с `supersedes: \[ID заблокированного исправления\]`'
      reason: "Без этого замена ждёт заблокированное исправление вечно."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R5\["[^"]*В выводе стадии по каждой переписанной записи — тикет, пункт, прежняя и новая запись'
      reason: "Переписанная запись видна человеку."
