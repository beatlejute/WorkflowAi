      pattern: 'P10S3\["[^"]*строки «Проверка:» этой задачи \(по ним видно, что запись тикета перенесена из плана, — узел P10R4\)'
      reason: "Без строк «Проверка:» не определить, что запись перенесена из плана."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S5\["[^"]*по P10R4 и P10R5 — замена с `supersedes` и исправления без `unblocks`'
      reason: "Исключение из «один gap — один тикет» названо и для замены."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10G3\{"[^"]*назван в `supersedes` повторной проверки — созданной по узлу P10R5 или уже незавершённой, — которая зависит от каждого исправления его дефектов и провалов его вывода[^"]*ни в одном `unblocks` тикета этого запуска'
      reason: "Чеклист завершения проверяет замену и отсутствие unblocks на тикет."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10G3\{"[^"]*тикет, которого держит его собственная запись проверки, — исключение: ему нужна замена по узлу P10R4, даже если он назван в `unblocks` открытого исправления\)'
      reason: "Скобка «новый тикет не нужен» не противоречит P10R4 в состоянии инцидента."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10R3 --> P10R4 --> P10R5 --> P10S1'
      reason: "Правила читаются на входе этапа, до разбора пробелов."
