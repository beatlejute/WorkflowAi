      reason: "Граничный случай «исправления всех дефектов готовы, тикет тестирования в blocked/» согласован с P10R2: новая проверка с supersedes."
    - kind: skill_contains
      file: "algorithms/scope-check.md"
      pattern: "исправления ещё нет, тикет тестирования в blocked/ \\| В scope: один тикет исправления с `unblocks: \\[ID тикета тестирования\\]`, второго тикета проверки нет; другие дефекты того же тикета уже исправлены — для них тоже без `supersedes`"
      reason: "Граничный случай «исправления нет, тикет тестирования в blocked/»: только исправление с unblocks, без второго тикета проверки и без supersedes для уже исправленных дефектов."
