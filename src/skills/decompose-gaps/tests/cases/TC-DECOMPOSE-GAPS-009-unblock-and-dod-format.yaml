id: TC-DECOMPOSE-GAPS-009
title: "Заблокированный тикет тестирования перепроверяется сам (unblocks); тикет с проверками — dod_format: 2"
origin:
  chg: ["ad-hoc-2026-09-29"]
  incidents:
    - "PulseProxy PLAN-017, 2026-09-28: тикет повторной проверки QA-162 провалился до исправления продукта и ушёл в blocked/. Декомпозиция пробелов по правилу P10R2 (1.16.5) завела исправление FIX-032 и второй тикет проверки QA-163, вернуть QA-162 в работу она не может. FIX-032 и QA-163 закрыты, а QA-162 остался в blocked/: complete-plan — not_ready 69/70, план не закрылся."
    - "Там же: FIX-032 и QA-163 записаны по шаблону тикета проекта (копия апреля без поля dod_format), с проверками `- check:`, но без `dod_format: 2` — проверки ни разу не запустились, тикеты оценивала модель (review-result-legacy). Из 42 тикетов PulseProxy с проверками без поля — только эти два."
    - "Ревью 2026-09-29: P10R2 выбирал ветку по дефекту. Заблокированный тикет тестирования с двумя дефектами — один уже исправлен, второму нужно исправление — получал бы и повторную проверку с `supersedes`, и исправление с `unblocks`; готовая проверка первого дефекта закрыла бы тикет тестирования до второго исправления, и после него сценарий никто не перепроверил бы."
  principle: "Повторная проверка после исправления — тот же заблокированный тикет тестирования: исправление несёт данные `unblocks`, по которым пайплайн возвращает тикет в работу (P10R2). Новый тикет проверки с `supersedes` — только если готовы исправления всех дефектов заблокированного тикета; хотя бы одному нужно новое исправление — только `unblocks`, одна цель не называется в обоих полях. Тикет тестирования закрыт — новый тикет проверки без полей. Тикет с проверками всегда получает `dod_format: 2`, шаблон проекта не источник формата (P10R3); тот же пропуск ловит check-ticket-dod.js (dod_format_missing) в гейте P10G4."
  backlog_sources: []
tags: [recheck, unblocks, dod-format, regression-guard]
severity: high

scenario:
  system_prompt_file: "../fixtures/TC-DECOMPOSE-GAPS-009-decision-context.md"
  extra_instructions: |
    По полному inline-входу дай текстовую декомпозицию U1–U4 с причиной
    каждой выбранной ветки, новыми работами и полями frontmatter.
    Это синтетический регрессионный сценарий, не исторические документы.
    Не ищи реальные проекты, не запускай команды/агентов, не меняй файлы.
    Новые имена символические, не выделенные ID и не созданные тикеты.
    Для каждой новой проверки укажи dependencies и tasks_completed.
  inputs:
    - kind: inline
      as: synthetic_regression_fixture
      content: |
        PLAN status: in_progress, не completed. Все часы — одного дня.
        REPORT содержит перечисленные U в находках текущего прогона, не в рекомендациях.
        PLAN-S009: исправления всех перечисленных дефектов и проверки
        в scope. Собственные записи QA корректны. Новые работы имеют
        проверки DoD, но старый шаблон не содержит поля dod_format.
        U1: QA-A в blocked/ из-за D1 и D2. FIX-A1 для D1 в done/;
        для D2 исправления нет. Перепроверки нет.
        U2: QA-B в blocked/ из-за D3. FIX-B в done/. QA-B2 в done/
        записал PASS после FIX-B, но supersedes отсутствует.
        U3: QA-C в blocked/ из-за D4. FIX-C в ready/ уже содержит
        unblocks: [QA-C]; иных препятствий нет.
        U4: QA-D в blocked/ из-за D5. FIX-D в blocked/ содержит
        unblocks: [QA-D]; замены FIX-D нет.

assertions:
  rubric:
    - kind: llm_judge
      rubric_file: "../rubrics/unblock-and-dod-format.md"
      criterion: "Выбрана ли единая корректная ветка для каждого заблокированного тикета без дублирования работ?"
      pass_threshold: 5
      trials: 3
      aggregate: majority
  static:
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: "P10R2\\[\"[^\\n]*Тикет тестирования лежит в blocked/ — создай только тикет исправления с полем frontmatter `unblocks: \\[ID тикета тестирования\\]`[^\\n]*нового тикета проверки не создавай"
      reason: "При заблокированном тикете тестирования второй тикет проверки не заводится — тот тикет вернёт в работу пайплайн по unblocks."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: "P10R3\\[\"П10 ПРАВИЛО: Тикет с проверками DoD \\(строки `- check:` под пунктами\\) записывается с `dod_format: 2` во frontmatter, даже если шаблона проекта это поле не содержит"
      reason: "Формат тикета с проверками не зависит от отставшего шаблона проекта."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: "P10S10\\[\"[^\\n]*dod_format_missing — `dod_format: 2` во frontmatter"
      reason: "Шаг исправления знает новую причину скрипта гейта."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P0R7\\[\"[^\\n]*Поля frontmatter `unblocks` и `supersedes` — не инструкции, а данные"
      reason: "Запрет workflow-управления не отменяет unblocks и supersedes: поля — данные для пайплайна, двигает тикеты он."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: "P10R2\\[\"[^\\n]*Исправление каждого дефекта, записанного тикетом тестирования, уже есть и готово, а тикет тестирования в blocked/ — существующий тикет исправления не правь: создай тикет повторной проверки того же сценария, зависящий от исправления, с полем `supersedes: \\[ID тикета тестирования\\]`"
      reason: "Ревью 2026-09-29: заблокированный тикет тестирования при готовых исправлениях всех его дефектов не остаётся на доске — его заменяет новая проверка (supersedes)."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: "P10R2\\[\"[^\\n]*Хотя бы одному дефекту заблокированного тикета тестирования нужно новое исправление — `supersedes` не пиши ни для одного его дефекта: только исправления с `unblocks`[^\\n]*один тикет тестирования не называется и в `unblocks`, и в `supersedes`"
      reason: "Ревью 2026-09-29: проверка уже исправленного дефекта с supersedes закрыла бы тикет тестирования до исправления второго дефекта — ветка выбирается по тикету тестирования, не по дефекту."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: "P10G3\\{[^\\n]*каждый тикет тестирования в blocked/ за принятым gap назван в `unblocks` или `supersedes` тикета, созданного в этом запуске, и ни один не назван в обоих"
      reason: "Чеклист завершения не пропускает заблокированный тикет тестирования, которого не вернёт и не закроет ни один новый тикет, и тикет, названный в обоих полях."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: "дефектов несколько — у каждого исправления тот же `unblocks`, пайплайн ждёт их все"
      reason: "Несколько дефектов одного тикета тестирования — тикет возвращается после всех исправлений."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P0R4\\[\"[^\\n]*когда готовы исправления всех записанных им дефектов, его заменяет новая проверка с `supersedes`"
