id: TC-DECOMPOSE-GAPS-010
title: "Gap о невыполненном пункте «Критерии успеха» плана — в scope, даже без задачи плана и при всех тикетах в done/"
origin:
  chg: ["ad-hoc-2026-09-29"]
  incidents:
    - "PulseProxy PLAN-017, 2026-09-29: план закрыт при 70 из 70 тикетов в done/, хотя пункт «Критерии успеха» «`npm test` ... зелёные» опровергали 12 падений, записанные итоговым отчётом тестирования как «not blocking» и «pre-existing». Разбор отчёта теперь передаёт такой пункт в gaps; без правки проверка scope отклонила бы его трижды: у пункта нет своей задачи плана (шаг 2), все тикеты плана выполнены (шаг 3), падения записаны как прежние — «техдолг прошлых итераций» (шаг 5). Пайплайн после разбиения без тикетов завершается, и план остался бы открытым без работы."
  principle: "Секция «Критерии успеха» определяет, что план выполнен: gap о её опровергнутом или неподтверждённом пункте принадлежит плану (criterion_gap). Исключение снимает только шаг 2 «нет задачи», шаг 3 «все ключевые задачи выполнены» и техдолг шага 5; исключения плана (шаг 2a) и запрет расширения scope остаются в силе. Опровергнут — тикет исправления с проверкой пункта в DoD, не подтверждён — тикет проверки пункта."
  backlog_sources: []
tags: [scope-check, success-criteria, regression-guard]
severity: high

scenario:
  system_prompt_file: "../fixtures/TC-DECOMPOSE-GAPS-010-decision-context.md"
  extra_instructions: |
    Дай текстовую декомпозицию U1–U4 по полному inline-входу:
    scope, источник gap, вид необходимой работы и проверяемый DoD.
    Это синтетический регрессионный сценарий, не исторические документы.
    Не ищи реальные проекты, не запускай команды/агентов, не меняй файлы.
    Новые имена символические, не выделенные ID и не созданные тикеты.
  inputs:
    - kind: inline
      as: synthetic_regression_fixture
      content: |
        PLAN status: in_progress, не completed. Все часы — одного дня.
        REPORT содержит перечисленные U в находках текущего прогона, не в рекомендациях.
        PLAN-S010: все тикеты в done/. Исправления и проверки критериев
        в scope, кроме явно исключённого исправления цвета значка.
        U1: критерий S1 «Полный npm test зелёный». Отдельной задачи нет.
        Последний записанный прогон: exit 1, 12 failed, 1464 passed.
        Исполнитель: «pre-existing, not blocking». Исправлений нет.
        U2: критерий S2 «Ручная проверка открытия модалки подтверждена».
        Отдельной задачи нет. Ни один результат проверки не записан.
        U3: критерий S3 «Значок синего цвета». Последний снимок показывает
        серый значок. «Исключено из scope»: исправление цвета значка.
        U4: запрос добавить новый режим темы. Такого функционала нет
        ни в задачах, ни в критериях успеха плана.

assertions:
  rubric:
    - kind: llm_judge
      rubric_file: "../rubrics/success-criterion-gap.md"
      criterion: "Различены ли опровергнутый и неподтверждённый критерии с сохранением исключений scope?"
      pass_threshold: 5
      trials: 3
      aggregate: majority
  static:
    - kind: skill_contains
      file: "algorithms/scope-check.md"
      pattern: "criterion_gap = gap описывает пункт «Критерии успеха» plan, который записанные данные опровергают или не подтверждают\\s+IF matching_task == NULL AND NOT criterion_gap:\\s+RETURN \\{false, \"Нет соответствующей задачи в исходном плане\", \"2\"\\}"
      reason: "Шаг 2 не отклоняет gap о пункте «Критерии успеха» за отсутствием отдельной задачи плана."
    - kind: skill_contains
      file: "algorithms/scope-check.md"
      pattern: "Снимает только шаг 2 «нет задачи», шаг 3 «все ключевые задачи выполнены» и\\s+# техдолг шага 5; шаг 2a и расширение scope к нему применяются"
      reason: "Исключение перечисляет, что снимает, и называет правила, которые остаются в силе."
    - kind: skill_contains
      file: "algorithms/scope-check.md"
      pattern: "IF matching_task == NULL AND NOT criterion_gap:[\\s\\S]*# Шаг 2a[\\s\\S]*IF gap описывает работу, подпадающую под exclusion:\\s+RETURN \\{false[\\s\\S]*IF gap описывает расширение scope \\(новый функционал, не заявленный в плане\\):\\s+RETURN \\{false"
      reason: "Исключения плана и запрет расширения scope применяются к criterion_gap без оговорок."
    - kind: skill_contains
      file: "algorithms/scope-check.md"
      pattern: "IF все ключевые задачи плана выполнены AND NOT criterion_gap:\\s+RETURN \\{false, \"Все ключевые задачи выполнены\", \"3\"\\}"
      reason: "Шаг 3 не отклоняет опровергнутый критерий плана, когда все тикеты в done/."
    - kind: skill_contains
      file: "algorithms/scope-check.md"
      pattern: "- инвентаризацию накопленных багов/техдолга прошлых итераций \\(кроме criterion_gap: падения, опровергающие пункт «Критерии успеха» плана, — пробел плана, даже если записаны как прежние\\)"
      reason: "Шаг 5 не списывает падения, опровергающие критерий плана, в накопленный техдолг."
    - kind: skill_contains
      file: "algorithms/scope-check.md"
      pattern: "\\| Все тикеты плана в done/, пункт «Критерии успеха» плана опровергнут[^\\n]*\\| В scope \\(criterion_gap[^\\n]*шаг 2a и расширение scope в силе\\)[^\\n]*опровергнут — тикет исправления, DoD которого — проверка этого пункта; не подтверждён — тикет проверки этого пункта"
      reason: "Граничный случай говорит, какой тикет создать для опровергнутого и для неподтверждённого пункта."
    - kind: skill_contains
      file: "knowledge/scope-validation.md"
      pattern: "Gap — это исключительно то, что \\*\\*не выполнено или выполнено некорректно\\*\\* из явного списка задач плана, или пункт секции «Критерии успеха» плана, который записанные данные опровергают или не подтверждают"
      reason: "Проверка 1 признаёт источником gap пункт «Критерии успеха», а не только задачи плана."
    - kind: skill_contains
      file: "knowledge/scope-validation.md"
      pattern: "- Пункт «Критерии успеха» плана, который записанные данные опровергают или не подтверждают, — даже без отдельной задачи плана и когда все тикеты плана в done/[^\\n]*«Исключено из scope» плана и запрет расширения scope в силе"
      reason: "Проверка 2 относит такой пункт к gap в scope и сохраняет исключения плана."
    - kind: skill_contains
      file: "knowledge/scope-validation.md"
      pattern: "\\| Все ключевые задачи выполнены \\|[^\\n]*опровергнутый или неподтверждённый пункт «Критерии успеха» плана — тоже"
      reason: "Проверка 3: опровергнутый критерий значит, что выполнены не все."
    - kind: skill_contains
      file: "knowledge/scope-validation.md"
      pattern: "Инвентаризацию накопленных багов/техдолга прошлых итераций[^\\n]*— кроме падений, опровергающих пункт «Критерии успеха» плана: это gap в scope, даже если они записаны как прежние"
      reason: "Проверка 5 не отклоняет падения, опровергающие критерий плана, как техдолг."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: "P10S3\\[\"[^\"]*секцию «Критерии успеха» \\(gap о её пункте, который записанные данные опровергают или не подтверждают, принадлежит плану и без отдельной задачи\\)"
      reason: "Шаг чтения плана извлекает «Критерии успеха» — без неё проверка шага 2 не найдёт пункт."

execution:
  timeout_s: 1200
