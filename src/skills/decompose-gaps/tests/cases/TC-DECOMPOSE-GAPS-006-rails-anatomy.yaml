id: TC-DECOMPOSE-GAPS-006
title: "decompose-gaps на рельсах: граф ядра и фрагмента, гейт scope, стоп-гейт перед записью, выходной слой"
origin:
  chg: ["convert-2026-09-24"]
  incidents:
    - "Решение стейкхолдера 2026-09-21: единый подход «Рельсы для агента» — все скилы переводятся на граф плюс хуки-отказы через коуча (CONVERT). decompose-gaps — восьмой скил после коуча, analyze-report, execute-task, review-result, create-plan, decompose-plan и create-report."
    - "Инцидент 2026-04-18: план исключал исправление дефектов, а gap всё равно породил тикет на исправление — работа ушла за границу плана, который утверждал стейкхолдер (кейс TC-DECOMPOSE-GAPS-001). Теперь проверка scope — гейт графа до создания любого тикета."
    - "Инцидент 2026-04-18: стадии перезаписывали существующие тикеты. Теперь проверка занятости пути — стоп-гейт до записи файла (кейс TC-DECOMPOSE-GAPS-002)."
    - "Инциденты 2026-04-19 и 2026-04-21: тикет без parent_plan невидим для пайплайна — скрипты выбора, условий и архивации фильтруют по этому полю, тикет не берут в работу и не архивируют (кейс TC-DECOMPOSE-GAPS-003). Теперь поле требуется узлом-правилом, стоп-гейтом перед записью и выходным слоем."
  principle: "Концепция рельс: принцип 1 (граф — единственный источник процедуры), 6 и 9 (отказ инструмента и выходной слой), 10 (потолки циклов), 11 (дата и цена у гарда), 15 (гард доказан тестом, канарейка)."
  backlog_sources: []
tags: [rails, anatomy, regression-guard]
severity: critical

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    (L0-only тест: scenario не запускает агентов, проверяется только static
    assertion над содержимым рабочих файлов скила.)

assertions:
  static:
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "rails: rails\\.yaml"
      reason: "Frontmatter объявляет конфиг гардов — признак скила на рельсах."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "```mermaid[\\s\\S]*graph TD[\\s\\S]*P0E1\\[\"П0 ВХОД: Специалист по декомпозиции пробелов"
      reason: "Процедура записана mermaid-графом с входным узлом этапа 0."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P0S1\\[\"П0 ШАГ: Канарейка живости[^\\n]*echo RAILS_CANARY"
      reason: "Проверка живости рельс — узел графа (принцип 15)."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P0R5\\[\"П0 ПРАВИЛО: parent_plan обязателен для КАЖДОГО тикета"
      reason: "Обязательность привязки к плану — правило ядра с названной ценой."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P6E1 --> P6R1 --> P6S1 --> P6S2"
      reason: "Вывод результата и остановка — последний этап, терминал P6S2."

    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: "P10G1\\{\"П10 ГЕЙТ: каждый gap прошёл 5 проверок scope"
      reason: "Проверка scope — гейт до создания тикета, а не пожелание в прозе."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: "P10G2\\{\"П10 ГЕЙТ \\(СТОП, до записи файла\\)[\\s\\S]{0,200}parent_plan заполнен"
      reason: "Занятость пути и заполненность привязки проверяются до записи файла."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: "P10G3\\{\"П10 ГЕЙТ \\(чеклист завершения\\)"
      reason: "Чеклист завершения стал гейтом с потолком циклов."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: "P10G3 -->\\|\"да\"\\| P6E1"
      reason: "Выход фрагмента ведёт в вывод результата ядра."

    - kind: skill_contains
      file: "rails.yaml"
      pattern: "write_scope:[\\s\\S]*\\.workflow/tickets/backlog/\\*\\*"
      reason: "Скил пишет только тикеты-доработки в backlog."
    - kind: skill_contains
      file: "rails.yaml"
      pattern: "write_deny:[\\s\\S]*\\.workflow/plans/\\*\\*"
      reason: "План и отчёт — вход скила, правка их гардом закрыта."
    - kind: skill_contains
      file: "rails.yaml"
      pattern: "stage_actions:[\\s\\S]*write_ticket:[\\s\\S]*stages: \\[10\\]"
      reason: "Запись тикета разрешена только на этапе работы, после гейтов."
    - kind: skill_contains
      file: "rails.yaml"
      pattern: "final_requires:[\\s\\S]*created_tickets:"
      reason: "Выходной слой требует список созданных тикетов."
    - kind: skill_contains
      file: "rails.yaml"
      pattern: "final_forbids:[\\s\\S]*parent_plan"
      reason: "Пустая привязка к плану в выводе запрещена."

    - kind: skill_contains
      file: "rails-migration.yaml"
      pattern: "baseline:"
      reason: "Карта переноса фиксирует базовую версию, от которой считается покрытие фраз-инвариантов."
    - kind: skill_contains
      file: "rails-migration.yaml"
      pattern: "entries:[\\s\\S]*target: \"P10G2\""
      reason: "Служебные фразы прозы переехали в лейблы узлов, решение по каждой записано в карте."

execution:
  timeout_s: 60
