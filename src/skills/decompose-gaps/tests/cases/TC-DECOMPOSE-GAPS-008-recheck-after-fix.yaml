id: TC-DECOMPOSE-GAPS-008
title: "Дефект из тестирования — исправление и повторная проверка; gap закрыт другим тикетом, только если его результат записан позже причины"
origin:
  chg: ["ad-hoc-2026-09-28"]
  incidents:
    - "PulseProxy PLAN-017, 2026-09-28: тикет тестирования записал дефект значка вкладки (результат 03:46 UTC). Ночная декомпозиция пробелов по REPORT-023 завела только тикет исправления, без повторной проверки; исправление закрыто в 07:32 UTC. Днём разбор отчёта нашёл пробел «после исправления сценарий не перепроверен», а декомпозиция отклонила его по проверке scope 2 как deliverable другого тикета, назвав тикет тестирования «повторной проверкой после фикса». План не закрылся, отчёт и разбор повторялись на неизменной доске."
  principle: "Точка контроля — создание тикетов: исправление дефекта из тестирования заводится в паре с повторной проверкой, зависящей от него (узел P10R2). Страховка — проверка scope: другой тикет закрывает gap, только если его результат записан после события, от которого gap возник (узел P10R1, algorithms/scope-check.md)."
  backlog_sources: []
tags: [scope-check, recheck, regression-guard]
severity: high

scenario:
  system_prompt_file: "../fixtures/TC-DECOMPOSE-GAPS-008-decision-context.md"
  extra_instructions: |
    По полному inline-входу дай текстовую декомпозицию U1–U4.
    Это синтетический регрессионный сценарий, не исторический факт.
    Не ищи реальные проекты, не запускай команды/агентов, не меняй файлы.
    Для каждого случая реши, остался ли gap и какие работы нужны;
    покажи dependencies/tasks_completed проверки. Новые имена символические,
    не выдавай их за выделенные ID или реально созданные тикеты.
  inputs:
    - kind: inline
      as: synthetic_regression_fixture
      content: |
        PLAN status: in_progress, не completed. Все часы — одного дня.
        REPORT содержит перечисленные U в находках текущего прогона, не в рекомендациях.
        PLAN-S008: T1 — корректный значок вкладки; исправления и проверка
        в scope. QA-A/B/C/D закрыты в done/; каждый записал дефект
        «значок вкладки не обновляется».
        U1: QA-A записал дефект в 03:46; FIX-A готов в 07:32.
        Gap: после FIX-A сценарий не перепроверен. Иных проверок нет.
        U2: QA-B записал дефект в 03:46; FIX-B готов в 07:32;
        QA-B2 записал проверку того же значка PASS в 08:10.
        Gap: после FIX-B сценарий не перепроверен.
        U3: QA-C записал дефект в 03:46; QA-C2 записал PASS в 04:10;
        FIX-C готов в 07:32. Gap: после FIX-C сценарий не перепроверен.
        U4: QA-D записал дефект в 03:46; исправления нет.
        Gap: исправить найденный дефект значка и проверить сценарий.

assertions:
  rubric:
    - kind: llm_judge
      rubric_file: "../rubrics/recheck-after-fix.md"
      criterion: "Верно ли учтена хронология исправления и повторной проверки во всех четырёх случаях?"
      pass_threshold: 5
      trials: 3
      aggregate: majority
  static:
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: "P10R1\\[\"П10 ПРАВИЛО: Gap закрыт другим тикетом, только если результат того тикета записан после события, от которого gap возник[^\\n]*Тикет тестирования, записавший дефект до его исправления, повторной проверкой после исправления не является"
      reason: "Gap не отклоняется как сделанный тикетом, результат которого записан раньше причины gap."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: "P10R2\\[\"П10 ПРАВИЛО: Gap — дефект, найденный тикетом тестирования,[^\\n]*две работы: исправление и повторная проверка[^\\n]*тикет повторной проверки, который зависит от исправления"
      reason: "Исправление дефекта из тестирования не заводится без повторной проверки, которая ждёт исправления (для закрытого тикета тестирования — новым тикетом)."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: "P10E1 --> P10R1 --> P10R2 --> P10R3 --> P10R4 --> P10R5 --> P10S1"
      reason: "Правила стоят в начале этапа — до проверки scope и создания тикетов."
    - kind: skill_contains
      file: "algorithms/scope-check.md"
      pattern: "IF gap — deliverable другого тикета \\(создан как часть DoD\\) AND результат того тикета записан после события, от которого возник gap"
      reason: "Алгоритм проверки scope 2 не противоречит узлу P10R1: отказ «deliverable другого тикета» требует более позднего результата."

execution:
  timeout_s: 1200
