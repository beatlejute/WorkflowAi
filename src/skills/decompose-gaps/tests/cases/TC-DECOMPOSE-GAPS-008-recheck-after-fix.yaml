id: TC-DECOMPOSE-GAPS-008
title: "Дефект из тестирования — исправление и повторная проверка; gap закрыт другим тикетом, только если его результат записан позже причины"
origin:
  chg: ["ad-hoc-2026-09-28"]
  incidents:
    - "PulseProxy PLAN-017, 2026-09-28: тикет тестирования записал дефект значка вкладки (результат 03:46 UTC). Ночная декомпозиция пробелов по REPORT-023 завела только тикет исправления, без повторной проверки; исправление закрыто в 07:32 UTC. Днём разбор отчёта нашёл пробел «после исправления сценарий не перепроверен», а декомпозиция отклонила его по проверке scope 2 как deliverable другого тикета, назвав тикет тестирования «повторной проверкой после фикса». План не закрылся, отчёт и разбор повторялись на неизменной доске."
  principle: "Точка контроля — создание тикетов: исправление дефекта из тестирования заводится в паре с повторной проверкой, зависящей от него (узел P10R2). Страховка — проверка scope: другой тикет закрывает gap, только если его результат записан после события, от которого gap возник (узел P10R1, algorithms/scope-check.md)."
  backlog_sources: []
tags: [scope-check, recheck, regression-guard]
severity: high

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    (L0-only тест: scenario не запускает агентов, проверяется только static
    assertion над содержимым рабочих файлов скила.)

assertions:
  static:
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: "P10R1\\[\"П10 ПРАВИЛО: Gap закрыт другим тикетом, только если результат того тикета записан после события, от которого gap возник[^\\n]*Тикет тестирования, записавший дефект до его исправления, повторной проверкой после исправления не является"
      reason: "Gap не отклоняется как сделанный тикетом, результат которого записан раньше причины gap."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: "P10R2\\[\"П10 ПРАВИЛО: Gap — дефект, найденный тикетом тестирования,[^\\n]*две работы: исправление и повторная проверка[^\\n]*тикет повторной проверки зависит от тикета исправления"
      reason: "Исправление дефекта из тестирования не заводится без повторной проверки, которая ждёт исправления."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: "P10E1 --> P10R1 --> P10R2 --> P10S1"
      reason: "Оба правила стоят в начале этапа — до проверки scope и создания тикетов."
    - kind: skill_contains
      file: "algorithms/scope-check.md"
      pattern: "IF gap — deliverable другого тикета \\(создан как часть DoD\\) AND результат того тикета записан после события, от которого возник gap"
      reason: "Алгоритм проверки scope 2 не противоречит узлу P10R1: отказ «deliverable другого тикета» требует более позднего результата."
