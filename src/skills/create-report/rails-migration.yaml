# Карта переноса скила create-report на рельсы (CONVERT 2026-09-23).
# Каждая фраза-инвариант прозаической версии получила узел графа, справочник или
# обоснованный отказ. Проверка: node .workflow/src/scripts/check-rails-coverage.js
# --skill create-report --baseline <ref> --map rails-migration.yaml
version: 1
skill: create-report
baseline: HEAD
entries:
  # --- принципы и границы -> П0 ---
  - phrase: "Пропуск тикетов = искажение картины."
    target: "P0R2"
  - phrase: "Интерпретации — задача аналитика."
    target: "P0R3"
  - phrase: "- **Анализ отчётов** → соответствующий скил проекта"
    target: "P0R1"
  - phrase: "- **Создание/изменение планов** → соответствующий скил проекта"
    target: "P0R1"
  - phrase: "- **Выполнение бизнес-задач** → соответствующий скил проекта"
    target: "P0R1"
  - phrase: "- **Декомпозиция задач** → соответствующий скил проекта"
    target: "P0R1"

  # --- проверка аномалий -> П10S2 ---
  - phrase: "**Автоматическая проверка (рекомендуется):**"
    target: "P10S2"
  - phrase: "**Ручная проверка (если скрипт недоступен):**"
    target: "P10S2"
  - phrase: "**Действия при обнаружении аномалии:**"
    target: "P10S2"

  # --- расчёт метрик -> П10S5, П10S6 ---
  - phrase: "**Автоматический расчёт (рекомендуется):**"
    target: "P10S5"
  - phrase: "**Ручной расчёт (если скрипт недоступен):**"
    target: "P10S5"
  - phrase: "При автоматическом расчёте (шаг 5) — бери из поля `anomalies` результата скрипта."
    target: "P10S6"

  # --- атрибуция root cause -> П0R5, П10G1, П10S7, П10S8, П10S9 ---
  - phrase: "Это нарушает evidence-based анализ и приводит к правке не тех компонентов."
    target: "P10G1"
  - phrase: "Без чтения лога ты вынужден угадывать виновника."
    target: "P0R5"
  - phrase: "Угадывание = ошибка атрибуции = правка не того компонента."
    target: "P10G1"
  - phrase: "Возьми **самый свежий** лог по дате (mtime), относящийся к анализируемому периоду."
    target: "P10S7"
  - phrase: "Ищи паттерны:"
    target: "P10S7"
  - phrase: "**Запиши в отчёт точную атрибуцию:**"
    target: "P10S8"
  - phrase: "**Формат записи в отчёт:**"
    target: "P10S8"
  - phrase: "Каждый инцидент проверяй заново по своему логу"
    target: "P10S8"
  - phrase: "Каждый отчёт = независимая верификация по логу."
    target: "P10S8"
  - phrase: "Это честнее и не уводит коуча/стейкхолдера в неправильную сторону."
    target: "P0R5"
  - phrase: "**Граничные случаи:**"
    target: "P10S9"

  # --- сохранение отчёта -> П10S12 ---
  - phrase: "Сообщи о проблеме и **остановись**."
    target: "P10S12"
