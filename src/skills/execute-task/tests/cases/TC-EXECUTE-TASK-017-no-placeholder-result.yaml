id: TC-EXECUTE-TASK-017
title: "Результат, который поручает описание тикета, делается рабочим, даже если DoD его не проверяет; заглушка, которая всегда успешна, запрещена"
origin:
  chg: ["ad-hoc-2026-09-30"]
  incidents:
    - "ListeningGlass PLAN-001 задача 3 → IMPL-003 (2026-09-29): «Детали задачи» поручали скрипт `test:e2e` — e2e-тесты, DoD проверял только сборку, `npm test` и имя в manifest. Исполнитель (бесплатная модель) записал `\"test:e2e\": \"echo 'e2e tests to be added'\"` — команду, которая тестов не запускает и всегда успешна; Result назвал скрипт сделанным, в «Заметках» о заглушке ни слова. Все три проверки DoD зелёные — тикет ушёл в done без модели ревью. Позже итоговый критерий плана «`npm run test:e2e` exit 0» прошёл бы на заглушке."
  principle: "Каждый результат, который поручают описание, «Детали задачи» и «Тест-кейсы», делается рабочим, даже если DoD его не проверяет; заглушка на месте поручённой работы — обходное решение по P0R7; результат, содержимое которого создаёт другая задача, делается настоящим и проверяется запуском; несделанный результат называется несделанным в Result (workflows/execute.md узлы P3R8, P6S3; algorithms/execution-strategy.md, чеклист)."
  backlog_sources:
    - "D:/Dev/ListeningGlass/.workflow/tickets/done/IMPL-003.md"
tags: [placeholder, deliverable, regression-guard]
severity: high

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    (L0-only тест: scenario не запускает агентов, проверяются только static
    assertions над содержимым рабочих файлов скила.)

assertions:
  static:
    - kind: skill_contains
      file: "workflows/execute.md"
      pattern: "P3R8\\[\"П3 ПРАВИЛО: Каждый результат, который описание, «Детали задачи» и «Тест-кейсы» поручают этому тикету, делается рабочим, даже если DoD его не проверяет"
      reason: "Результат из описания тикета делается рабочим и без пункта DoD — на него опираются проверки следующих задач."
    - kind: skill_contains
      file: "workflows/execute.md"
      pattern: "P3R8\\[\"[^\"]*[Зз]аглушка на месте поручённой работы[^\"]{0,200}обходное решение по P0R7 и запрещена"
      reason: "Команда или код, которые работу не делают или скрывают провал и всё равно успешны, — запрещённый обход."
    - kind: skill_contains
      file: "workflows/execute.md"
      pattern: "P3R8\\[\"[^\"]*содержимое которого создаёт другая задача[^\"]*делается настоящим[^\"]*[Зз]апусти его и приложи вывод в Result"
      reason: "Скрипт запуска тестов, которых ещё нет, — настоящий и проверен запуском, а не заглушка до появления тестов."
    - kind: skill_contains
      file: "workflows/execute.md"
      pattern: "P3R8\\[\"[^\"]*[Рр]езультат, который рабочим не сделать, не ставится и не называется сделанным"
      reason: "Несделанный результат называется несделанным: Result не выдаёт заглушку за готовую работу."
    - kind: skill_contains
      file: "workflows/execute.md"
      pattern: "P3R7 --> P3R8 --> P3S1"
      reason: "Правило читается на этапе выполнения до первой правки."
    - kind: skill_contains
      file: "workflows/execute.md"
      pattern: "P6S3\\[\"[^\"]*GATE-3[^\"]*сделаны по P3R8: рабочие или названы в Result несделанными с причиной — заглушек на их месте нет"
      reason: "Финальный гейт не пропускает заглушку на месте поручённого результата."
    - kind: skill_contains
      file: "algorithms/execution-strategy.md"
      pattern: "- \\[ \\] Результаты, которые поручают описание, «Детали задачи» и «Тест-кейсы», рабочие или названы в Result несделанными с причиной — заглушек на их месте нет \\(узел P3R8\\)"
      reason: "Чеклист стратегии повторяет гейт."

execution:
  timeout_s: 60
