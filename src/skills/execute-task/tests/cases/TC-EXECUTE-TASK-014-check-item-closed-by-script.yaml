id: TC-EXECUTE-TASK-014
title: "Пункт DoD с проверкой check закрывает скрипт: команда дословно, красная не обходится, запись проверки не правится"
origin:
  chg: ["ad-hoc-2026-09-28"]
  incidents:
    - "PulseProxy, 2026-09-27: на тикетах тестирования QA-144, QA-145, QA-153, QA-159 исполнитель обошёл красную проверку DoD — написал «all DoD criteria met» после exit 1, удалил падающий тест, подменил команду пункта своей через `grep … | wc -l`, пометил пункт «не применимо». Каждый тикет исполнили заново."
    - "PulseProxy, 2026-09-27/28: на QA-147 и QA-156 исполнитель при отметке заменил строки `check:` на «PASSED: …» и `expect:` на `result:` — двенадцать пунктов провалены проверкой артефактов без запуска (dod_record_invalid)."
    - "PulseProxy QA-152, 2026-09-28: правило «пункт тестирования выполнен независимо от результата» против механической проверки с exit 1 — тикет вернулся на исполнение пять раз, прежде чем исполнитель вывел status: blocked."
  principle: "Пункт с check закрывает скрипт пайплайна по команде и expect, отметка итог не меняет: команда запускается дословно, красная — чинится работа или status: blocked, строки проверок в тикете не правятся (SKILL.md P4R4, P4R3; workflows/execute.md P3R2)."
  backlog_sources: []
tags: [dod-format-2, dod-checks, regression-guard]
severity: high

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    (L0-only тест: scenario не запускает агентов, проверяется только static
    assertion над содержимым рабочих файлов скила.)

assertions:
  static:
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P4R4\\[\"П4 ПРАВИЛО: Пункт DoD с вложенной проверкой check закрывает скрипт пайплайна, а не отметка[^\\n]*итог не меняют"
      reason: "Итог пункта с check — вывод команды против expect, а не «[x]», «не применимо» или «выявлен дефект»."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P4R4\\[\"[^\\n]*запусти команду пункта сам, дословно[^\\n]*команду, ожидание, фильтр теста и сам тест не меняй и не удаляй"
      reason: "Красная проверка не обходится подменой команды, фильтра или удалением теста."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P4R4\\[\"[^\\n]*что тикет не меняет[^\\n]*заверши со status: blocked, назови номер пункта и приложи вывод команды"
      reason: "Красная проверка вне власти тикета — status: blocked с номером пункта, без повторного исполнения по кругу."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P4E1 --> P4R1 --> P4R2 --> P4R3 --> P4R4 --> P4S1 --> P4Q1"
      reason: "Правило стоит в этапе финальной проверки критериев, до обхода пунктов DoD."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P4R3\\[\"П4 ПРАВИЛО: Для тикетов тестирования пункт DoD без проверки check считается выполненным"
      reason: "«Выполнен независимо от результата» — только для пункта без check: иначе правило противоречит механической проверке."
    - kind: skill_contains
      file: "workflows/execute.md"
      pattern: "P3R2\\[\"[^\"]*Так не закрываются[^\"]*2\\) пункт с проверкой check — он отмечается, только если команда совпала с expect"
      reason: "«Не применимо» не закрывает пункт с check (правило отметки пунктов P3R2)."
    - kind: skill_contains
      file: "workflows/execute.md"
      pattern: "P3R2\\[\"[^\\n]*меняй только «\\[ \\]» на «\\[x\\]»[^\\n]*check, expect, prose, visual[^\\n]*их текст не правь"
      reason: "Отметка пункта не меняет запись проверки."
