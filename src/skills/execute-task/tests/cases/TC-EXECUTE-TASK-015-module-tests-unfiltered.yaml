id: TC-EXECUTE-TASK-015
title: "Правка кода проверяется всеми тестами файлов, подключающих модуль, без фильтра; падение сверх базы — регрессия тикета"
origin:
  chg: ["ad-hoc-2026-09-29"]
  incidents:
    - "PulseProxy PLAN-017, IMPL-89 (2026-09-25): модалку публичных прокси переключили на общий загрузчик каталога. Result: «`npm run type-check` завершился с кодом 0; 5 целевых тестов `normalizeProxies` в `tests/popup/proxy-list.test.ts` прошли» — файл подключает изменённый модуль и держит ещё 12 тестов модалки (describe «Public proxies modal»), их не запускали. Ревью приняло. Полный прогон IMPL-88 в тот же день до правки шёл без этих падений, IMPL-106 вечером — с ними. IMPL-106, FIX-028 и итоговый отчёт тестирования DOCS-10 записали 12 падений «не связанными с задачей», план закрылся с красными тестами."
  principle: "Перед первой правкой кода исполнитель прогоняет без фильтра по имени теста тестовые файлы, подключающие изменяемый модуль, и записывает базу (P3S1); после правки — те же файлы снова, тесты, выбранные фильтром, остальные тесты файла не заменяют (P3S2). Падение сверх базы — регрессия этого тикета: зелёный прогон в файлах тикета или status: blocked с выводом падения, а не «посторонние падения». Гейт GATE-3 и чеклист стратегии требуют того же."
  backlog_sources: []
tags: [verification, regression, tests, regression-guard]
severity: high

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    (L0-only тест: scenario не запускает агентов, проверяется только static
    assertion над содержимым рабочих файлов скила.)

assertions:
  static:
    - kind: skill_contains
      file: "workflows/execute.md"
      pattern: "P3S1\\[\"[^\"]*Перед первой правкой кода найди тестовые файлы, которые подключают изменяемый модуль[^\"]*запусти их тестовой командой проекта без фильтра по имени теста и запиши итог в Result — это база для проверки регрессии"
      reason: "База снимается до правки и без фильтра — иначе падение нельзя отличить от чужого."
    - kind: skill_contains
      file: "workflows/execute.md"
      pattern: "P3S2\\[\"[^\"]*Изменён код — снова запусти без фильтра тестовые файлы базы из шага P3S1: тесты, которые ты считаешь целевыми и выбираешь фильтром, не заменяют остальные тесты того же файла"
      reason: "Прогон пяти «целевых» тестов по фильтру не заменяет остальные тесты файла, подключающего модуль."
    - kind: skill_contains
      file: "workflows/execute.md"
      pattern: "P3S2\\[\"[^\"]*Падение, которого нет в базе, — регрессия этого тикета, а не чужая работа: доведи до зелёного в файлах тикета или зафиксируй status: blocked с выводом падения"
      reason: "Новое падение не списывается в посторонние: зелёный прогон или blocked, в пределах файлов тикета."
    - kind: skill_contains
      file: "workflows/execute.md"
      pattern: "P3E1 --> P3R1 --> P3R2 --> P3R3 --> P3R4 --> P3R5 --> P3R6 --> P3R7 --> P3S1 --> P3S2 --> P3G1"
      reason: "База (P3S1) снимается до проверки после правки (P3S2)."
    - kind: skill_contains
      file: "workflows/execute.md"
      pattern: "P6S3\\[\"[^\"]*GATE-3[^\"]*Если изменён код — тестовые файлы базы из шага P3S1 прогнаны без фильтра до и после правки, падений сверх базы нет или status: blocked с выводом падения"
      reason: "Финальный гейт не пропускает RESULT без прогона базы до и после правки."
    - kind: skill_contains
      file: "algorithms/execution-strategy.md"
      pattern: "- \\[ \\] \\*\\*Если изменён код\\*\\* — тестовые файлы, подключающие изменённый модуль, прогнаны без фильтра по имени теста до правки \\(база\\) и после неё, падений сверх базы нет — иначе это регрессия тикета"
      reason: "Чеклист стратегии не допускает проверку правки кода «любой проверочной командой» вместо тестов модуля."
