id: TC-EXECUTE-TASK-018
title: "Утверждение Result о другом тикете (статус, блокировка, общий блокер, что входит в его задачу, его ID) пишется только после чтения файла этого тикета"
origin:
  chg: ["ad-hoc-2026-09-30-shared-location"]
  incidents:
    - "PulseProxy PLAN-020 задача 33 → DOCS-014 (2026-09-30): исполнитель упёрся в запрет записи в каталог скилов и записал в «Заметки для следующих задач»: «Под тем же правилом `.workflow/src/skills/**` заблокированы остальные DOCS-задачи плана, правящие shared knowledge: DOCS-013 и DOCS-015». На деле DOCS-013 правил PRIVACY_POLICY.md, DOCS-015 — CHANGELOG.md, оба закрыты в done/ с ревью passed (DOCS-015 — через 8 минут после блокировки DOCS-014). Утверждение о соседних тикетах записано без открытия их файлов."
    - "PulseProxy PLAN-020 (2026-09-30): IMPL-118, IMPL-121, IMPL-123 подобрали ID тикетов к номерам задач плана наугад («Задача 15 (IMPL-115 / QA-165)» при привязке задачи 15 к QA-170)."
    - "ListeningGlass PLAN-001 (2026-09-30): IMPL-005 записал, что запрос разрешения на хост «ложится на панель (IMPL-008)», не открыв файл IMPL-008 — в его «Деталях задачи» и DoD этого требования нет, запрос разрешения в продукте не реализован; QA-006 записал причину сбоя «подтверждено дважды независимо» со ссылкой на QA-002."
  principle: "Каждое утверждение Result о другом тикете — статус, блокировка, общий блокер, что входит в его задачу, его ID — проверено чтением файла этого тикета в его текущей папке статуса или прочитанной в сессии записью плана; непроверенное не пишется; «Заметки» и Result другого тикета — утверждения к проверке, не независимое подтверждение; требование передаётся другому тикету, только если оно есть в его файле (workflows/execute.md узлы P6S3, P3R9, P3S1; SKILL.md узел P2S1)."
  backlog_sources:
    - "D:/Dev/PulseProxy/.workflow/tickets/blocked/DOCS-014.md"
tags: [evidence, other-tickets, regression-guard]
severity: medium

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    (L0-only тест: scenario не запускает агентов, проверяется только static
    assertion над содержимым рабочего файла скила.)

assertions:
  static:
    - kind: skill_contains
      file: "workflows/execute.md"
      pattern: "P6S3\\[\"[^\"]*GATE-3[^\"]*утверждение Result о другом тикете[^\"]{0,80}проверено чтением файла этого тикета в его текущей папке статуса; не проверено — не пишется"
      reason: "Финальный гейт не пропускает в Result непроверенные утверждения о статусе или блокировке других тикетов."
    - kind: skill_contains
      file: "workflows/execute.md"
      pattern: "P6S3\\[\"[^\"]*о другом тикете — статус, блокировка, общий блокер, что входит в его задачу — проверено"
      reason: "Утверждение о том, что входит в задачу другого тикета, тоже проверяется по его файлу."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P2S1\\[\"[^\"]*Номер задачи плана переводи в ID тикета только по прочитанной в этой сессии записи"
      reason: "ID чужого тикета не подбирается к номеру задачи плана наугад."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P2S1\\[\"[^\"]*«Заметки» и Result других тикетов — утверждения к проверке, не факт"
      reason: "Чужие «Заметки» — не факт."
    - kind: skill_contains
      file: "workflows/execute.md"
      pattern: "P3R9\\[\"[^\"]*Утверждение из «Заметок» или Result другого тикета — чужое[^\"]*независимым подтверждением не считается"
      reason: "Чужое утверждение не подтверждает само себя."
    - kind: skill_contains
      file: "workflows/execute.md"
      pattern: "P3S1\\[\"[^\"]*Требование передаётся другому тикету, только если в прочитанном файле того тикета оно есть в «Деталях задачи» или DoD"
      reason: "Требование не уходит в другой тикет без чтения его файла."

execution:
  timeout_s: 60
