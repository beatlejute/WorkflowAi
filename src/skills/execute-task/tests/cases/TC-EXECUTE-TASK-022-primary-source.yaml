id: TC-EXECUTE-TASK-022
title: "Утверждение о факте продукта вне правки — число, свойство файла, поведение кода, причина сбоя — пишется только с первоисточником этой сессии"
origin:
  chg: ["ad-hoc-2026-10-01-primary-source"]
  incidents:
    - "ListeningGlass PLAN-001 (2026-09-30): IMPL-008 записал «popup.css — 368 строк» при 24; IMPL-007 — «тесты проекта подключают изменяемый модуль» про файл, который модуль не импортирует; QA-005, QA-002 и QA-006 называли разные причины одного сбоя загрузки (всего четыре версии), реальную причину нашёл человек (HUMAN-002); DOCS-002 и DOCS-003 описали в текстах магазина поведение, которого нет в коде."
    - "PulseProxy PLAN-020 (2026-09-30): IMPL-117 записал «clearRoutingCache обновлён» — следующая итерация нашла, что карты не сбрасываются."
  principle: "Утверждение в Result, «Заметках» или документе о факте продукта вне правки — с первоисточником этой сессии (путь:строка, вывод команды, текст ошибки) или с пометкой «предположение»; документ описывает только поведение, которое есть в прочитанном коде; отсутствие тестов модуля называется, а не маскируется формулой базы. Утверждения о других тикетах охраняет TC-EXECUTE-TASK-018 (workflows/execute.md P3R9, P3R1, P3S1, P6S3; templates/result-template.md; algorithms/execution-strategy.md)."
  backlog_sources:
    - "D:/Dev/ListeningGlass/.workflow/tickets/done/QA-006.md"
    - "D:/Dev/ListeningGlass/.workflow/tickets/done/IMPL-008.md"
tags: [evidence, claims, regression-guard]
severity: high

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    (L0-only тест: scenario не запускает агентов, проверяются только static
    assertions над содержимым рабочих файлов скила.)

assertions:
  static:
    - kind: skill_contains
      file: "workflows/execute.md"
      pattern: 'P3R9\["[^"]*2\) Первоисточник: утверждение в Result, «Заметках» или документе о факте вне правки'
      reason: "Правило первоисточника — часть узла доказательности."
    - kind: skill_contains
      file: "workflows/execute.md"
      pattern: 'P3R9\["[^"]*число, свойство файла, поведение кода, причина сбоя[^"]*пишется только с первоисточником этой сессии'
      reason: "Правило называет виды утверждений, которые тиражировались без источника."
    - kind: skill_contains
      file: "workflows/execute.md"
      pattern: 'P3R9\["[^"]*иначе не пишется или помечается «предположение»'
      reason: "Без источника — не писать или пометить."
    - kind: skill_contains
      file: "workflows/execute.md"
      pattern: 'P3R1\["[^"]*каждое утверждение о поведении продукта сверить с кодом, прочитанным в этой сессии'
      reason: "Документ описывает только поведение, которое есть в коде."
    - kind: skill_contains
      file: "workflows/execute.md"
      pattern: 'P3S1\["[^"]*Таких тестов нет — так и запиши, без утверждения, что модуль подключают остальные тесты'
      reason: "Отсутствие тестов модуля не маскируется формулой базы."
    - kind: skill_contains
      file: "workflows/execute.md"
      pattern: 'P6S3\["[^"]*Утверждения о числе, свойстве файла, поведении кода и причине сбоя — с первоисточником по P3R9 или помечены «предположение»'
      reason: "GATE-3 проверяет не только утверждения о статусе чужих тикетов."
    - kind: skill_contains
      file: "templates/result-template.md"
      pattern: 'утверждение о числе, свойстве файла, поведении кода или причине сбоя — с первоисточником или с пометкой «предположение»'
      reason: "Шаблон «Заметок» требует источник."
    - kind: skill_contains
      file: "algorithms/execution-strategy.md"
      pattern: '- \[ \] Утверждения о числе, свойстве файла, поведении кода и причине сбоя — с первоисточником этой сессии'
      reason: "Чеклист стратегии согласован с гейтом."

execution:
  timeout_s: 60
