# Карта переноса прозы execute-task в граф (CONVERT 2026-09-23).
# Используется check-rails-coverage.js: фраза-инвариант считается покрытой, если её подстрока
# >= 25 символов есть в текущих файлах скила либо она перечислена здесь с решением.
#
# Правило деления (П70S2 коуча): что агент обязан цитировать — в лейбл узла; что читается по
# надобности — остаётся справочником. Поэтому:
#   - SKILL.md и workflows/execute.md переписаны графом: их фразы-инварианты живут в лейблах
#     узлов дословно (ядро П0-П2, П4, П5, П7 в SKILL.md; П3 «выполнение» и П6 «гейты» —
#     фрагмент workflows/execute.md);
#   - algorithms/execution-strategy.md, knowledge/ticket-structure.md,
#     knowledge/context-checkpoints.md, templates/result-template.md не тронуты — это
#     справочники, их фразы покрыты самими файлами;
#   - tests/cases/** и tests/rubrics/** не тронуты — L0-anchors и L2-рубрики остаются в силе.
#
# Ниже — фразы, которые в лейблы не попали. Три вида решений:
#   - <узел> — смысл фразы живёт в лейбле этого узла, сама формулировка была служебной
#     (заголовок раздела прозы, подпись примера, ссылка на номер шага);
#   - "ребро <A> -> <B>" — фраза описывала переход между шагами, теперь это стрелка графа;
#   - "dropped: <обоснование>" — фраза не переносится.
