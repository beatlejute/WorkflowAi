id: TC-DECOMPOSE-PLAN-018
title: "Сводный тикет regression sweep прямо зависит от каждого тикета реализации и проверки плана, вывод стадии показывает эти зависимости"
origin:
  chg: ["ad-hoc-2026-10-01-analysis"]
  incidents:
    - "PulseProxy PLAN-020 → QA-180 (decompose-plan 2026-09-29 18:56, канон e5cd3a8): по условию В узла P10S4 («последний в цепочке зависимостей») сводному QA-180 поставлены зависимости только на три последних ручных тикета (QA-175, QA-177, QA-179). В их замыкание не попал IMPL-115 (задача 8, public-proxy-catalog.ts). Потерь нет — очередь случайно выполнила IMPL-115 раньше; при другом порядке сводный прогон закрылся бы до изменения каталога. В выводе стадии не было разбора условия Б по задачам, меняющим файлы реестра, — только «25/28/31 — ручные, наблюдаемая зона». Текст «зависимости — все тикеты реализации плана» появился в P10S5 в 27c4800 (1.21.3), но «прямо» и причина — нет."
  principle: "В dependencies сводного тикета прямо перечислены каждый тикет реализации и каждый тикет проверки плана: зависимость через замыкание не в счёт, оно меняется при правке и разбиении тикетов; вывод стадии показывает соответствие «задача → файл реестра → парный тикет» и прямые зависимости сводного тикета (workflows/decompose.md узлы P10S4, P10S5; SKILL.md узел P6S1)."
  backlog_sources:
    - "D:/Dev/PulseProxy/.workflow/tickets/archive/QA-180.md"
tags: [paired-tickets, dependencies, regression-sweep, regression-guard]
severity: medium

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    (L0-only тест: scenario не запускает агентов, проверяются только static
    assertions над содержимым рабочих файлов скила.)

assertions:
  static:
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S4\["[^"]*последний в цепочке зависимостей: в его dependencies прямо перечислены каждый тикет реализации и каждый тикет проверки плана — зависимость через замыкание не в счёт'
      reason: "Сводный тикет — последний: он зависит от каждого тикета реализации и проверки напрямую, а не через замыкание."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S5\["[^"]*сводный тикет \(его прямые зависимости — все тикеты реализации и проверки плана, узел P10S4\)'
      reason: "Требование к полям парных и сводного тикетов согласовано с условием В."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P6S1\["[^"]*по каждой задаче, меняющей файл реестра observable-инвариантов, — строку «задача → файл реестра → парный тикет», список прямых зависимостей сводного тикета regression sweep'
      reason: "Соответствие условию Б и зависимости сводного тикета видны в выводе стадии, а не только в файлах тикетов."

execution:
  timeout_s: 60
