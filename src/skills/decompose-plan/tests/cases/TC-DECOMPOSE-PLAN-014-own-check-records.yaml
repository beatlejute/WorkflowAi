id: TC-DECOMPOSE-PLAN-014
title: "Запись проверки, которую декомпозиция пишет сама, проходит правильная работа; тикет с записями несёт dod_format: 2 и проходит гейт после записи"
origin:
  chg: ["ad-hoc-2026-09-30"]
  incidents:
    - "PulseProxy PLAN-020 → QA-180 (2026-09-29): условие В узла P10S4 дало сводный тикет regression sweep — не задачу плана. Декомпозитор сам написал ему две записи и ни одну не запустил: `node node_modules/@playwright/test/cli.js test tests/e2e/ --reporter=line` с ожиданием `stdout matches /0 failed/` (построчный отчёт при нуле провалов такой строки не печатает) и `npm test --json` (npm забирает флаг до `--`, исполнитель проверок такую запись отклоняет); полный прогон e2e шёл 14 минут при таймауте исполнителя проверок 120 с. dod_format: 2 не поставлен: по букве P10S18 поле требовалось только тикету с перенесёнными записями, поэтому гейт перед ready/ тикет пропустил. Три исполнения правильной работы (sonnet, opus ×2) трижды ушли в blocked/. При переводе скила на рельсы у условия В пропал «проход по полному реестру observable-инвариантов»."
    - "ListeningGlass PLAN-001 и PulseProxy PLAN-020 (2026-09-29): в LG первый проход положил под пункт DoD 1 все 2–3 записи строки «Проверка:» — verify-atomicity провалил 17 тикетов из 25 (multiple_forms), второй проход занял 8 мин 39 с. Гейт P10G6 (check-ticket-dod.js, с 1.21.3) такой пункт пропускает — проба при разборе: dodStartProblems смотрит только пункты kind check, тикет type: human получает «ok». В PP агент по своей инициативе запустил verify-atomicity.js, поймал 17 FAIL из 35 и исправил их, но третий запуск перевёл план approved → active внутри стадии (флаг --activate введён в 1.23.0). Теперь самопроверка — гейт P10G7 без --activate после узла P10S16, FAIL формы и записей чинит P10S20, FAIL размера разбивает P10S16 на том же круге."
  principle: "Запись проверки, которой нет в плане, декомпозиция пишет по правилам: её проходит правильная работа, тикет проверки читает артефакт с итогом, ожидание — код возврата или сверенный запуском текст, команда в таймауте исполнителя проверок, аргументы скрипту — после `--`; тикет с любой записью — dod_format: 2; после записи тикетов — гейт check-ticket-dod.js с правкой записей и формы пунктов, затем самопроверка всех тикетов плана скриптом verify-atomicity без флага --activate, FAIL размера разбивается на том же круге; verify-atomicity отклоняет записи без dod_format: 2 и записи, которые не запустит исполнитель проверок (workflows/decompose.md узлы P10S4, P10S18, P10S19, P10G6, P10G7, P10S16, P10S20, P10S15, P10S1; SKILL.md P0R8; scripts/verify-atomicity.js)."
  backlog_sources:
    - "D:/Dev/PulseProxy/.workflow/tickets/ready/QA-180.md"
tags: [dod-transfer, check-record, regression-sweep, regression-guard]
severity: high

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    (L0-only тест: scenario не запускает агентов, проверяются только static
    assertions над содержимым рабочих файлов скила.)

assertions:
  static:
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S4\["[^"]*сводный тикет regression sweep с проходом по полному реестру observable-инвариантов[^"]*по узлу P10S19'
      reason: "Сводный тикет проходит по реестру observable-инвариантов, а не только прогоняет набор тестов; его записи — по P10S19."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S19\["П10 ШАГ: Запись проверки, которой нет в плане, декомпозиция пишет сама'
      reason: "У записей, которые пишет сама декомпозиция, есть свои правила."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S19\["[^"]*проходит правильно сделанная работа тикета[^"]*запись читает этот артефакт, а не требует, чтобы продукт прошёл'
      reason: "Тикет проверки подтверждается артефактом с итогом, найденный дефект — выполненный пункт."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S19\["[^"]*[Оо]жидание — код возврата, совпадение со строкой вывода — только по тексту, сверенному запуском того же инструмента'
      reason: "Текст вывода в ожидании — только проверенный запуском: отчёт при нуле провалов строки с нулём не печатает."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S19\["[^"]*укладывается в таймаут исполнителя проверок[^"]*итог долгого прогона пишется в артефакт'
      reason: "Запись дольше таймаута исполнителя проверок красная при любой работе."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S19\["[^"]*[Аа]ргументы скрипту менеджера пакетов — после `--`'
      reason: "Флаг до `--` менеджер пакетов забирает себе, исполнитель проверок такую запись отклоняет."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S18\["[^"]*[Тт]икет, у которого под пунктами DoD есть хотя бы одна запись — перенесённая из плана или написанная по узлу P10S19, — несёт во frontmatter dod_format: 2'
      reason: "Поле нужно любому тикету с записями, а не только тикету с перенесёнными."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10G6\{"[^"]*check-ticket-dod\.js[^"]*кроме провала записи, перенесённой из плана'
      reason: "После записи тикетов — тот же гейт, что перед ready/; запись плана декомпозитор не меняет."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S15 --> P10G6'
      reason: "Гейт стоит сразу после сохранения тикетов."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10G6 -->\|"нет"\| P10S20'
      reason: "Провал гейта ведёт к правке сохранённого тикета."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S20 --> P10G6'
      reason: "После правки — снова гейт."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10G7\{"П10 ГЕЙТ: Самопроверка всех тикетов плана до передачи стадии — node \.workflow/src/skills/decompose-plan/scripts/verify-atomicity\.js plan_file: \{plan_path\} без флага --activate'
      reason: "Самопроверка всех тикетов плана — узел графа с точной командой без флага активации, а не инициатива агента (2026-09-29: агент сам запускал скрипт и перевёл план в active)."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10G7\{"[^"]*с флагом --activate скрипт переводит план в active, а статус плана переключает стадия пайплайна'
      reason: "Причина запрета флага названа в узле: статус плана — работа стадии пайплайна (P0R9)."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10G7\{"[^"]*он проверяет все тикеты плана разом — размер DoD и шагов, форму пунктов, only_regression_checks, no_dod_items'
      reason: "Почему нужна вторая проверка: гейт атомарности пайплайна проверяет то, чего нет в условиях старта тикета."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10G6 -->\|"да"\| P10S16\s+P10G6 -->\|"нет"\| P10S20\s+P10S20 --> P10G6\s+P10S16 --> P10G7\s+P10G7 -->\|"да"\| P10S17\s+P10G7 -->\|"нет"\| P10S20'
      reason: "Самопроверка стоит после правил повторного прохода и до выхода этапа, провал ведёт в правку и снова в оба гейта."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S20\["П10 ШАГ: Провал гейта P10G6 или P10G7[^"]*Пункт с несколькими записями \(multiple_forms\) делится по узлу P10S18 — пункт на каждую запись с полным текстом критерия, сами записи не меняются'
      reason: "Форма пункта чинится делением пункта, записи при этом не меняются."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S20\["[^"]*Тикет без пунктов DoD \(no_dod_items\) получает критерии своей задачи по узлу P10S18, тикет из одних регрессионных проверок \(only_regression_checks\)'
      reason: "Каждая причина FAIL скрипта имеет правку в узле."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S20\["[^"]*FAIL размера \(пунктов DoD больше 7, шагов больше 5\) правкой пункта не чинится: тикет разбивает узел P10S16 на этом же круге'
      reason: "FAIL размера не уходит на платный повторный проход стадии."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S16\["[^"]*Тикет, которому гейт узла P10G7 дал FAIL размера \(пунктов DoD больше 7, шагов больше 5\), разбивается здесь же, на этом круге'
      reason: "Разбиение по FAIL размера самопроверки — по правилам повторного прохода."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S1\["[^"]*Повторный проход \(на входе есть atomicity_failures\) — сначала прочитай узел P10S16'
      reason: "На повторном проходе агент читает правила повторного прохода до начала работы, а не в конце этапа."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P0R8\["[^"]*[Зз]аписи проверок под пунктами DoD — не инструменты исполнителя'
      reason: "Правило «без инструментов» не запрещает записи проверок."
    - kind: skill_contains
      file: "scripts/verify-atomicity.js"
      pattern: 'dod_format_missing — под пунктами DoD есть записи проверки, а dod_format: 2 во frontmatter нет'
      reason: "Машинная защита: тикет с записями без поля возвращается на повторную декомпозицию."
    - kind: skill_contains
      file: "scripts/verify-atomicity.js"
      pattern: 'check_denied \(\$\{problem\.reason\}\)'
      reason: "Машинная защита: запись, которую исполнитель проверок отклонит, — FAIL до работы."
    # 2026-09-30: агент декомпозиции запустил скрипт для самопроверки, и тот перевёл план
    # в active внутри стадии декомпозиции — статус плана декомпозиции трогать нельзя.
    - kind: skill_contains
      file: "scripts/verify-atomicity.js"
      pattern: "const activate = argv\\.includes\\(ACTIVATE_FLAG\\)"
      reason: "План активирует только запуск с флагом --activate — его передаёт стадия пайплайна."
    - kind: skill_contains
      file: "scripts/verify-atomicity.js"
      pattern: "reason: 'activation_not_requested'"
      reason: "Без флага скрипт только проверяет и сообщает, что активация не запрошена."

execution:
  timeout_s: 60
