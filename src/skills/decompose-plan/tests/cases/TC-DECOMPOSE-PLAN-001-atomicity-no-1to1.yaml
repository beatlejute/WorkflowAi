id: TC-DECOMPOSE-PLAN-001
title: "Декомпозитор применяет чеклист атомарности и не маппит 1:1"
origin:
  chg: [CHG-053, CHG-054, CHG-037, CHG-103, CHG-104]
  incidents:
    - "workflowAi: CHG-053 — маппинг 1 задача = 1 тикет без чеклиста"
    - "workflowAiVsCode: CHG-103/104 — неатомарные тикеты после текстового усиления"
    - "workflowAi 2026-09-24: после перевода скила на рельсы (b6a8c91, 2026-09-23) вход стадии стал гейтом П0 — план и карта id_ranges. Кейс id_ranges_json не подавал, и агент останавливался на входе. Добавлены id_ranges_json и указание, что план передан текстом."
  principle: "Атомарность тикетов + запрет 1:1"
  backlog_sources:
    - ".workflow/coach-backlog.yaml"
    - "d:/Dev/PulseProxy/.workflow/coach-backlog.yaml"
    - "d:/Dev/workflowAiVsCode/.workflow/coach-backlog.yaml"
tags: [atomicity, decomposition, anti-pattern]
severity: high

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    Декомпозируй следующий план в тикеты.

    id_ranges_json: {"ARCH":3,"IMPL":41,"FIX":12,"REVIEW":4,"DOCS":9,"ADMIN":5,"QA":18,"COACH":7,"HUMAN":6,"RSH":2}

    Файла плана на диске нет — план приведён ниже в разделе plan_content
    целиком, работай по нему.
  inputs:
    - kind: inline
      as: plan_content
      content: |
        Задача 1: Исправить дефект А (неверный маппинг полей) + дефект Б (отсутствие валидации) + smoke-тест
          DoD: дефект А исправлен, дефект Б исправлен, smoke 6 TC пройден
        Задача 2: Обновить конфигурацию CI
          DoD: pipeline зелёный

assertions:
  static:
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "атомарн"
      reason: "Принцип атомарности должен быть в SKILL.md."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "⛔"
      reason: "Явные запреты (включая 1:1 маппинг) должны быть отмечены."

  # L1 проверяет только итоговый ответ стадии: раннер сохраняет его одного. Таблицы
  # проверок атомарности в итоговом ответе нет — прогон 2026-09-24: судья 5, ассершен
  # на «PASS/FAIL … Проверка» не нашёл её. Запрет строки «1:1» противоречил критерию
  # рубрики: явный отказ от маппинга 1:1 её и содержит. Маппинг 1:1 дал бы два тикета
  # на два пункта плана — раздел «Файлы:» итогового ответа должен назвать не меньше трёх.
  deterministic:
    - kind: output_matches
      regex: 'Файлы:[*_ \t]*(?:\n[ \t]*){0,2}(?:(?!\n[ \t]*\n|---RESULT---)[\s\S])*?tickets[/\x5c][a-z-]+[/\x5c][A-Z]+-\d+\.md(?:(?!\n[ \t]*\n|---RESULT---)[\s\S])*?tickets[/\x5c][a-z-]+[/\x5c][A-Z]+-\d+\.md(?:(?!\n[ \t]*\n|---RESULT---)[\s\S])*?tickets[/\x5c][a-z-]+[/\x5c][A-Z]+-\d+\.md'
      reason: "Составная задача 1 разбита: на два пункта плана создано не меньше трёх тикетов."

  rubric:
    - kind: llm_judge
      rubric_file: "../rubrics/atomicity-no-1to1.md"
      criterion: "Разбил ли агент составную задачу плана на несколько атомарных тикетов и явно отказался от маппинга 1:1?"
      pass_threshold: 4
      trials: 3
      aggregate: majority

execution:
  timeout_s: 2400
