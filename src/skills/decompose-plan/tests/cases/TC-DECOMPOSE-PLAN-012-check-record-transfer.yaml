id: TC-DECOMPOSE-PLAN-012
title: "Декомпозитор переносит запись проверки из плана под пункт DoD без изменений, критерию без проверки ставит prose"
origin:
  chg: []
  incidents:
    - "PLAN-002 задача 7 (2026-09-26): узел P10S18 (задача 6) переносит запись из строки «**Проверка:**» критерия плана вложенным пунктом под пункт DoD без изменений; у критерия без строки проверки — prose: `в плане нет проверки`; тикет несёт dod_format: 2. По записи пайплайн исполняет проверку и собирает evidence для ревью, поэтому изменённая при переносе запись проверяет не то, что задал план. verify-atomicity.js (задача 10) ловит пункт без формы, но не сверяет запись с планом."
  principle: "Проверка пункта DoD переносится из плана без изменений; критерий без проверки получает prose с причиной, а не придуманную проверку"
  backlog_sources:
    - ".workflow/plans/current/PLAN-002.md"
tags: [dod-transfer, check-record, verbatim]
severity: high

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    Декомпозируй задачи плана на тикеты. Типы тикетов в проекте (из
    `config.yaml → task_types`): IMPL (реализация), QA (автотесты), DOCS
    (документация), ADMIN (инфраструктурные операции).

    id_ranges_json: {"IMPL":41,"QA":18,"DOCS":9,"ADMIN":5}

    Файла плана на диске нет — задачи приведены ниже в разделе plan_content
    целиком, работай по ним.

    В итоговом ответе приведи секцию «Критерии готовности» каждого созданного
    тикета целиком — так, как она записана в файле тикета.
  inputs:
    - kind: inline
      as: plan_content
      content: |
        ### 1. Эндпоинт экспорта отчёта в CSV

        **Приоритет:** Высокий
        **Зависимости:** Нет
        **Описание:** Добавить эндпоинт `GET /reports/{id}/export.csv`, который отдаёт отчёт файлом CSV.
        **Файлы:** `src/api/reports.ts`
        **Критерий приёмки:** Эндпоинт экспорта отдаёт CSV, первая строка которого содержит заголовки колонок отчёта
        **Проверка:** check: `node --test src/tests/report-export.test.mjs`, expect: `exit 0`

        ### 2. Кнопка «Экспорт» на панели отчёта

        **Приоритет:** Средний
        **Зависимости:** Задача 1
        **Описание:** Добавить на панель отчёта кнопку «Экспорт», которая скачивает файл эндпоинта задачи 1.
        **Файлы:** `src/ui/report-panel.tsx`
        **Критерий приёмки:** Кнопка экспорта стоит справа от поля поиска и не перекрывает его
        **Проверка:** visual: `.workflow/evidence/screens/report-export-button.png`

        ### 3. Раздел об экспорте в README

        **Приоритет:** Низкий
        **Зависимости:** Задача 2
        **Описание:** Добавить в `README.md` раздел об экспорте отчёта.
        **Файлы:** `README.md`
        **Критерий приёмки:** README называет кнопку экспорта и формат скачиваемого файла

assertions:
  static:
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'Проверка:[^"\n]{0,40}без изменений'
      reason: "Запись из строки «Проверка:» критерия плана переносится под пункт DoD без изменений."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'нет строки проверки[^"\n]{0,40}prose'
      reason: "Критерий без строки проверки в плане получает вложенный prose с причиной, а не придуманную проверку."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'frontmatter\s+dod_format:\s*2'
      reason: "Тикет с перенесёнными проверками несёт dod_format: 2 — по полю пайплайн исполняет проверки и собирает evidence."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: '--> P10S18 --> P10G3'
      reason: "Узел переноса проверки стоит в цепочке рёбер сразу перед гейтом нумерации P10G3 — гейтом до любых Write и Edit, то есть до записи тикета."

  # Файлы созданных тикетов в промпт судьи не попадают, а verify-atomicity.js
  # (задача 10) проверяет у пункта DoD только наличие одной полной формы, не
  # совпадение записи с планом. Поэтому кейс просит привести секции DoD в
  # итоговом ответе, и L1 сверяет их со строками плана. Запись ищется строкой
  # сразу под пунктом, в разметке, которую читает parseDodChecks
  # (src/lib/check-runner.mjs): вложенный маркер, ключ, значение в обратных
  # кавычках; prose без обратных кавычек parseDodChecks читает как запись без
  # причины. Эхо плана («**Проверка:** …» в строке после «**Критерий приёмки:**»)
  # этой разметке не соответствует. Под критерием без проверки L1 решает форму
  # записи — prose с непустой причиной; о чём говорит причина, решает рубрика.
  # Раздел «Файлы:» — как в кейсах 001–006: от метки до пустой строки или блока
  # ---RESULT---.
  deterministic:
    - kind: output_matches
      regex: 'Файлы:[*_ \t]*(?:\n[ \t]*){0,2}(?:(?!\n[ \t]*\n|---RESULT---)[\s\S])*?tickets[/\x5c][a-z-]+[/\x5c][A-Z]+-\d+\.md(?:(?!\n[ \t]*\n|---RESULT---)[\s\S])*?tickets[/\x5c][a-z-]+[/\x5c][A-Z]+-\d+\.md(?:(?!\n[ \t]*\n|---RESULT---)[\s\S])*?tickets[/\x5c][a-z-]+[/\x5c][A-Z]+-\d+\.md'
      reason: "Три задачи плана записаны в тикеты: раздел «Файлы:» итогового ответа называет не меньше трёх файлов тикетов."
    - kind: output_contains_all
      values: ["Эндпоинт экспорта отдаёт CSV, первая строка которого содержит заголовки колонок отчёта", "Кнопка экспорта стоит справа от поля поиска и не перекрывает его", "README называет кнопку экспорта и формат скачиваемого файла"]
      reason: "Тексты трёх критериев плана перенесены в DoD дословно, вместе с референсами на артефакты: CSV, кнопка экспорта, README."
    - kind: output_matches
      regex: 'Эндпоинт экспорта отдаёт CSV, первая строка которого содержит заголовки колонок отчёта[^\n]*\r?\n[ \t]+[-*][ \t]+check:[ \t]*\x60node --test src/tests/report-export\.test\.mjs\x60,[ \t]*expect:[ \t]*\x60exit 0\x60[ \t]*(?:\r?\n|$)'
      reason: "Запись check плана стоит под своим пунктом DoD без изменений: та же команда, то же ожидание, без добавленных ключей."
    - kind: output_matches
      regex: 'Кнопка экспорта стоит справа от поля поиска и не перекрывает его[^\n]*\r?\n[ \t]+[-*][ \t]+visual:[ \t]*\x60\.workflow/evidence/screens/report-export-button\.png\x60[ \t]*(?:\r?\n|$)'
      reason: "Запись visual плана стоит под своим пунктом DoD без изменений: путь изображения не переименован под ID тикета."
    - kind: output_matches
      regex: 'README называет кнопку экспорта и формат скачиваемого файла[^\n]*\r?\n[ \t]+[-*][ \t]+prose:[ \t]*\x60[ \t]*[^\x60\s][^\x60\n]*\x60[ \t]*(?:\r?\n|$)'
      reason: "Под критерием без строки проверки в плане стоит prose с непустой причиной в обратных кавычках, а не придуманная запись check или visual и не пустое место."

  rubric:
    - kind: llm_judge
      rubric_file: "../rubrics/check-record-transfer.md"
      criterion: "Какая запись проверки стоит в итоговом ответе под пунктом DoD «README называет кнопку экспорта и формат скачиваемого файла»? Строки «Проверка:» у этого критерия в плане нет. Запись проверки — вложенная строка под пунктом, которая начинается с ключа check, prose или visual."
      pass_threshold: 4
      trials: 3
      aggregate: majority

execution:
  timeout_s: 2400
