id: TC-DECOMPOSE-PLAN-004
title: "Декомпозитор применяет executor-атомарность (Проверка 7) — разбивает DoD по типу исполнителя"
origin:
  chg: []
  incidents:
    - "workflowAi PLAN-006: FIX-5 (unit-тест в feat-тикете), IMPL-25 (commit как DoD), FIX-7 (интеграция другого тикета в DoD) — 7 из 23 multi-iteration tickets плана"
    - "workflowAi 2026-09-24: после перевода скила на рельсы (b6a8c91, 2026-09-23) вход стадии стал гейтом П0 — план и карта id_ranges. Кейс id_ranges_json не подавал, и агент останавливался на входе. Добавлены id_ranges_json и указание, что задача передана текстом."
  principle: "Executor-атомарность: один тип исполнителя на тикет"
  backlog_sources:
    - ".workflow/coach-backlog.yaml"
    - ".workflow/metrics/review-metrics.json"
tags: [atomicity, executor, decomposition]
severity: high

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    Декомпозируй следующую задачу плана. В проектном `config.yaml → task_types`
    определены типы: IMPL (реализация кода), QA (написание автотестов),
    DOCS (обновление документации), ADMIN (инфраструктурные операции).
    Git-операции (commit, merge, push) в этом проекте выполняет стейкхолдер,
    не агент-исполнитель.

    id_ranges_json: {"ARCH":3,"IMPL":41,"FIX":12,"REVIEW":4,"DOCS":9,"ADMIN":5,"QA":18,"COACH":7,"HUMAN":6,"RSH":2}

    Файла плана на диске нет — задача приведена ниже в разделе plan_content
    целиком, работай по ней.
  inputs:
    - kind: inline
      as: plan_content
      content: |
        Задача: Реализовать функцию buildTargetPrompt() в runner'е
          DoD:
            - Функция buildTargetPrompt() реализована в src/scripts/run-skill-tests.js
            - Юнит-тест TC-PROMPT-001 написан и зелёный
            - README обновлён разделом про prompt assembly
            - Коммит feat(runner): buildTargetPrompt создан

assertions:
  static:
    - kind: skill_contains
      file: "knowledge/atomicity-checklist.md"
      pattern: "Проверка 7"
      reason: "Проверка 7 executor-атомарности должна быть в чеклисте."
    - kind: skill_contains
      file: "knowledge/atomicity-checklist.md"
      pattern: "executor"
      reason: "Явное упоминание executor-атомарности."

  # L1 проверяет только итоговый ответ стадии: раннер сохраняет его одного. Прогон
  # 2026-09-24 (судья 4): таблицы проверок с «7. Один исполнитель» в итоговом ответе
  # нет, а «Коммит feat» нашёлся в объяснении, что этот пункт плана из DoD исключён, —
  # оба ассершена краснили правильное поведение. Git-операции в DoD тикетов оценивает
  # рубрика; здесь — раздел «Файлы:»: тикеты трёх типов исполнителя и ни одного HUMAN.
  deterministic:
    - kind: output_matches
      regex: 'Файлы:[*_ \t]*(?:\n[ \t]*){0,2}(?:(?!\n[ \t]*\n|---RESULT---)[\s\S])*?tickets[/\x5c][a-z-]+[/\x5c]IMPL-\d+\.md'
      reason: "Реализация функции — отдельный IMPL-тикет."
    - kind: output_matches
      regex: 'Файлы:[*_ \t]*(?:\n[ \t]*){0,2}(?:(?!\n[ \t]*\n|---RESULT---)[\s\S])*?tickets[/\x5c][a-z-]+[/\x5c]QA-\d+\.md'
      reason: "Юнит-тест — отдельный QA-тикет."
    - kind: output_matches
      regex: 'Файлы:[*_ \t]*(?:\n[ \t]*){0,2}(?:(?!\n[ \t]*\n|---RESULT---)[\s\S])*?tickets[/\x5c][a-z-]+[/\x5c]DOCS-\d+\.md'
      reason: "Обновление README — отдельный DOCS-тикет."
    - kind: output_does_not_contain
      values: ["/HUMAN-", "\\HUMAN-"]
      reason: "Git-коммит — не HUMAN-задача (human-task-rules.md): файла HUMAN-тикета среди созданных нет."

  rubric:
    - kind: llm_judge
      rubric_file: "../rubrics/executor-atomicity.md"
      criterion: "Разбил ли агент задачу на отдельные тикеты по типу исполнителя (IMPL + QA + DOCS) и удалил ли git-операции из DoD?"
      pass_threshold: 4
      trials: 3
      aggregate: majority

execution:
  timeout_s: 2400
