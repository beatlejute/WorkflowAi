id: TC-DECOMPOSE-PLAN-013
title: "Несколько записей под одним критерием — пункт на каждую с полным текстом критерия; часть, которую записи check не доказывают, уходит модели ревью пунктом prose"
origin:
  chg: []
  incidents:
    - "ListeningGlass PLAN-001 задача 5 → QA-001 (2026-09-29): под критерием «тесты проходят и падают, если из набора по умолчанию убрать любой домен» план записал прогон всего набора и поиск одного домена из девяти. Декомпозиция дала два пункта с одинаковым полным текстом, оба — check. Пункт check закрывает скрипт по коду выхода, текста пункта не читая (verify-artifacts.js), вопрос модели ревью строится только по пунктам prose и visual (prepare-review.js), поэтому «падают» не оценил бы никто. В той же декомпозиции IMPL-003 получил пункт с текстом, которого в плане нет, а IMPL-004 — три одинаковых."
  principle: "Каждая строка критерия задачи — свой критерий со своей проверкой; у всех пунктов одного критерия его полный дословный текст; часть критерия, которую ни одна запись check не доказывает, получает пункт с тем же текстом и prose, чтобы её оценила модель ревью (workflows/decompose.md узел P10S18; knowledge/atomicity-checklist.md проверка 3)."
  backlog_sources:
    - "D:/Dev/ListeningGlass/.workflow/plans/current/PLAN-001.md"
tags: [dod-transfer, check-record, verbatim, review-coverage]
severity: high

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    Декомпозируй задачи плана на тикеты. Типы тикетов в проекте (из
    `config.yaml → task_types`): IMPL (реализация), QA (автотесты), DOCS
    (документация), ADMIN (инфраструктурные операции).

    id_ranges_json: {"IMPL":12,"QA":4,"DOCS":3,"ADMIN":2}

    Файла плана на диске нет — задачи приведены ниже в разделе plan_content
    целиком, работай по ним. Модуль `src/site-list.js` уже есть: набор
    доменов по умолчанию — девять доменов, среди них `rutube.ru`.

    В итоговом ответе приведи секцию «Критерии готовности» каждого созданного
    тикета целиком — так, как она записана в файле тикета.
  inputs:
    - kind: inline
      as: plan_content
      content: |
        ### 1. Покрыть список сайтов модульными тестами

        **Приоритет:** Высокий
        **Зависимости:** Нет
        **Описание:** Тесты `node:test` для чистых функций модуля `src/site-list.js`: все домены набора по умолчанию.
        **Файлы:** `test/site-list.test.mjs`
        **Критерий приёмки:** тесты проходят и падают, если из набора по умолчанию убрать любой домен
        **Проверка:**
        - check: `node --test test/site-list.test.mjs`, expect: `exit 0`
        - check: `git grep -q --untracked "rutube.ru" -- test`, expect: `exit 0`

        ### 2. Флаг версии в CLI

        **Приоритет:** Средний
        **Зависимости:** Нет
        **Описание:** Добавить в `bin/cli.js` флаг `--version` и строку о нём в справку.
        **Файлы:** `bin/cli.js`
        **Критерий приёмки:** CLI печатает номер версии пакета
        **Проверка:** check: `node bin/cli.js --version`, expect: `stdout matches /\d+\.\d+\.\d+/`
        **Критерий приёмки:** справка CLI объясняет флаг версии без чтения кода
        **Проверка:** prose: `понятность справки командой не проверить`

assertions:
  static:
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S18\["[^\n]*[Кк]аждая строка «\*\*Критерий приёмки:\*\*» задачи — свой критерий со своей строкой «\*\*Проверка:\*\*»'
      reason: "Строки критерия одной задачи плана — отдельные критерии со своими записями (узел P10S18)."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S18\["[^\n]*[Пп]од критерием задачи несколько записей — пункт DoD на каждую, и текст каждого — весь критерий дословно'
      reason: "Несколько записей под критерием — пункт на каждую с полным текстом, не частью и не придуманным текстом (узел P10S18)."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S18\["[^\n]*запись доказывает, если красная, пока эта часть не выполнена[^\n]{0,20}поиск одного элемента набора'
      reason: "Запись check доказывает часть критерия, только если красная, пока часть не выполнена; поиск одного элемента набора — нет (узел P10S18)."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S18\["[^\n]*prose: `записи плана доказывают не весь критерий`'
      reason: "Часть критерия без доказывающей записи check уходит модели ревью пунктом prose с отдельной причиной (узел P10S18)."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S18\["[^\n]*пункт check закрывает скрипт по коду выхода, не читая текста пункта'
      reason: "Причина правила названа: текст пункта check никто не оценивает (узел P10S18)."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S18\["[^\n]*перечисли такие критерии в выводе стадии'
      reason: "Недоказанные командами критерии видны в выводе стадии для правки плана (узел P10S18)."
    - kind: skill_contains
      file: "knowledge/atomicity-checklist.md"
      pattern: 'пункты по строкам \*\*Критерий приёмки:\*\* одной задачи плана — один результат'
      reason: "Проверка атомарности 3 не делит тикет по пунктам одного критерия и по строкам критерия одной задачи."

  # Как в TC-DECOMPOSE-PLAN-012: файлы тикетов судье не доставляются, поэтому кейс
  # просит привести секции DoD в итоговом ответе. Запись ищется строкой сразу под
  # пунктом, в разметке parseDodChecks (src/lib/check-runner.mjs).
  deterministic:
    - kind: output_matches
      regex: '[Тт]есты проходят и падают, если из набора по умолчанию убрать любой домен[^\n]*\r?\n[ \t]+[-*][ \t]+check:[ \t]*\x60node --test test/site-list\.test\.mjs\x60'
      reason: "Первая запись под пунктом с полным текстом критерия."
    - kind: output_matches
      regex: '[Тт]есты проходят и падают, если из набора по умолчанию убрать любой домен[^\n]*\r?\n[ \t]+[-*][ \t]+check:[ \t]*\x60git grep -q --untracked "rutube\.ru" -- test\x60'
      reason: "Вторая запись под пунктом с тем же полным текстом, а не с частью или придуманным текстом."
    - kind: output_matches
      regex: '[Тт]есты проходят и падают, если из набора по умолчанию убрать любой домен[^\n]*\r?\n[ \t]+[-*][ \t]+prose:[ \t]*\x60[^\x60\s][^\x60\n]*\x60'
      reason: "«Падают, если убрать любой домен» не доказывает ни одна запись check — пункт с полным текстом и prose уходит модели ревью."
    - kind: output_matches
      regex: 'CLI печатает номер версии пакета[^\n]*\r?\n[ \t]+[-*][ \t]+check:[ \t]*\x60node bin/cli\.js --version\x60'
      reason: "Первая строка критерия задачи 2 — свой пункт со своей записью check."
    - kind: output_matches
      regex: '[Сс]правка CLI объясняет флаг версии без чтения кода[^\n]*\r?\n[ \t]+[-*][ \t]+prose:[ \t]*\x60понятность справки командой не проверить\x60'
      reason: "Вторая строка критерия задачи 2 — свой пункт со своей записью prose."
    - kind: output_matches
      regex: '^(?![\s\S]*\n[ \t]+[-*][ \t]+(check|prose|visual):[^\n]*\r?\n[ \t]+[-*][ \t]+(check|prose|visual):)'
      reason: "Под одним пунктом DoD нет двух записей подряд: пункт с несколькими записями (multiple_forms) гейт атомарности пайплайна отклоняет, форму проверяет самопроверка узла P10G7 до передачи стадии."

execution:
  timeout_s: 2400
