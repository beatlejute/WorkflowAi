id: TC-DECOMPOSE-PLAN-008
title: "Скил не хардкодит имена других скилов, project-wide типы/префиксы тикетов и проектные роли — только критерии и config.yaml → task_types"
origin:
  chg: ["ad-hoc-2026-09-21-audit"]
  incidents:
    - "Аудит 2026-09-21 (HIGH, изоляция): SKILL.md:62 маршрутизация называла чужой скил по имени («скилы → coach») и project-wide тип («код → impl»); workflows/decompose.md:145-151 таблица маршрутизации хардкодила литералы impl/fix/admin/docs вместо описания типа из config.yaml, а строка 257 называла чужую стадию execute-task по имени; algorithms/deduplication.md:11,87-97 иллюстрировала префиксы примерами IMPL/COACH — COACH является ticket_prefix скила coach. Принцип 9 (чеклист из 4 вопросов) требует критерий вместо закрытого списка/имени; принцип 8 запрещает знать другие скилы по имени."
  principle: "SKILL.md, workflows/, knowledge/, algorithms/ не называют другие скилы проекта по имени и не хардкодят project-wide типы/префиксы тикетов (impl/fix/admin/docs/human и т.п.) и проектные роли/ID — тип тикета определяется по `config.yaml → task_types` (по description), примеры используют generic-обозначения (XXX-NNN, {PREFIX})."
  backlog_sources: []
tags: [isolation, regression-guard]
severity: high

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    (L0-only тест: scenario не запускает агентов, проверяются только static
    assertions над рабочими файлами скила. Негативный anchor выражен через
    lookahead — runner поддерживает только skill_contains.)

assertions:
  static:
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "^(?![\\s\\S]*(\\b(analyze-report|coach|create-plan|create-report|decompose-gaps|deep-research|execute-task|manual-testing|review-result)\\b|\\b(GML|PMA|CSM|CRO|PMK)\\b|workflowAiVsCode|PulseProxy|documentaions|\\b(REPORT|PLAN|QA|HUMAN|IMPL|FIX|COACH|ADMIN|ARCH|RSH|ANL|RPT|CHG)-[0-9]{1,3}\\b))"
      reason: "SKILL.md не называет другие скилы проекта по имени, проектные роли и не использует чужие/project-wide ID тикетов как пример."
