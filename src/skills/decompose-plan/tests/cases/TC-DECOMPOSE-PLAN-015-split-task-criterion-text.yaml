id: TC-DECOMPOSE-PLAN-015
title: "Задача плана разбита на несколько тикетов — у каждого пункта полный дословный текст критерия, записи распределены без изменений, запись обо всём сразу — в тикете, зависящем от остальных"
origin:
  chg: ["ad-hoc-2026-10-01-analysis"]
  incidents:
    - "ListeningGlass PLAN-001 задача 1 (2026-09-29, decompose-plan claude-sonnet 08:26–08:50): один критерий «в spikes/injection/ есть расширение с обоими путями внедрения и инструкция установки» и три записи (check registerContentScripts, check document_start, prose «различимость меток двух путей и полнота инструкции оцениваются по диффу»). Задача разбита на IMPL-001, IMPL-002 и DOCS-001 по исполнителю (проверка 7 чеклиста атомарности), и ни один тикет не получил текста критерия: пункты пересказали «Описание» задачи, в IMPL-002 вошла ссылка «отличим от статического (IMPL-001)», общая prose-запись переписана в три разные. Вывод стадии: «DoD скопирован дословно». У IMPL-002 три провала ревью по пункту 2 и четыре платных запуска исполнителя (связь с разбиением частичная). Узел P10G2 разрешал «эквивалентную семантику» и «Обогащение» (фраза попала в гейт при переводе на рельсы b6a8c91, в прозе она относилась к деталям тикета), P10S11 — переформулировку строже плана, а P10S18 требовал весь критерий дословно; проверка 3 чеклиста («тикет по ним не делится») спорила с проверкой 7."
  principle: "Текст пункта DoD тикета из задачи плана — только строка критерия плана (или по узлу P10S12): переформулировка, «эквивалентная семантика» и обогащение текста пункта запрещены, детали идут в описание. Задача плана, разбитая на несколько тикетов, отдаёт каждую запись критерия ровно одному тикету без изменений, запись о работе нескольких тикетов — тикету, зависящему от остальных; у каждого пункта любого из тикетов — полный дословный текст критерия (workflows/decompose.md узлы P10G2, P10S11, P10S18; knowledge/atomicity-checklist.md проверки 3, 6 и 7; tests/rubrics/verbatim-dod-transfer.md)."
  backlog_sources:
    - "D:/Dev/ListeningGlass/.workflow/plans/current/PLAN-001.md"
    - "D:/Dev/ListeningGlass/.workflow/tickets/done/IMPL-002.md"
tags: [dod-transfer, verbatim, split-task, regression-guard]
severity: high

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    Декомпозируй задачу плана на тикеты. Типы тикетов в проекте (из
    `config.yaml → task_types`): IMPL (реализация), QA (автотесты), DOCS
    (документация), ADMIN (инфраструктурные операции).

    id_ranges_json: {"IMPL":21,"QA":7,"DOCS":4,"ADMIN":2}

    Файла плана на диске нет — задача приведена ниже в разделе plan_content
    целиком, работай по ней. Каталога `.workflow/shared/` в проекте нет.

    В итоговом ответе приведи поле dependencies и секцию «Критерии
    готовности» каждого созданного тикета целиком — так, как они записаны
    в файле тикета.
  inputs:
    - kind: inline
      as: plan_content
      content: |
        ### 1. Прототип двух путей внедрения скрипта страницы

        **Приоритет:** Высокий
        **Зависимости:** Нет
        **Описание:** В каталоге `spikes/injection/` собрать расширение с двумя путями внедрения скрипта страницы: статическим (content_scripts в manifest.json, world MAIN, run_at document_start) и динамическим (chrome.scripting.registerContentScripts при установке и при запуске service worker). Каждый путь ставит на страницу свою метку. В `spikes/injection/README.md` описать установку распакованного расширения и проверку обоих путей.
        **Файлы:** `spikes/injection/manifest.json`, `spikes/injection/background.js`, `spikes/injection/README.md`
        **Критерий приёмки:** в `spikes/injection/` есть расширение с обоими путями внедрения и инструкция установки
        **Проверка:**
        - check: `git grep -q --untracked "registerContentScripts" -- spikes/injection`, expect: `exit 0`
        - check: `git grep -q --untracked "document_start" -- spikes/injection/manifest.json`, expect: `exit 0`
        - prose: `различимость меток двух путей и полнота инструкции оцениваются по диффу`

assertions:
  static:
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10G2\{"[^"]*переносятся дословно\. Текст пункта DoD тикета из задачи плана — только по узлам P10S18 и P10S12: пересказ, эквивалентная переформулировка, обогащение и ослабление текста пункта запрещены'
      reason: "Гейт дословного переноса не разрешает менять текст пункта ни в какую сторону (узел P10G2)."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10G2\{"[^"]*Детали, контекст и примеры тикет добавляет в описание и «Детали задачи», а не в текст пункта'
      reason: "Обогащение уходит в описание тикета, а не в текст пункта DoD."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: '^(?![\s\S]*(либо с эквивалентной семантикой|Обогащение разрешено))'
      reason: "Разрешение «эквивалентной семантики» и «обогащения» текста критерия не вернулось."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S11\["[^"]*Строка пункта не совпадает со строкой критерия — СТОП, верни строку плана дословно[^"]*переформулировка запрещена, даже если она строже плана'
      reason: "Процедура сверки сравнивает строки, а не допускает «строгую» переформулировку (узел P10S11)."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: '^(?![\s\S]*Переформулировка допустима только если)'
      reason: "Разрешение переформулировки строже плана не вернулось."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S11\["[^"]*Пункт с наблюдаемым результатом по узлу P10S12 и пункты тикета не из задачи плана \(сводный, парный и prep-тикет по узлу P10S4\) строкой плана не сверяются'
      reason: "Строгая сверка строкой не запрещает DoD тикетам, у которых в плане нет своей строки критерия."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S18\["[^"]*Задача плана разбита на несколько тикетов \(узел P10S2\) — записи её критериев делятся между ними без изменений, а сама запись не делится: каждая уходит ровно в один тикет'
      reason: "У разбитой задачи каждая запись критерия уходит ровно в один тикет и не переписывается."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S18\["[^"]*запись о работе нескольких тикетов \(prose или visual обо всём сразу\) — в тикет, который зависит от остальных частей: добавь их в его dependencies'
      reason: "Запись обо всём сразу уходит в тикет, который увидит работу остальных частей."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S18\["[^"]*Текст пункта у каждого из этих тикетов — весь критерий дословно: пересказ описания задачи, часть критерия, ссылка на соседний тикет и текст, которого в плане нет, текстом пункта не бывают'
      reason: "Пересказ описания и ссылка на соседний тикет текстом пункта не становятся."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: 'P10S18\["[^"]*Тикет разбитой задачи, которому не досталось ни одной записи, получает пункт с полным текстом критерия и prose: `записи плана доказывают не весь критерий`'
      reason: "Тикет разбитой задачи без своей записи не остаётся без критерия и не получает придуманный текст."
    - kind: skill_contains
      file: "knowledge/atomicity-checklist.md"
      pattern: 'Деление задачи по проверкам 1, 2 или 7[^\n]*распределяются между частями по узлу P10S18[^\n]*остаётся полный текст критерия'
      reason: "Проверка 3 не спорит с проверкой 7: деление по исполнителю допустимо, записи распределяются по ветке P10S18."
    - kind: skill_contains
      file: "knowledge/atomicity-checklist.md"
      pattern: 'Части задачи плана, разбитой по проверкам 1, 2 или 7, с общим дословным текстом критерия эту проверку не нарушают'
      reason: "Проверка 6 не отправляет части разбитой задачи на новый круг разбиения из-за общего текста критерия."
    - kind: skill_contains
      file: "knowledge/atomicity-checklist.md"
      pattern: '\*\*Разбитая задача плана:\*\*[^\n]*вопрос критерия проверки задаётся о его записи проверки, а не о тексте критерия'
      reason: "Проверка 7 судит пункт части по его записи, а не по общему тексту критерия."
    - kind: skill_contains
      file: "tests/rubrics/verbatim-dod-transfer.md"
      pattern: '\| \*\*4\*\* \| Формулировка перенесена дословно, отличие только в регистре первой буквы или в разметке'
      reason: "Рубрика судьи не даёт проходной балл переформулировке, которую запрещает P10G2."

  # Как в TC-DECOMPOSE-PLAN-013: файлы тикетов судье не доставляются, поэтому кейс
  # просит привести секции DoD в итоговом ответе. Запись ищется строкой сразу под
  # пунктом, в разметке parseDodChecks (src/lib/check-runner.mjs).
  deterministic:
    - kind: output_matches
      regex: '[Вв] \x60?spikes/injection/\x60? есть расширение с обоими путями внедрения и инструкция установки[^\n]*\r?\n[ \t]+[-*][ \t]+check:[ \t]*\x60git grep -q --untracked "registerContentScripts" -- spikes/injection\x60'
      reason: "Первая запись check — под пунктом с полным текстом критерия."
    - kind: output_matches
      regex: '[Вв] \x60?spikes/injection/\x60? есть расширение с обоими путями внедрения и инструкция установки[^\n]*\r?\n[ \t]+[-*][ \t]+check:[ \t]*\x60git grep -q --untracked "document_start" -- spikes/injection/manifest\.json\x60'
      reason: "Вторая запись check — под пунктом с тем же полным текстом, а не с пересказом описания."
    - kind: output_matches
      regex: '[Вв] \x60?spikes/injection/\x60? есть расширение с обоими путями внедрения и инструкция установки[^\n]*\r?\n[ \t]+[-*][ \t]+prose:[ \t]*\x60различимость меток двух путей и полнота инструкции оцениваются по диффу\x60'
      reason: "Запись prose обо всём сразу перенесена без изменений под полным текстом критерия."
    - kind: output_matches
      regex: '^(?![\s\S]*\n[ \t]+[-*][ \t]+prose:[ \t]*\x60(?!различимость меток двух путей и полнота инструкции оцениваются по диффу\x60|записи плана доказывают не весь критерий\x60)[^\x60\n]*\x60)'
      reason: "Запись prose плана не переписана в другие prose-записи по тикетам."
    - kind: output_matches
      regex: '^(?![\s\S]*-[ \t]*\[[ xX]?\][^\n]*\b(IMPL|DOCS|QA|ADMIN)-\d{2,3}\b[^\n]*\r?\n[ \t]+[-*][ \t]+(check|prose|visual):)'
      reason: "Текст пункта DoD (строка с вложенной записью под ней) не ссылается на соседний тикет; список созданных тикетов чекбоксами под запрет не попадает."

execution:
  timeout_s: 2400
