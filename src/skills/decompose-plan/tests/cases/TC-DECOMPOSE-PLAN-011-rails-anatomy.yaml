id: TC-DECOMPOSE-PLAN-011
title: "decompose-plan на рельсах: граф ядра и фрагмента, стоп-гейты узлами, гарды нумерации и выходной слой"
origin:
  chg: ["convert-2026-09-23"]
  incidents:
    - "Решение стейкхолдера 2026-09-21: единый подход «Рельсы для агента» — все скилы переводятся на граф плюс хуки-отказы через коуча (CONVERT). decompose-plan — шестой скил после коуча, analyze-report, execute-task, review-result и create-plan."
    - "Инцидент workflowAi CHG-029: коллизия ID из-за ручного номера. Нумерация приходит в id_ranges со входа стадии — теперь это узел-гейт, а вызов скрипта выдачи ID закрыт гардом deny_shell."
    - "Инцидент PulseProxy PLAN-014 (2026-04-20): required_capabilities с ключами, которых нет в реестре pipeline-конфига — каскад no_capable_agent, 12 безрезультатных попыток исполнения, 2 тикета в blocked, план застопорен (кейс TC-DECOMPOSE-PLAN-005). Теперь выписка реестра — стоп-гейт до любой записи тикета."
    - "Аудит 2026-09-21 (HIGH): шаблон блока результата не содержал секцию ids_allocated_from, хотя стоп-гейт объявляет её обязательной частью контракта стадии. Теперь секцию требует выходной слой."
    - "Инцидент PulseProxy CHG-040: стоп-гейт дословного переноса формулировок критериев из плана (кейс TC-DECOMPOSE-PLAN-003). Теперь это гейт графа перед любой записью тикета."
  principle: "Концепция рельс: принцип 1 (граф — единственный источник процедуры), 6 и 9 (отказ инструмента и выходной слой), 10 (потолки циклов), 11 (дата и цена у гарда), 15 (гард доказан тестом, канарейка)."
  backlog_sources: []
tags: [rails, anatomy, regression-guard]
severity: critical

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    (L0-only тест: scenario не запускает агентов, проверяется только static
    assertion над содержимым рабочих файлов скила.)

assertions:
  static:
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "rails: rails\\.yaml"
      reason: "Frontmatter объявляет конфиг гардов — признак скила на рельсах."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "```mermaid[\\s\\S]*graph TD[\\s\\S]*P0E1\\[\"П0 ВХОД: Специалист по декомпозиции планов"
      reason: "Процедура записана mermaid-графом с входным узлом этапа 0."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P0S1\\[\"П0 ШАГ: Канарейка живости[^\\n]*echo RAILS_CANARY"
      reason: "Проверка живости рельс — узел графа (принцип 15)."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P6E1 --> P6R1 --> P6S1 --> P6S2"
      reason: "Отчёт и остановка — последний этап, терминал P6S2."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P0R9\\[\"П0 ПРАВИЛО: [^\\n]{0,4}Статус плана декомпозитор не трогает"
      reason: "Запрет на перевод плана в active живёт узлом: статус переключает стадия проверки атомарности."

    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: "P10G1\\{\"П10 ГЕЙТ: Все 7 проверок атомарности PASS с цитатами\\?"
      reason: "Чеклист атомарности — гейт графа с потолком циклов, а не пожелание в прозе."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: "P10G2\\{\"П10 ГЕЙТ \\(СТОП, до любых Write и Edit\\): дословный перенос формулировок"
      reason: "Стоп-гейт дословного переноса критериев стоит до любой записи (инцидент CHG-040)."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: "P10G3\\{\"П10 ГЕЙТ \\(СТОП, до любых Write и Edit\\): нумерация из id_ranges"
      reason: "Нумерация из входного диапазона — стоп-гейт, а не рекомендация."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: "P10G4\\{\"П10 ГЕЙТ \\(СТОП, до любых Write и Edit тикетов\\): выписка реестра required_capabilities"
      reason: "Реестр capabilities выписывается до записи тикетов (инцидент PLAN-014)."
    - kind: skill_contains
      file: "workflows/decompose.md"
      pattern: "P10S17 --> P6E1"
      reason: "Выход фрагмента ведёт в отчёт ядра."

    - kind: skill_contains
      file: "rails.yaml"
      pattern: "write_scope:[\\s\\S]*\\.workflow/tickets/backlog/\\*\\*"
      reason: "Декомпозитор пишет тикеты только в backlog."
    - kind: skill_contains
      file: "rails.yaml"
      pattern: "deny_shell:[\\s\\S]*get-next-id"
      reason: "Скрипт выдачи ID закрыт гардом: нумерация приходит со входа стадии (инцидент CHG-029)."
    - kind: skill_contains
      file: "rails.yaml"
      pattern: "stage_actions:[\\s\\S]*write_ticket:[\\s\\S]*stages: \\[10\\]"
      reason: "Запись тикета разрешена только на этапе работы, после стоп-гейтов."
    - kind: skill_contains
      file: "rails.yaml"
      pattern: "final_requires:[\\s\\S]*ids_allocated_from:"
      reason: "Выходной слой требует секцию фактически использованных диапазонов (аудит 2026-09-21)."
    - kind: skill_contains
      file: "rails.yaml"
      pattern: "final_forbids:[\\s\\S]*active"
      reason: "Перевод плана в active из отчёта декомпозиции запрещён."

    - kind: skill_contains
      file: "rails-migration.yaml"
      pattern: "baseline:"
      reason: "Карта переноса фиксирует базовую версию, от которой считается покрытие фраз-инвариантов."
    - kind: skill_contains
      file: "rails-migration.yaml"
      pattern: "entries:[\\s\\S]*target: \"P10G3\""
      reason: "Служебные фразы прозы переехали в лейблы узлов, решение по каждой записано в карте."

execution:
  timeout_s: 60
