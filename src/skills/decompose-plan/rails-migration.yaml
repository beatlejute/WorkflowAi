# Карта переноса скила decompose-plan на рельсы (CONVERT 2026-09-23).
# Каждая фраза-инвариант прозаической версии получила узел графа, справочник или
# обоснованный отказ. Проверка: node .workflow/src/scripts/check-rails-coverage.js
# --skill decompose-plan --baseline <ref> --map rails-migration.yaml
version: 1
skill: decompose-plan
baseline: HEAD
entries:
  # --- роль, маршрутизация и границы -> П0 ---
  - phrase: "| **DECOMPOSE** | «декомпозировать план», «разбить план на тикеты» | → `workflows/decompose.md` |"
    target: "P0Q1"
  - phrase: "- **Создание планов** → соответствующий скил планирования"
    target: "P0R1"
  - phrase: "- **Выполнение тикетов** → соответствующий скил проекта"
    target: "P0R1"
  - phrase: "- **Анализ результатов** → скил анализа отчётов"
    target: "P0R1"
  - phrase: "- **Управление доской** → пайплайн и его скрипты"
    target: "P0R1"
  - phrase: "Цель: ≤ 2 часа."
    target: "P0R5"
  - phrase: "Если хотя бы одна проверка не пройдена — разбей тикет."
    target: "P0R5"
  - phrase: "Инструменты — в SKILL.md исполнителя."
    target: "P0R8"
  - phrase: "Пайплайн выполнит их автоматически."
    target: "P0R7"
  - phrase: "> **⛔ Не трогай `status` плана.** Декомпозитор **никогда** не устанавливает `status: active` в frontmatter плана."
    target: "P0R9"

  # --- атомарность и чеклист -> П10S2, П10S3, П10G1 ---
  - phrase: "Количество тикетов ≥ количества задач плана."
    target: "P10S2"
  - phrase: "чеклист → «Антипаттерн „сжатие вместо разбиения“»)."
    target: "P10G1"
  - phrase: "Таблица без FAIL → тикет можно создавать."
    target: "P10G1"
  - phrase: "Антипаттерн: написать PASS, потому что «в целом задача одна»"
    target: "P10S3"
  - phrase: "Факты первичны — интуиция вторична."
    target: "P10S3"

  # --- парные тикеты ручной проверки -> П10S4, П10S5 ---
  - phrase: "**Условие А — по содержимому плана:**"
    target: "P10S4"
  - phrase: "Сопоставь файлы, затрагиваемые задачей, с этим реестром"
    target: "P10S4"
  - phrase: "Скил не знает заранее, как устроен продукт"
    target: "P10S5"
  - phrase: "Сообщи стейкхолдеру об отсутствующем реестре"
    target: "P10S5"
  - phrase: "Не изобретай критерии в workflow декомпозиции."
    target: "P10S5"
  - phrase: "**Парный тикет (для всех трёх условий) содержит:**"
    target: "P10S5"
  - phrase: "Если такого типа в конфиге нет — это пробел конфига, эскалируй стейкхолдеру."
    target: "P10S7"
  - phrase: "**Не изобретай префикс** (см."
    target: "P10S7"
  - phrase: "шаг 4 этого же workflow)."
    target: "P10S7"
  - phrase: "- Верификация — это просто запуск автотестов или проверка сборки"
    target: "P10S4"
  - phrase: "**Критерий:** если тестировщик не может начать проверку сразу после выполнения основных тикетов"
    target: "P10S4"
  - phrase: "Если проверяемое поведение наблюдаемо при обычном использовании продукта"
    target: "P10S4"

  # --- автономность и тип тикета -> П10S6, П10S7 ---
  - phrase: "Маршрутизация — **двухступенчатая проверка**, оба условия обязательны для HUMAN:"
    target: "P10S6"
  - phrase: "Прочитай `.workflow/config/config.yaml → task_types`: значения `prefix` — **закрытый список**."
    target: "P10S7"

  # --- дедупликация -> П10S10 ---
  - phrase: "**Автоматическая проверка скриптом:**"
    target: "P10S10"

  # --- дословный перенос критериев -> П10G2, П10S11 ---
  - phrase: "**Обогащение разрешено.** Тикет может **добавлять** детали"
    target: "P10G2"
  - phrase: "Если существует сценарий, проходящий по тикету, но не проходящий по плану"
    target: "P10S11"
  - phrase: "Не продолжай до устранения расхождения."
    target: "P10S11"

  # --- нумерация из id_ranges -> П10G3, П10S13 ---
  - phrase: "До создания **любого** файла тикета:"
    target: "P10G3"
  - phrase: "Прочитай параметр `id_ranges_json` со входа стадии (см."
    target: "P10G3"
  - phrase: "секцию «Вход»)."
    target: "P0R3"
  - phrase: "Это **JSON-строка** вида `{\"PREFIX\":N_start,...}`"
    target: "P10G3"
  - phrase: "**Распарси её** (формат тривиальный — плоский объект со скалярными значениями)"
    target: "P10G3"
  - phrase: "Для **каждого** префикса из множества убедись, что он присутствует в распарсенной карте."
    target: "P10G3"

  # --- реестр capabilities -> П10G4, П10G5 ---
  - phrase: "Агенты и их capabilities — в секции `agents.*.capabilities`."
    target: "P10G4"
  - phrase: "Например (иллюстрация формата, не значения):"
    target: "P10G4"
  - phrase: "Эта выписка — **единственный допустимый словарь** для поля `required_capabilities`"
    target: "P10G4"
  - phrase: "При заполнении поля на шаге 9.1 каждый ключ должен присутствовать в `capabilities_registry`."
    target: "P10G5"
  - phrase: "Ключ, которого в выписке нет, — изобретённый, его нельзя записывать в тикет."
    target: "P10G5"

  # --- повторный проход -> П10S16 ---
  - phrase: "Признак: на входе стадии есть актуальный `atomicity_failures` (см."
    target: "P10S16"
  - phrase: "Правь **только** тикеты из `atomicity_failures` — через `Edit` существующего файла в `backlog/`."
    target: "P10S16"
  - phrase: "Остальные тикеты плана не трогай (исключение — п.4)."
    target: "P10S16"
  - phrase: "Разбиение на 2+ — порядок обязателен."
    target: "P10S16"
  - phrase: "Не редактируй исходный тикет, пока не созданы все остальные части"
    target: "P10S16"
  - phrase: "При дедупликации (шаг 7) исходный тикет по его ID не считается дубликатом своих частей."
    target: "P10S16"

  # --- создание тикета и пре-валидация ID -> П10S14, П10G5, П10S15 ---
  - phrase: "Для **каждого** тикета (на повторном проходе — см."
    target: "P10S14"
  - phrase: "9.B — там же ⛔ запрет ручного алгоритма как fallback)."
    target: "P10G3"
  - phrase: "- **0 совпадений** → путь свободен, переходи к п.5."
    target: "P10G5"
  - phrase: "- **Есть совпадение** → **СТОП до записи**: ID из `id_ranges` уже занят"
    target: "P10G5"
  - phrase: "**Правила:**"
    target: "P10S15"
  - phrase: "- **Все задачи** плана должны получить тикеты (включая отложенные)"
    target: "P0R4"
