id: TC-ANALYZE-REPORT-010
title: "Дефект, записанный выполненным тикетом плана и не снятый более поздним исправлением, — пробел в gaps, а не известный баг и не находка вне скоупа; исключение плана и решение стейкхолдера уводят его в рекомендации"
origin:
  chg: ["ad-hoc-2026-10-01"]
  incidents:
    - "PulseProxy PLAN-020, 2026-09-30: QA-175 (archive/) записал «Найденный дефект (расхождение с ожиданием): подсказка вкладки (title) при гео-блоке НЕ равна английскому тексту geoBlockedTitle» при зелёной записи check. Три разбора (09:49, 13:53, 17:43 UTC, pipeline_2026-09-30_17-23-30.log: «Все критерии успеха подтверждены» после Read QA-175.md) дефект пропустили, пункт «Критериев успеха» задачи 25 сочтён подтверждённым, FIX-тикета нет, src/background/icon-manager.ts:48 не изменён."
    - "ListeningGlass PLAN-001, 2026-09-30: QA-002, QA-003, QA-005, QA-007, QA-009 (done/) и HUMAN-002/HUMAN-003 записали дефекты; разбор (pipeline_2026-09-29_18-53-24.log:32591) назвал дефект TikTok из HUMAN-002 «известным техническим дефектом, не новым gap» (правило P6R2) и отнёс в «За пределами скоупа»; в PLAN-002 этих дефектов нет, дефект popup.js:86 остался в коде."
    - "Ревью черновика 2026-10-01: закрытый перечень «нет»-фраз принимал «Дефектов не обнаружено.» (PulseProxy QA-004) и «**Дефектов не обнаружено.**» (QA-031) за записанный дефект; дефект, исправление которого план исключает (раздел «Исключено из scope») или стейкхолдер перенёс, не имел выхода, кроме gaps, — план не закрылся бы никогда; гейт P10G1 сверял только recorded_defects, пустой, пока подраздела нет в шаблоне."
  principle: "Зелёная запись проверки тикета тестирования подтверждает, что сценарий проведён, а не что продукт прошёл. Каждое расхождение, записанное выполненным тикетом плана (подраздел «### Найденные дефекты», у прежних тикетов — секция результата и заметки), — пробел в gaps, пока более поздний тикет не записал его исправление; правила «известные баги — не gaps» (P6R2), «вне скоупа» (P0R5) и «тикет уже на диске» (P10S10) его не снимают. В рекомендации его уводят только раздел плана «Исключено из scope» и записанное решение стейкхолдера, а не оценка исполнителя; запись только об отсутствии дефектов — не находка (узлы P10S13, P10S12, P10G1, P6R2, P6Q1, P0R5; scripts/calc-plan-metrics.js — recorded_defects, isAbsenceRecord)."
  backlog_sources:
    - "D:/Dev/PulseProxy/.workflow/tickets/archive/QA-175.md"
    - "D:/Dev/ListeningGlass/.workflow/logs/pipeline_2026-09-29_18-53-24.log"
tags: [gaps, defects, qa, completion, regression-guard]
severity: high

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    (L0-only тест: scenario не запускает агентов, проверяются только static
    assertions над содержимым рабочих файлов скила.)

assertions:
  static:
    - kind: skill_contains
      file: "workflows/progress.md"
      pattern: 'P10S13\["П10 ШАГ: Записанные дефекты выполненных тикетов\. Вход — recorded_defects скрипта'
      reason: "Чтение записанных дефектов — отдельный узел ветки PROGRESS со входом из скрипта."
    - kind: skill_contains
      file: "workflows/progress.md"
      pattern: 'P10S13\["[^"]*текст подраздела «### Найденные дефекты» его результата, кроме записи только об отсутствии дефектов'
      reason: "Источник — постоянный подраздел результата, а не пересказ исполнителя."
    - kind: skill_contains
      file: "workflows/progress.md"
      pattern: 'P10S13\["[^"]*Элемент, в котором другими словами записано только отсутствие дефектов, — не находка: назови его в отчёте записью об отсутствии дефектов с цитатой'
      reason: "Запись об отсутствии дефектов, которую скрипт не распознал, не становится пробелом (QA-004, QA-031)."
    - kind: skill_contains
      file: "workflows/progress.md"
      pattern: 'P10S13\["[^"]*\(defects_section_missing\), прочитай секцию результата целиком, включая заметки'
      reason: "У прежних тикетов без подраздела дефект лежит в секции результата или заметках (QA-175, HUMAN-002)."
    - kind: skill_contains
      file: "workflows/progress.md"
      pattern: 'P10S13\["[^"]*Зелёная запись проверки тикета тестирования подтверждает, что сценарий проведён и результат записан, а не что продукт прошёл'
      reason: "Зелёный check тикета тестирования не опровергает записанный дефект."
    - kind: skill_contains
      file: "workflows/progress.md"
      pattern: 'P10S13\["[^"]*Находка снята исправлением, только если более поздний тикет этого или другого плана \(дефект, переданный в следующий план, снимает его исправление\), результат которого записан после записи дефекта, записал исправление именно этого дефекта'
      reason: "Исправлением дефект снимает только записанное позже исправление, а не существование тикета."
    - kind: skill_contains
      file: "workflows/progress.md"
      pattern: 'P10S13\["[^"]*Находка идёт в рекомендации с цитатой, а не в `gaps`, если исправление этого дефекта исключает раздел плана «Исключено из scope» или более поздняя запись в плане или тикете фиксирует решение стейкхолдера по нему'
      reason: "Выход для дефекта, исключённого планом или перенесённого стейкхолдером, — иначе план не закрывается никогда."
    - kind: skill_contains
      file: "workflows/progress.md"
      pattern: 'P10S13\["[^"]*пробел в `gaps`: ID тикета, записавшего дефект, цитата дефекта и задача плана, без решения, что создавать \(узел P6R3\), даже если исполнитель назвал дефект известным, посторонним или задачей следующего плана: оценка исполнителя — не решение стейкхолдера'
      reason: "Неснятый дефект — пробел с цитатой; оценка исполнителя его не снимает и решением стейкхолдера не считается."
    - kind: skill_contains
      file: "workflows/progress.md"
      pattern: 'P10S5 --> P10S13 --> P10S6'
      reason: "Узел стоит в цепочке до выявления проблем — мимо него к рекомендациям не пройти."
    - kind: skill_contains
      file: "workflows/progress.md"
      pattern: 'P10S6\["[^"]*записанные дефекты \(находки узла P10S13\)'
      reason: "Находки узла входят в выявленные проблемы."
    - kind: skill_contains
      file: "workflows/progress.md"
      pattern: 'P10S10\["[^"]*Пробел о записанном дефекте \(узел P10S13\) этим шагом не снимается'
      reason: "Сверка gaps с диском не снимает дефект только потому, что тикет существует."
    - kind: skill_contains
      file: "workflows/progress.md"
      pattern: 'P10S12\["[^"]*опровергает \(прогон проверок с падениями, отметка FAIL, записанный тикетом дефект или расхождение с ожидаемым — даже при зелёной записи проверки этого тикета'
      reason: "Запись дефекта выполненным тикетом тестирования опровергает пункт «Критериев успеха» (QA-175, задача 25)."
    - kind: skill_contains
      file: "workflows/progress.md"
      pattern: 'P10G1\{"[^"]*каждая находка узла P10S13 — каждый элемент recorded_defects и каждое расхождение, записанное в результате выполненного тикета из defects_section_missing, который проверяет сценарий или выполнен человеком, — названа в отчёте одним из исходов узла \(пробел в `gaps`, более поздний тикет, записавший исправление, исключение плана или решение стейкхолдера с цитатой, запись только об отсутствии дефектов\)'
      reason: "Гейт ветки сверяет отчёт и с recorded_defects, и с результатами тикетов без подраздела — путь инцидента не держится на одном шаге."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P6R2\["[^"]*Исключение — дефект продукта, записанный выполненным тикетом текущего плана[^"]*не снятый более поздним исправлением \(узел P10S13\): это gap, а не известный баг без tracking-тикета'
      reason: "P6R2 не уводит записанный дефект текущего плана в рекомендации (ListeningGlass, :32591)."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P6R2\["[^"]*Это исключение не снимает раздел плана «Исключено из scope» и записанное решение стейкхолдера по дефекту'
      reason: "Исключение называет правила, которые остаются в силе (коуч P3S3)."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P6R2\["[^"]*Исключение — пункт «Критерии успеха» плана[^"]*Остальное правило в силе'
      reason: "Исключение снимает только часть о известных багах, остальное правило P6R2 в силе."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P6Q1\{"[^"]*has_gaps \([^)]*выполненный тикет плана записал дефект, оставшийся пробелом по узлу P10S13'
      reason: "Выбор итогового статуса называет неснятый записанный дефект признаком has_gaps."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P0R5\["[^"]*Дефект, записанный тикетом текущего плана, — в скоупе'
      reason: "Правило скоупа не выносит записанный дефект плана в «За пределами скоупа»."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P0R5\["[^"]*В силе остаются раздел плана «Исключено из scope» и записанное решение стейкхолдера по дефекту'
      reason: "Исключение из правила скоупа не снимает исключений плана."
    - kind: skill_contains
      file: "knowledge/report-structure.md"
      pattern: '\| \*\*Найденные дефекты\*\* \| Подраздел `### Найденные дефекты` секции результата \(поле recorded_defects скрипта\)[^\n]*пробел в `gaps` \(узел P10S13\)'
      reason: "Справочник называет источник записанных дефектов и их назначение."
    - kind: skill_contains
      file: "scripts/calc-plan-metrics.js"
      pattern: 'sectionText\(result \?\? body, 3, ''Найденные дефекты'
      reason: "Скрипт читает подраздел «### Найденные дефекты» по заголовку внутри секции результата."
    - kind: skill_contains
      file: "scripts/calc-plan-metrics.js"
      pattern: 'return \{ hasSection: true, text: isAbsenceRecord\(text\) \? null : text \}'
      reason: "Запись об отсутствии дефектов отсеивается критерием isAbsenceRecord."
    - kind: skill_contains
      file: "scripts/calc-plan-metrics.js"
      pattern: '^(?![\s\S]*const NO_DEFECTS)'
      reason: "Закрытый перечень «нет»-фраз не возвращается (коуч P3R3)."
    - kind: skill_contains
      file: "scripts/calc-plan-metrics.js"
      pattern: 'const COMPLETED_DIRS = \[''done'', ''archive'', ''review''\]'
      reason: "Дефекты читаются у всех выполненных тикетов, включая archive/ закрытого плана."
    - kind: skill_contains
      file: "scripts/calc-plan-metrics.js"
      pattern: 'recorded_defects: defects\.recorded_defects,\s*defects_section_missing: defects\.defects_section_missing'
      reason: "Вывод скрипта содержит оба поля — вход узла P10S13."

execution:
  timeout_s: 60
