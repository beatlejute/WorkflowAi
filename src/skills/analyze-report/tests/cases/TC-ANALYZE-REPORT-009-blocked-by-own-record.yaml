id: TC-ANALYZE-REPORT-009
title: "Тикет, которого держит его собственная запись проверки, — пробел в gaps о невыполненном DoD, а не процессный риск"
origin:
  chg: ["ad-hoc-2026-09-30"]
  incidents:
    - "PulseProxy PLAN-020 → QA-180 (2026-09-29…30): записи проверки, которые правильная работа пройти не могла (`stdout matches /0 failed/` под построчным отчётом, `npm test --json`), разбор отчёта вынес в «За пределами скоупа» как процессный риск; в `gaps` причина блокировки не попала, и разбиение пробелов не завело замену с исправленной записью."
    - "Ревью правила 2026-09-30 (два раунда): признак по словам исполнителя выдавал провалы `npm test`, названные посторонними, за сломанную запись; выдержка в секции результата скрывала провал; правило о провалах противоречило запрету на известные баги в `gaps` без старшинства."
  principle: "Тикет тестирования держит его собственная запись проверки — признаки по blocked_reason и evidence ревью, а не по словам исполнителя: отказ гейта в записи пункта, пункт со статусом timeout, denied или dod_record_invalid, ожидание по тексту вывода, которое не совпало. Это пробел в gaps о невыполненном DoD. Не совпало ожидание по коду выхода — дефект продукта, провалы идут в gaps, даже если исполнитель назвал их посторонними; узел важнее P6R2 (SKILL.md узел P6R5; knowledge/report-structure.md)."
  backlog_sources:
    - "D:/Dev/PulseProxy/.workflow/logs/pipeline_2026-09-29_18-55-50.log"
tags: [gaps, blocked, check-record, regression-guard]
severity: high

scenario:
  system_prompt_file: "../fixtures/TC-ANALYZE-REPORT-009-decision-context.md"
  extra_instructions: |
    Проанализируй PLAN-S009 в режиме PROGRESS по полному inline-входу.
    Это синтетический регрессионный сценарий, не исторические документы.
    Не ищи реальные проекты, не запускай команды, проверки или агентов,
    не меняй файлы. Разбери каждый пункт DoD по evidence: блокировка
    собственной записью или продуктовый дефект. Привяжи вывод к тикету,
    пункту, ожиданию, blocked_reason и выводу evidence. Заверши финальный
    ответ блоком ---RESULT--- с status/gaps. В gaps — пробелы, не решения.
  inputs:
    - kind: inline
      as: synthetic_regression_fixture
      content: |
        PLAN-S009, T1: проверить тестовый прогон и отсутствие запрещённого
        предупреждения. Три QA-тикета в blocked/, у каждого DoD 1.
        QA-S009-A: check npm test, expect stdout matches /0 failed/.
        blocked_reason: dod_check_failed: stdout expectation mismatch.
        evidence QA-S009-A.md.json: status failed; exit_code 0;
        stdout: «✓ suite A passed; ✓ suite B passed; Tests: 20 passed».
        QA-S009-B: check npm test, expect exit 0.
        blocked_reason: dod_check_failed: expected exit 0, got 1.
        evidence QA-S009-B.md.json: status failed; exit_code 1;
        stdout: «Tests: 12 failed, 1464 passed».
        Исполнитель: «Падения посторонние, не связаны с задачей».
        QA-S009-C: check check-warning, expect stdout not contains UNSAFE_WARNING.
        blocked_reason: dod_check_failed: stdout expectation mismatch.
        evidence QA-S009-C.md.json: status failed; exit_code 0;
        stdout: «UNSAFE_WARNING». DoD запрещает UNSAFE_WARNING в продукте.
        Исправлений и решений стейкхолдера нет.

assertions:
  rubric:
    - kind: llm_judge
      rubric_file: "../rubrics/blocked-by-own-record.md"
      criterion: "Верно ли различены блокировка записью проверки и продуктовые провалы по evidence DoD?"
      pass_threshold: 5
      trials: 3
      aggregate: majority
  static:
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P6R5\["П6 ПРАВИЛО: Тикет тестирования плана в blocked/ может держать его собственная запись проверки, а не продукт'
      reason: "Правило — отдельным узлом и только для тикетов тестирования: остальные тикеты в blocked/ идут по P6R4."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P6R5\["[^"]*Признаки — по пунктам DoD, в blocked_reason тикета и в файле evidence его ревью `\.workflow/state/evidence/<имя файла тикета>\.json` \(вывод, который получила проверка, а не пересказ в секции результата\)'
      reason: "Ревью 2026-09-30: признак по словам исполнителя или по выдержке скрывает провалы продукта."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P6R5\["[^"]*отказ гейта в записи пункта \(check_denied, check_tool_missing, check_timeout, check_malformed, check_green_before_start\)'
      reason: "Признак — все коды отказа гейта перед работой."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P6R5\["[^"]*пункт со статусом timeout или denied или с причиной dod_record_invalid в evidence — запись красная при любой работе'
      reason: "Таймаут на ревью у вернувшегося тикета гейт не видит — только evidence."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P6R5\["[^"]*пункт с ожиданием по тексту вывода \(`stdout contains`, `stdout not contains`, `stdout matches`\), которое в evidence не совпало'
      reason: "Ожидание по тексту — признак записи."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P6R5\["(?![^"]*отказы ревью)'
      reason: "Отказы ревью при записанном «критерий выполнен» — слова исполнителя, признаком не служат."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P6R5\["[^"]*Это тоже пробел в `gaps` о невыполненном DoD, а не процессный риск и не находка за пределами скоупа: в тексте отчёта — пункт, его запись, его вывод из evidence и blocked_reason, в `gaps` — тикет, пункт, запись и blocked_reason'
      reason: "Блокировка записью — пробел в gaps; вывод — в тексте отчёта, в `gaps` — одна строка."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P6R5\["[^"]*Вывод пункта с признаком в evidence показывает, что критерий не выполнен \(найден запрещённый текст, другое значение, провал\), — это ещё и дефект продукта: в `gaps` и он'
      reason: "Ревью 2026-09-30: найденный запрещённый текст — дефект продукта, а не только сломанная запись."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P6R5\["[^"]*Не совпало ожидание по коду выхода — не запись, а дефект продукта\.[^"]*Провалы в выводе пунктов такого тикета — пробел в `gaps`, даже если исполнитель назвал их посторонними, прежними или не связанными с тикетом: здесь узел важнее P6R2'
      reason: "Провалы продукта не выдаются за сломанную запись и не уходят в рекомендации как известные баги."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: 'P6R3 --> P6R4 --> P6R5 --> P6Q1'
      reason: "Правило читается до выбора итогового статуса."
    - kind: skill_contains
      file: "knowledge/report-structure.md"
      pattern: '\| Пункт DoD с его записью и его выводом из evidence ревью \(`\.workflow/state/evidence/<имя файла тикета>\.json`\) \| Для пробела о записи проверки тикета тестирования \(узел P6R5\)'
      reason: "Справочник полей отчёта называет данные и их источник."

execution:
  timeout_s: 1200
