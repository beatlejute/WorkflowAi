id: TC-ANALYZE-REPORT-011
title: "First-Pass Rate, Rework Rate и возвраты считает скрипт по таблице «## Ревью» по одной формуле, агент их не пересчитывает, каждый вернувшийся тикет атрибутирован по логу"
origin:
  chg: ["ad-hoc-2026-10-01"]
  incidents:
    - "PulseProxy PLAN-020, 2026-09-29…30: calc-plan-metrics.js искал возвраты в ticket.raw.notes (поля нет ни в одном тикете) и выдавал rework_count 0; First-Pass агент считал сам — три разбора дали 63,64% (pipeline_2026-09-29_18-55-50.log), 100% и 100% (pipeline_2026-09-30_13-15-04.log:1928 — first_pass_pct:rev?100:0; pipeline_2026-09-30_17-23-30.log:961 — first_pass_rate:100) при фактических 24/36 = 66,7% (23 строки ❌ у 12 тикетов); итог ON_TRACK вместо ATTENTION."
    - "ListeningGlass PLAN-001, 2026-09-30: rework_count 0 при возвратах IMPL-002 ×3, IMPL-010 ×3, HUMAN-001, IMPL-006; находка [HIGH] без строки pipeline_*.log — был один общий Grep по логам, по ID тикетов лог не искали."
    - "Аудит analyze-report 2026-09-21, находка 8 (B-6) и находка 9 (review/ нет в TICKET_DIRS) — не выполнены до 1.23.1."
    - "Ревью черновика 2026-10-01: knowledge/analysis-frameworks.md, загружаемый всегда, держал свою формулу Rework Rate «reworked / done» с неопределённым reworked и знаменателем done — тот же класс, что три разных First-Pass; ретроспектива читала тикеты без review/."
  principle: "Метрика качества считается по одному определению из одного источника: попытка — строка passed или failed таблицы «## Ревью», первая попытка — первая такая строка, строка ❌ — возврат, знаменатель First-Pass Rate и Rework Rate — reviewed (algorithms/progress-assessment.md шаг 3, справочник на него ссылается). Скрипт выдаёт first_pass_rate, rework_count, rework_rate и reworked_tickets, агент их не пересчитывает; каждый тикет из reworked_tickets атрибутирован поиском по его ID в логе (узлы P10S3, P10S5, P10S6, P10S7, P10G1, P20S2, P20S4)."
  backlog_sources:
    - ".workflow/reports/audit-2026-09-21/analyze-report.md"
tags: [metrics, review, rework, consistency, regression-guard]
severity: high

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    (L0-only тест: scenario не запускает агентов, проверяются только static
    assertions над содержимым рабочих файлов скила.)

assertions:
  static:
    - kind: skill_contains
      file: "scripts/calc-plan-metrics.js"
      pattern: '^(?![\s\S]*raw\?\.notes)'
      reason: "Подсчёт возвратов по несуществующему полю notes удалён."
    - kind: skill_contains
      file: "scripts/calc-plan-metrics.js"
      pattern: 'sectionText\(body, 2, ''Ревью''\)'
      reason: "Источник метрик ревью — таблица «## Ревью» тикета."
    - kind: skill_contains
      file: "scripts/calc-plan-metrics.js"
      pattern: 'if \(attempts\[0\]\.status === ''passed''\) passedFirst \+= 1'
      reason: "Первая попытка — первая строка с вердиктом passed или failed."
    - kind: skill_contains
      file: "scripts/calc-plan-metrics.js"
      pattern: 'rework_count: reworked\.length'
      reason: "rework_count — число тикетов хотя бы с одной строкой failed."
    - kind: skill_contains
      file: "scripts/calc-plan-metrics.js"
      pattern: 'rework_rate: reviewed > 0 \? round2\(\(reworked\.length / reviewed\) \* 100\) : null'
      reason: "Rework Rate — со знаменателем reviewed, как в шаге 3 алгоритма."
    - kind: skill_contains
      file: "scripts/calc-plan-metrics.js"
      pattern: 'reworked_tickets: review\.reworked_tickets'
      reason: "Список вернувшихся тикетов — в выводе скрипта, вход атрибуции по логу."
    - kind: skill_contains
      file: "scripts/calc-plan-metrics.js"
      pattern: 'const TICKET_DIRS = \[[^\]]*''review'''
      reason: "Тикеты на ревью входят в тикеты плана (аудит 2026-09-21, находка 9)."
    - kind: skill_contains
      file: "scripts/calc-plan-metrics.js"
      pattern: 'time_anomalies: timeAnomalies'
      reason: "Тикеты с completed_at раньше created_at выдаются явно, а не отбрасываются молча."
    - kind: skill_contains
      file: "workflows/progress.md"
      pattern: 'P10S3\["[^"]*First-Pass Rate и Rework Rate бери из вывода скрипта и не пересчитывай своим кодом'
      reason: "Агент не пересчитывает метрики ревью самодельным кодом (константа 100 в двух разборах)."
    - kind: skill_contains
      file: "workflows/progress.md"
      pattern: 'P10S3\["(?![^"]*Weighted Completion и First-Pass Rate)'
      reason: "Прежнее «досчитай First-Pass вручную» не возвращается."
    - kind: skill_contains
      file: "workflows/progress.md"
      pattern: 'P10S3\["[^"]*reworked_tickets — эти тикеты с числом и Самари строк ❌'
      reason: "Узел называет список вернувшихся тикетов из вывода скрипта."
    - kind: skill_contains
      file: "workflows/progress.md"
      pattern: 'P10S6\["[^"]*каждый тикет из reworked_tickets скрипта, ни один не пропускается'
      reason: "Каждый вернувшийся тикет — отклонение в выявленных проблемах."
    - kind: skill_contains
      file: "workflows/progress.md"
      pattern: 'P10S7\["[^"]*включая каждый тикет из reworked_tickets: найди в логе строки с упоминанием проблемного тикета \(Grep по `ticket_id` этого тикета, а не общий поиск'
      reason: "Атрибуция возврата — поиск по ID тикета, а не общий Grep по логам."
    - kind: skill_contains
      file: "workflows/progress.md"
      pattern: 'P10G1\{"[^"]*число тикетов с возвратами в отчёте равно rework_count скрипта и у каждого тикета из reworked_tickets есть цитата лога или пометка LOW'
      reason: "Гейт ветки сверяет отчёт с выводом скрипта."
    - kind: skill_contains
      file: "algorithms/progress-assessment.md"
      pattern: 'Источник — таблица «## Ревью» тикета\. Строка с вердиктом ✅ passed или ❌ failed — одна попытка ревью[\s\S]{0,200}Первая попытка — первая такая строка, каждая строка ❌ — возврат'
      reason: "Алгоритм называет источник и определение первой попытки."
    - kind: skill_contains
      file: "algorithms/progress-assessment.md"
      pattern: 'rework_rate = rework_count / reviewed'
      reason: "Каноническая формула Rework Rate — единственный источник, знаменатель reviewed."
    - kind: skill_contains
      file: "knowledge/analysis-frameworks.md"
      pattern: '^(?![\s\S]*reworked / done)'
      reason: "Дублирующая формула Rework Rate со знаменателем done и неопределённым reworked удалена из справочника."
    - kind: skill_contains
      file: "knowledge/analysis-frameworks.md"
      pattern: 'Rework Rate\*\* \| формула — в `algorithms/progress-assessment\.md` шаг 3, значение — поле rework_rate скрипта'
      reason: "Справочник ссылается на каноническую формулу и значение скрипта, а не подставляет свой расчёт (по образцу B-5 TC-ANALYZE-REPORT-004)."
    - kind: skill_contains
      file: "workflows/retrospective.md"
      pattern: 'P20S2\["[^"]*тикеты на ревью \(если остались\) из `\.workflow/tickets/review/`'
      reason: "Ручной сбор ретроспективы читает то же множество тикетов, что скрипт."
    - kind: skill_contains
      file: "workflows/retrospective.md"
      pattern: 'P20S4\["[^"]*First-Pass Rate и Rework Rate бери из вывода скрипта и не пересчитывай своим кодом'
      reason: "Ретроспектива берёт те же метрики из скрипта."

execution:
  timeout_s: 60
