id: TC-ANALYZE-REPORT-008
title: "План не completed, пока пункт «Критерии успеха» опровергнут или не подтверждён — даже при всех тикетах в done/"
origin:
  chg: ["ad-hoc-2026-09-29"]
  incidents:
    - "PulseProxy PLAN-017, 2026-09-29 (REPORT-029, pipeline_2026-09-29_02-53-07.log:619-678): разбор вернул `status: completed` при 70 из 70 тикетов в done/, complete-plan закрыл и заархивировал план. Критерий успеха плана «`npm test` ... зелёные» опровергал итоговый отчёт тестирования (DOCS-10: «Tests: 12 failed, 1464 passed», «not blocking PLAN-017»), FIX-028 и IMPL-106 записали те же падения как «не связанные с задачей». Падения появились внутри плана: 2026-09-25 полный прогон IMPL-88 шёл без них, после переключения модалки на общий загрузчик (IMPL-89) — 12 падений. Критерий завершённости P10S12 проверял только тикеты и gaps, критерии успеха плана разбор не открывал."
  principle: "Секция «Критерии успеха» плана определяет, что план выполнен: разбор перед закрытием сверяет каждый пункт с самым поздним записанным результатом тикета или отчёта. Опровергнутый или неподтверждённый пункт — has_gaps, даже если все тикеты готовы, а исполнитель назвал падения посторонними или прежними; исключение из правила «известные баги без tracking-тикетов — не gaps» (узлы P10S12, P10G1, P6R2, P6Q1)."
  backlog_sources: []
tags: [gaps, completion, success-criteria, regression-guard]
severity: high

scenario:
  system_prompt_file: "../../SKILL.md"
  extra_instructions: |
    (L0-only тест: scenario не запускает агентов, проверяется только static
    assertion над содержимым рабочих файлов скила.)

assertions:
  static:
    - kind: skill_contains
      file: "workflows/progress.md"
      pattern: "P10S12\\[\"(?![^\"]*оба условия)П10 ШАГ: Критерий завершённости плана\\. План считается `completed` только когда выполнены все три условия[^\"]*3\\) каждый пункт секции «Критерии успеха» плана[^\"]*подтверждён записанным результатом тикета или отчёта"
      reason: "Критерий завершённости включает пункты «Критерии успеха» плана, а не только тикеты и gaps."
    - kind: skill_contains
      file: "workflows/progress.md"
      pattern: "P10S12\\[\"[^\"]*по пункту решает самый поздний такой результат"
      reason: "Ранний зелёный прогон не подтверждает пункт, если позже записаны падения."
    - kind: skill_contains
      file: "workflows/progress.md"
      pattern: "P10S12\\[\"[^\"]*Пункт, который этот результат опровергает[^\"]*или который не подтверждает ни один тикет и отчёт, — пробел, даже если все тикеты в `done/`, а исполнитель назвал падения посторонними или прежними"
      reason: "Опровергнутый и неподтверждённый пункт — пробел; все тикеты в done/ и оценка исполнителя «посторонние падения» его не снимают."
    - kind: skill_contains
      file: "workflows/progress.md"
      pattern: "STOP-GATE:[^\"]*перепроверь все три условия критерия завершённости[^\"]*каждый пункт «Критерии успеха» плана подтверждён"
      reason: "Стоп-гейт перед completed перепроверяет и критерии успеха плана."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P6R2\\[\"[^\"]*Исключение — пункт «Критерии успеха» плана, который записанные данные опровергают или не подтверждают \\(узел P10S12\\): это gap, даже если его падения записаны как известные, посторонние или прежние\\. Остальное правило в силе"
      reason: "Правило «известные баги без tracking-тикетов — не gaps» не уводит опровергнутый критерий плана в рекомендации и снимает только это."
    - kind: skill_contains
      file: "SKILL.md"
      pattern: "P6Q1\\{\"[^\"]*has_gaps \\([^)]*пункт «Критерии успеха» плана опровергнут или не подтверждён"
      reason: "Выбор итогового статуса называет невыполненный критерий успеха плана признаком has_gaps."
