name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      # Каждая ОС доводится до конца: при fail-fast упавший Windows отменял
      # ubuntu и macOS, и за один прогон была видна одна причина из трёх.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Node 22, а не 20: `npm test` — это `node --test src/tests/*.test.mjs`,
      # и на Windows глоб раскрывает сам node, а не оболочка. Node 20 этого
      # не умеет — `Could not find '…\src\tests\*.test.mjs'` за секунду, и
      # задание на Windows падало, не запустив ни одного теста. Node 20 к тому
      # же снят с поддержки (EOL 2026-04-30).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      # Вывод теста сохраняется в файл, а при падении каждый `not ok`
      # становится аннотацией `::error::` с местом и причиной. Лог задания
      # без авторизации не отдаётся, а аннотации видны и в интерфейсе, и через
      # API — иначе разбор падения начинался с просьбы прислать лог.
      - name: npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      # Бенчмарк отдельно от параллельного `npm test`: там он мерил
      # конкуренцию соседних файлов, а не сам snapshot. Сборку он не валит:
      # абсолютный порог по времени на общих раннерах шумит — на macOS тот же
      # код прошёл его в прогонах 146b97a и 2d5edc7 и не прошёл в 98ecb4e.
      # Цифры уходят аннотацией `notice`, падение — `warning`.
      - name: npm run bench
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if npm run bench 2>&1 | tee bench-output.log; then level=notice; else level=warning; fi
          # `|| true`: bash на раннере идёт с `-eo pipefail`, и `grep` без
          # совпадения (при успехе строки с ошибкой нет) обрывал шаг до `echo`
          # — провал шага на всех ОС, скрытый `continue-on-error`.
          numbers=$(grep -o '\[benchmark\].*' bench-output.log | head -1 || true)
          # Причина — в формате TAP (`error: '…'`, node 22 без терминала) или
          # spec (`AssertionError …: …`, node 25): ловятся оба.
          reason=$(grep -oE "(error: '.*'|AssertionError[^:]*: .*)" bench-output.log | head -1 || true)
          echo "::${level} title=benchmark::${numbers} ${reason}"
          [ "$level" = notice ]
      - name: npm run coverage
        shell: bash
        run: |
          set -o pipefail
          npm run coverage 2>&1 | tee coverage-output.log
      # Порог у каждого файла свой — его измеренное покрытие из
      # coverage-baseline.json (проверяет сам `npm run coverage`). Прежний
      # `c8 check-coverage` держал один порог 80/75 на всех и не проходил ни
      # разу. Здесь остаётся проверка, что ключевые скрипты вообще попали в отчёт.
      - name: Check key scripts are in coverage report
        run: |
          grep "mark-blocked.js" coverage/coverage-summary.json
          grep "pick-next-task.js" coverage/coverage-summary.json
          grep "move-ticket.js" coverage/coverage-summary.json
      # В конце, чтобы разобрать и `npm test`, и повторный прогон под
      # `npm run coverage`; храповик покрытия пишет свои аннотации сам.
      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          # Многострочная ошибка в TAP записана как `error: |-` — тогда
          # причиной берётся следующая строка.
          awk '
            pending { line = $0; sub(/^[[:space:]]+/, "", line); print "::error::" msg " | error: " line; msg = ""; pending = 0; next }
            /^[[:space:]]*not ok/ { if (msg != "") print "::error::" msg; msg = $0; sub(/^[[:space:]]+/, "", msg); next }
            msg != "" && /^[[:space:]]+location:/ { loc = $0; sub(/^[[:space:]]+/, "", loc); msg = msg " | " loc; next }
            msg != "" && /^[[:space:]]+error:/ {
              err = $0; sub(/^[[:space:]]+/, "", err)
              if (err ~ /\|-$/) { pending = 1; next }
              print "::error::" msg " | " err; msg = ""; next
            }
            END { if (msg != "") print "::error::" msg }
          ' $(ls test-output.log coverage-output.log 2>/dev/null)
