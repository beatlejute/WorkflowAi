name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24: npm@latest (12.x) требует ^22.22.2 || ^24.15.0 || >=26 — на Node 20
      # шаг обновления падал EBADENGINE, и задание не доходило до публикации (v1.7.3–v1.16.2).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm (trusted publishing requires >= 11.5.1)
        run: npm install -g npm@latest
      - run: npm install
      - run: npm test
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          test "$TAG" = "$PKG" || { echo "tag $TAG != package.json $PKG"; exit 1; }
      # Версию может опубликовать и локальный `npm publish` после push тега: повторная
      # публикация той же версии — отказ реестра, а не сбой выпуска.
      - name: Check version in registry
        id: registry
        run: |
          NAME="$(node -p "require('./package.json').name")"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$(npm view "$NAME@$PKG" version 2>/dev/null || true)" = "$PKG" ]; then
            echo "$NAME@$PKG is already in the registry, publish skipped"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.registry.outputs.published != 'true'
        run: npm publish
