# Конфигурация правил перемещения тикетов
# Версия: 1.0

version: "1.0"

# Правила перемещения тикетов на основе статуса ревью
# Каждое правило применяется к указанной директории
# condition: "passed" | "failed" | "skipped" | null
#   - "passed" — ревью пройдено
#   - "failed" — ревью провалено
#   - "skipped" — ревью пропущено
#   - null — ревью отсутствует (не заполнено)
# to_dir: целевая директория перемещения
# reason: причина перемещения (для логирования)
#
# Правил «passed/skipped → done» нет ни для одной колонки (PLAN-002): таблица
# «## Ревью» в тексте тикета — запись для человека, строку passed в неё может
# дописать и сам исполнитель. В done/ пайплайн переносит тикет стадией
# move-ticket по результату своих стадий, а не по тексту тикета. Направление
# «из done/» ниже осталось: оно только возвращает тикет на новый круг.

rules:
  # Правила для done/
  done:
    - condition: failed
      to_dir: backlog
      reason: "review failed"
    - condition: null
      to_dir: backlog
      reason: "no review"
    # passed или skipped — не перемещаем

# Директории тикетов (относительно .workflow/tickets/)
directories:
  backlog: backlog
  ready: ready
  in_progress: in-progress
  blocked: blocked
  review: review
  done: done
