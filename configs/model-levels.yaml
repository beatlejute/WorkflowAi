# Поправки градации моделей из своей практики (режим фактов src/scripts/model-scores.js,
# аргумент --overrides; в проекте файл виден как .workflow/config/model-levels.yaml).
#
# Уровень модели считается по оценке из фида (Artificial Analysis через OpenRouter) и
# порогам двух опорных моделей: `high` — не ниже опоры высокого уровня, `medium` — выше
# опоры среднего, `low` — не выше неё. Сам фид знает не все модели: у части нет ни своей
# оценки, ни оценки младшей версии семейства — уровень такой модели неизвестен. Такая
# модель не считается слабой (неоценённые — обычно свежие модели, до которых фид не
# дошёл): в очереди места с тегом она идёт после тех, чей уровень подтверждён и не ниже
# требуемого, но раньше тех, чей подтверждённый уровень ниже. Здесь уровень или свою
# оценку можно задать руками: поправка бьёт фид, а источник (`override`) виден в строке
# FACTS у модели (суффикс ` level=<уровень>(<источник>)`).
#
# Ключ — модель в любой привычной форме: полный id, он же без маршрута, имя модели или
# slug оценки (`kilo/liquid/lfm-2.5-2.6b`, `liquid/lfm-2.5-2.6b`, `lfm-2.5-2.6b`). Голое
# имя без производителя (`lfm-2.5-2.6b`) принимается, если на это имя в каталоге не больше
# одного производителя: один — применяется, ни одного (модели в каталоге нет — так задают
# уровень новинкам) — тоже, два и больше — WARN и поправка не применяется.
# Значение — имя уровня (`low`, `medium`, `high`) или число (своя оценка: уровень
# считается теми же порогами, что и оценки фида). Ключ с `:` (вариант `:free`) бери в
# кавычки, а после двоеточия значения ставь пробел — иначе YAML не разберёт строку.
#
# Каждая запись — наблюдение из практики: в комментарии к ней пиши, на чём основана.
# Пустая карта ниже — поправок пока нет, и это нормально: файла нет или он пуст, уровни
# считаются по фиду.
overrides:
  # "poolside/laguna-s-2.1": low
  # "dots-studio/dots-3-note-preview": medium
