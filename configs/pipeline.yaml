# =============================================================================
# Pipeline Configuration — формат конфигурации пайплайна
# =============================================================================
# Описывает цепочку этапов (stages), доступных агентов, goto-логику переходов,
# retry-стратегии и настройки выполнения.
#
# Runner читает этот файл и автономно оркестрирует работу:
#   node .workflow/src/runner.mjs --config .workflow/config/pipeline.yaml
#
# Переменные в goto.params:
#   $result.*   — поля из результата текущего stage
#   $context.*  — переменные из секции context (обновляются через params)
#   $counter.*  — значения счётчиков (обновляются стейджами type: update-counter)
# =============================================================================

pipeline:
  name: "default"
  version: "1.0"

  # ===========================================================================
  # Агенты (agents)
  # ===========================================================================
  # Каждый агент — это CLI-инструмент, который runner вызывает через child_process.
  # Формат:
  #   <agent-id>:
  #     command:      <string>   — исполняемый файл (должен быть в PATH)
  #     args:         <string[]> — аргументы командной строки
  #     workdir:      <string>   — рабочая директория (по умолчанию ".")
  #     capabilities: <string[]> — возможности агента (text, multimodal, mcp, ...);
  #                                 mcp — агент работает с MCP-серверами проекта
  #     description:  <string>   — описание агента (опционально)
  #     rails_host:   kilo|claude — CLI, в котором хук рельс видит инструменты агента
  #                                 (опционально; по умолчанию — по команде: `kilo … run`,
  #                                 `claude`). Нужен обёртке с другим именем команды: без
  #                                 хоста ответ без единого вызова инструмента на скиле с
  #                                 рельсами не отклоняется (src/rails/README.md §11).
  #     models:       <object>   — пул моделей по маске (опционально; README, «Пулы моделей»).
  #                                 Запись — одно место в списке стадии: раннер ставит на него
  #                                 участника `<пул>@<полный id>` — копию записи с полным id
  #                                 модели вместо {model}. Пул нельзя назначить одиночным
  #                                 stage.agent, поставить на стадию с model_io и в target_agents
  #                                 тестов скилов; kind: http пулом быть не может.
  #       models.list:            <string[]> — команда списка моделей и её аргументы; строка
  #                                 stdout — id или JSON {"id", "capabilities", "note"}
  #       models.match:           <string[]> — выражения RegExp без флагов по полному id;
  #                                 порядок участников — по первому совпавшему выражению
  #       models.max_per_attempt: <int>      — участников пула за попытку тикета, ≥ 1
  #                                 (по умолчанию 3)
  #       models.selector:        <agent-id> — агент с командой (не пул), ранжирует кандидатов
  #                                 под тикет: ответ `ranking: <id>, …` (опционально)
  #       models.scores:          <string[]> — команда оценок кандидатов для промпта селектора
  #                                 (опционально, только вместе с models.selector)
  #       models.gate:            <string[]> — команда-шлагбаум места перед запуском участника:
  #                                 `status: closed` закрывает место до 00:00 UTC (опционально)
  #     {model}       в args     — место полного id участника: ровно одно у пула, ни одного у
  #                                 агента без models
  #
  # Runner добавляет промпт последним аргументом автоматически.
  # Скил агенту задаёт stage.skill: первая строка промпта и WORKFLOW_RAILS_SKILL (рельсы).
  # stage.instructions и agents_by_type.<type>.instructions — только содержание работы
  # (блок «Instructions:» промпта), скил они не меняют. В args агента скил не пишется.
  # Скрипт-агенты (script-*) — детерминированы, capabilities к ним не применяются.
  # ===========================================================================
  agents:
    # mcp у агентов claude: claude подключает серверы из .mcp.json проекта, разрешённые в
    # .claude/settings.local.json (enabledMcpjsonServers). Проверено 2026-09-27 в PulseProxy:
    # `claude -p` находит инструменты mcp__playwright__* через ToolSearch. kilo .mcp.json
    # не читает (`kilo mcp list` показывает только серверы своего конфига), поэтому у
    # kilo-агентов mcp нет. Доступность серверов перед тикетами типов из mcp_require_for
    # проверяет стадия check-mcp.
    claude-haiku:
      command: "claude"
      args: ["--model", "claude-haiku-4-5-20251001", "--permission-mode", "bypassPermissions", "-p"]
      workdir: "."
      capabilities: [text, multimodal, mcp]
      description: "Claude Haiku — лёгкая быстрая модель, поддержка изображений"

    claude-sonnet:
      command: "claude"
      args: ["--model", "claude-sonnet-5", "--permission-mode", "bypassPermissions", "-p"]
      workdir: "."
      capabilities: [text, multimodal, mcp]
      description: "Claude Sonnet — быстрая модель, поддержка изображений"

    claude-opus:
      command: "claude"
      args: ["--model", "claude-opus-5", "--permission-mode", "bypassPermissions", "-p"]
      workdir: "."
      # Цена вызова судьи тестов скилов — для оценки перед прогоном: замер 2026-09-22,
      # 207 вызовов claude-opus-4-7 ($0.222). Для claude-opus-5 цена не измерена.
      cost_per_call: 0.222
      capabilities: [text, multimodal, mcp]
      description: "Claude Opus — мощная модель, поддержка изображений"

    # Судья тестов скилов на модели решений Jev (TypeSafe через OpenRouter) — агент с
    # командой, как остальные (README, «Судья тестов скилов»). Скрипт получает промпт
    # судьи через stdin и отвечает баллом и уверенностью; ключ читает сам из файла
    # --key-file, в переменных окружения его нет. Уверенность ниже escalate_below и
    # ответ без балла — оценку даёт escalate_to. Цена — среднее пилота 2026-09-24
    # ($0.000086 за вызов); escalation_share — доля переоценки при 0.8 в перемере
    # 2026-09-26 (83 из 284; pass/fail 94.7%, на оставшихся 100%).
    jev:
      command: "node"
      args: [".workflow/src/scripts/decisions-judge.js", "--model", "typesafe/jev-1.13", "--url", "https://openrouter.ai/api/alpha/decisions", "--key-file", "~/.workflow/secrets/openrouter.key"]
      workdir: "."
      prompt_stdin: true
      escalate_to: sol-judge
      escalate_below: 0.8
      escalation_share: 0.292
      cost_per_call: 0.0001
      # Обёртка ничего в проекте не читает: промпт из stdin, ключ из файла. Поэтому
      # запись годится для стадии ревью по evidence (review-result, PLAN-002).
      tool_less: true
      capabilities: [text]
      description: "Jev (TypeSafe) через OpenRouter — судья тестов скилов и модель ревью по evidence"

    # Эскалация судьи (решение владельца 2026-10-06): вместо claude-opus — Sol через
    # kilo. Обёртка kilo-judge: без инструментов, промпт из stdin, ответ — балл и
    # уверенность. Цена не замерялась — preFlight берёт дефолт $0.02/вызов.
    sol-judge:
      command: "node"
      args: [".workflow/src/scripts/kilo-judge.js", "--model", "openai/gpt-5.6-sol", "--timeout", "240"]
      workdir: "."
      prompt_stdin: true
      tool_less: true
      capabilities: [text]
      description: "Sol (gpt-5.6-sol) через kilo — переоценка неуверенных и сбойных вердиктов Jev"

    # Селектор модели стадии (selection.selector, README «Выбор модели стадии») — модель
    # решений Jev через обёртку decisions-select.js в режиме models: промпт из stdin, в нём
    # JSON с тикетом, рубрикой уровней стадии и выжившими кандидатами (id, бесплатная или
    # платная, уровень, оценки Artificial Analysis). Обёртка задаёт два вопроса decisions:
    # самый низкий достаточный уровень (score по рубрике; required_level — наименьший
    # уровень с накопленной вероятностью ≥ --level-quantile 0.5) и порядок кандидатов
    # внутри уровня (choice). Сбой или таймаут — один повтор вызова (без повтора при
    # auth, no_key, bad_request, usage, bad_prompt: тот же вызов не пройдёт). Сбой и после
    # повтора, ответ без уровня или селектор нездоров — старт обхода по complexity тикета:
    # simple — нижний уровень выживших, medium — средний, complex — верхний; тикет без
    # complexity — лестница от слабых (2026-09-30 PulseProxy: 12 сбоев из 50, QA-177
    # complex ушёл на уровень 1). Раннер вызывает его не больше двух раз на попытку и
    # снимает каждый вызов через 60 с. Отдельный id от селектора пула:
    # сбой одного не помечает нездоровым другого. Цена вызова с ~35 кандидатами не
    # измерена — cost_usd печатается в строке SELECT_MODEL.
    # Селектор участника пула (models.selector, агент jev-select 1.16) из поставляемого
    # конфига убран: пулы стоят только в списках execute-task, где пул селектора не зовут.
    # Путь селектора пула в коде остался — для стадий без selection и конфигов проекта.
    # --timeout 45: запрос models — два вопроса (уровень и порядок) по ~40 кандидатам; первый
    # живой ответ 2026-09-28 пришёл за 35 с, при 15 с второй вызов оборвался по времени и
    # выбор ушёл в лестницу снизу вверх. Потолок процесса селектора в раннере — 60 с
    # (SELECTOR_TIMEOUT_MS).
    jev-place:
      command: "node"
      args: [".workflow/src/scripts/decisions-select.js", "--model", "typesafe/jev-1.13", "--url", "https://openrouter.ai/api/alpha/decisions", "--key-file", "~/.workflow/secrets/openrouter.key", "--timeout", "45", "--level-quantile", "0.5"]
      workdir: "."
      prompt_stdin: true
      tool_less: true
      capabilities: [text]
      description: "Jev (TypeSafe) через OpenRouter — выбор модели стадии под тикет"

    # Claude без инструментов для пунктов DoD со скриншотами (visual) в стадии ревью по
    # evidence. Решение стейкхолдера 2026-09-26: скриншоты оценивает Claude Haiku.
    # Обёртка claude-judge.js запускает claude без инструментов, MCP и пользовательских
    # настроек в пустом временном каталоге и передаёт изображения из промпта блоками
    # base64 — модель видит только вопрос, evidence и изображения (проверено запуском
    # 2026-09-26: верный скриншот — 5, чужой — 2).
    claude-haiku-vision:
      command: "node"
      args: [".workflow/src/scripts/claude-judge.js", "--model", "claude-haiku-4-5-20251001"]
      workdir: "."
      prompt_stdin: true
      tool_less: true
      capabilities: [text, multimodal]
      description: "Claude Haiku без инструментов — оценка пунктов DoD со скриншотами в стадии ревью"

    # multimodal у gpt-агентов — по метаданным kilo: `kilo models --verbose` даёт
    # capabilities.input.image: true у openai/gpt-5.6-luna, -terra и -sol (2026-09-28). mcp нет:
    # kilo .mcp.json проекта не читает, в `kilo mcp list` только puppeteer (disabled).
    # Решение стейкхолдера 2026-09-28 по ручной правке ~/.workflow/configs: перенести в
    # канон только multimodal.
    gpt-luna:
      command: "kilo"
      args: ["-m", "openai/gpt-5.6-luna", "--agent", "code", "--print-logs", "--log-level", "ERROR", "run", "--auto"]
      workdir: "."
      capabilities: [text, multimodal]
      description: "Kilo GPT"

    # Судья пунктов DoD со скриншотами на kilo-модели: аналог claude-judge.js, но
    # картинки агент открывает сам инструментом чтения (gpt-5.6-luna, multimodal по
    # метаданным kilo). Решение стейкхолдера 2026-10-04: Claude недоступен (аккаунт на
    # холде), скриншоты в review-result оценивает gpt-luna. Проверено запуском
    # 2026-10-04: красный квадрат — score 5, синий против рубрики «красный» — score 1.
    # Вердикт — только строка VERDICT финального ответа; ненулевой exit kilo — отказ.
    # kilo ищется по PATH (bin/@kilocode/cli/bin/kilo рядом с лаунчером), перекрывается
    # --kilo/KILO_BIN.
    gpt-luna-vision:
      command: "node"
      args: [".workflow/src/scripts/kilo-judge.js", "--model", "openai/gpt-5.6-luna", "--timeout", "240"]
      workdir: "."
      prompt_stdin: true
      tool_less: true
      capabilities: [text, multimodal]
      description: "GPT Luna через kilo — оценка пунктов DoD со скриншотами в стадии ревью"

    gpt-terra:
      command: "kilo"
      args: ["-m", "openai/gpt-5.6-terra", "--agent", "code", "--print-logs", "--log-level", "ERROR", "run", "--auto"]
      workdir: "."
      capabilities: [text, multimodal]
      description: "Kilo GPT"

    gpt-sol:
      command: "kilo"
      args: ["-m", "openai/gpt-5.6-sol", "--agent", "code", "--print-logs", "--log-level", "ERROR", "run", "--auto"]
      workdir: "."
      capabilities: [text, multimodal]
      description: "Kilo GPT"

    gemini-flash-lite:
      command: "kilo"
      args: ["-m", "google/gemini-3.5-flash-lite", "--agent", "code", "--print-logs", "--log-level", "ERROR", "run", "--auto"]
      workdir: "."
      capabilities: [text]
      description: "Kilo gemini"

    gemini-flash:
      command: "kilo"
      args: ["-m", "google/gemini-3.8-flash", "--agent", "code", "--print-logs", "--log-level", "ERROR", "run", "--auto"]
      workdir: "."
      capabilities: [text]
      description: "Kilo gemini"

    deepseek-flash:
      command: "kilo"
      args: ["-m", "deepseek/deepseek-flash", "--agent", "code", "--print-logs", "--log-level", "ERROR", "run", "--auto"]
      workdir: "."
      capabilities: [text]
      description: "Kilo deepseek"

    deepseek-pro:
      command: "kilo"
      args: ["-m", "deepseek/deepseek-v4-pro", "--agent", "code", "--print-logs", "--log-level", "ERROR", "run", "--auto"]
      workdir: "."
      capabilities: [text]
      description: "Kilo deepseek"

    # Роутер kilo — агент target_agents тестов скилов execute-task и deep-research
    # (PLAN-004, решение 4); в списках стадий его нет: там бесплатные модели — пулы ниже.
    kilo-free:
      command: "kilo"
      args: ["-m", "kilo/kilo-auto/free", "--agent", "code", "--print-logs", "--log-level", "ERROR", "run", "--auto"]
      workdir: "."
      capabilities: [text]
      description: "Kilo free"

    # Пулы бесплатных моделей (PLAN-004, README «Пулы моделей»): место в списке стадии, на
    # которое раннер ставит конкретную модель `<пул>@<полный id>` из вывода адаптера
    # kilo-models-list.js. Маски и порядок — предложение плана (П10), утверждает
    # стейкхолдер. Состав задаёт только маска: встроенного фильтра «бесплатная» нет, и
    # платная модель, попавшая в маску, видна в строке POOL лога.
    #  - kilo/stealth/space-bunny-alpha названа явно: суффикса `:free` у неё нет, выражение
    #    закреплено `^…$`, платных соседей kilo/stealth/* оно не захватит;
    #  - openrouter/nvidia/nemotron-3.5-content-safety:free исключена отрицательным
    #    просмотром вперёд: единственная модель `:free` без вызова инструментов;
    #  - free-openrouter тратит дневной счётчик бесплатных запросов аккаунта OpenRouter
    #    (50/сутки): шлагбаум gate читает GET /api/v1/key и при `remaining: 0` закрывает
    #    место пула до 00:00 UTC (П14). На execute-task (selection) шлагбаум опрашивается
    #    один раз в начале попытки и перед каждым запуском участника, кроме запуска первым
    #    в попытке; закрытый пул выбывает из кандидатов попытки. Маршруты kilo/* счётчик аккаунта не тратят,
    #    gate у них нет.
    # selector и scores у пулов нет: пулы стоят только в списках execute-task, где участников
    # вместе с остальными кандидатами ранжирует селектор стадии (jev-place), а оценки и
    # бесплатность даёт selection.scores. Селектор пула там не вызывался бы никогда —
    # validateConfig такой мёртвый конфиг отклоняет.
    # Якорь &free_pool_args отдаёт обоим пулам один и тот же массив: раннер строит запись
    # участника копией, массив пула на месте не правит.
    free-kilo:
      command: "kilo"
      args: &free_pool_args ["-m", "{model}", "--agent", "code", "--print-logs", "--log-level", "ERROR", "run", "--auto"]
      workdir: "."
      capabilities: [text]
      description: "Бесплатные модели шлюза Kilo по маске"
      models:
        list: ["node", ".workflow/src/scripts/kilo-models-list.js"]
        match:
          - '^kilo/stealth/space-bunny-alpha$'
          - '^kilo/nvidia/nemotron-3-ultra-550b-a55b:free$'
          - '^kilo/[^/]+/[^/]+:free$'
        max_per_attempt: 3

    free-openrouter:
      command: "kilo"
      args: *free_pool_args
      workdir: "."
      capabilities: [text]
      description: "Бесплатные модели OpenRouter по маске (счётчик аккаунта 50/сутки)"
      models:
        list: ["node", ".workflow/src/scripts/kilo-models-list.js"]
        match:
          - '^openrouter/nvidia/nemotron-3-ultra-550b-a55b:free$'
          - '^openrouter/(?!nvidia/nemotron-3\.5-content-safety:free$)[^/]+/[^/]+:free$'
        max_per_attempt: 3
        gate: ["node", ".workflow/src/scripts/free-quota-gate.js", "--url", "https://openrouter.ai/api/v1/key", "--key-file", "~/.workflow/secrets/openrouter.key", "--timeout", "10"]

    script-move:
      command: "node"
      args: [".workflow/src/scripts/move-ticket.js"]
      workdir: "."
      description: "Скрипт для перемещения тикетов между директориями"

    script-pick:
      command: "node"
      args: [".workflow/src/scripts/pick-next-task.js"]
      workdir: "."
      description: "Скрипт для выбора следующего тикета из ready/"

    script-human-gate-route:
      command: "node"
      args: [".workflow/src/scripts/human-gate-route.js"]
      workdir: "."
      prompt_stdin: true
      description: "Проверить состояние human-тикета после открытия gate"

    script-review-failure-route:
      command: "node"
      args: [".workflow/src/scripts/review-failure-route.js"]
      workdir: "."
      prompt_stdin: true
      description: "Развести отказ ревью human и агентских тикетов"

    script-move-ready:
      command: "node"
      args: [".workflow/src/scripts/move-to-ready.js"]
      workdir: "."
      description: "Скрипт для перемещения тикетов из backlog/ в ready/"

    script-check-conditions:
      command: "node"
      args: [".workflow/src/scripts/check-conditions.js"]
      workdir: "."
      description: "Скрипт для проверки условий тикетов в backlog/"

    script-check-plan-decomposed:
      command: "node"
      args: [".workflow/src/scripts/check-plan-decomposed.js"]
      workdir: "."
      description: "Скрипт для проверки, декомпозирован ли текущий план"

    script-get-all-ids:
      command: "node"
      args: [".workflow/src/scripts/get-next-id.js", "--all-from-config"]
      workdir: "."
      description: "Выделяет стартовые номера для всех префиксов из config.yaml → task_types (используется стадией allocate-ticket-ids перед decompose-plan)"

    script-check-relevance:
      command: "node"
      args: [".workflow/src/scripts/check-relevance.js"]
      workdir: "."
      description: "Скрипт проверки актуальности тикета (заменяет скил check-relevance)"

    script-move-to-review:
      command: "node"
      args: [".workflow/src/scripts/move-to-review.js"]
      workdir: "."
      description: "Скрипт для перемещения завершённых тикетов из in-progress/ в review/"

    script-check-templates:
      command: "node"
      args: [".workflow/src/scripts/check-plan-templates.js"]
      workdir: "."
      description: "Проверка и активация шаблонов планов по триггерам"

    script-check-mcp:
      command: "node"
      args: [".workflow/src/scripts/check-mcp.js"]
      workdir: "."
      description: "Проверка доступности MCP-серверов"

    script-mark-blocked:
      command: "node"
      args: [".workflow/src/scripts/mark-blocked.js"]
      workdir: "."
      description: "Обновление frontmatter и запись в alerts.jsonl при автоблокировке"

    script-mark-human-rejected:
      command: "node"
      args: [".workflow/src/scripts/mark-blocked.js"]
      workdir: "."
      description: "Обновление frontmatter при отклонении human-тикета"

    script-verify-artifacts:
      command: "node"
      args: [".workflow/src/skills/review-result/scripts/verify-artifacts.js"]
      workdir: "."
      description: "Механическая предпроверка артефактов тикета перед AI-ревью (DoD %, result_filled, files_exist)"

    script-complete-plan:
      command: "node"
      args: [".workflow/src/scripts/complete-plan.js"]
      workdir: "."
      description: "Завершает план (status: completed) и архивирует done-тикеты"

    script-check-report-needed:
      command: "node"
      args: [".workflow/src/scripts/check-report-needed.js"]
      workdir: "."
      description: "Сверяет доску с последним отчётом: нужен ли новый"

    script-verify-atomicity:
      command: "node"
      # --activate: план переводит в active только стадия пайплайна; агент декомпозиции,
      # запуская скрипт для самопроверки, план не трогает (PulseProxy PLAN-020, 2026-09-29)
      args: [".workflow/src/skills/decompose-plan/scripts/verify-atomicity.js", "--activate"]
      workdir: "."
      description: "Машинная проверка атомарности тикетов после декомпозиции"

    script-check-atomicity-limit:
      command: "node"
      args: [".workflow/src/skills/decompose-plan/scripts/check-atomicity-limit.js"]
      workdir: "."
      description: "Проверка лимита попыток атомарности без инкремента счётчика"


  # Дефолтный список агентов для стейджа, если у него не задан свой agents / agents_by_type.
  default_agents: [claude-sonnet, gpt-luna, gemini-flash-lite, deepseek-flash]

  # ===========================================================================
  # Этапы (stages)
  # ===========================================================================
  # Каждый stage описывает один шаг пайплайна.
  # Формат:
  #   <stage-id>:
  #     description:    <string>   — что делает этот этап
  #     agents:         <id[]>     — упорядоченный список кандидатов (по приоритету)
  #     skill:          <skill-id> — какой skill использовать (.workflow/src/skills/<skill>/SKILL.md)
  #     instructions:   <string>   — доп. инструкции, передаваемые агенту в промпте
  #     counter:        <string>   — имя счётчика попыток для этого stage
  #     scope:          plan       — стадия уровня плана: ключей тикета (ticket_id, task_type,
  #                                   required_capabilities, …) в её контексте нет; plan_id
  #                                   пуст — из related_plan отчёта report_id
  #     agents_by_type:            — маршрутизация списка агентов по типу задачи (task_type);
  #                                   полностью перекрывает stage.agents / stage.instructions
  #       <type>:
  #         agents: <id[]>
  #         instructions: <string>
  #         selection: false       — тип без выбора модели стадии (курсор попытки)
  #     selection:                 — выбор модели стадии (только skill: execute-task; README,
  #                                   «Выбор модели стадии»)
  #       selector:  <agent-id>    — агент с командой (не пул): уровень и порядок кандидатов
  #       scores:    <string[]>    — команда фактов: оценка и бесплатность моделей кандидатов
  #       levels:    <string[]>    — рубрика сложности тикета, 2..10 текстов от слабого к
  #                                   сильному; её длина — число уровней кандидатов
  #       escalate_on: [blocked]   — агент ответил blocked — следующий сильнее в той же попытке
  #     goto:                      — логика переходов по результату
  #       <status>:                — ключ = статус результата агента
  #         stage:  <stage-id>     — следующий stage
  #         params: <map>          — параметры, передаваемые в context следующего stage
  #       default:                 — fallback если статус не совпал ни с одним ключом
  #
  # Логика выбора агента (StageExecutor.resolveAgent, src/runner.mjs):
  #   1. Взять список: agents_by_type[task_type].agents (если задан), иначе stage.agents,
  #      иначе pipeline.default_agents.
  #   2. Отфильтровать: агент покрывает ВСЕ required_capabilities тикета, здоров по
  #      health-реестру (у пула — и id пула), без запрета модели (стадия исполнителя), не
  #      пробован в этой попытке; пул — одно место, пока в попытке пробовано меньше
  #      max_per_attempt его участников.
  #   3. Никого не осталось → status: blocked (no_capable_agent, all_unhealthy, all_banned).
  #   4. Попытка N (1-based) берёт место (N − 1) % длины отфильтрованного списка — курсор
  #      идёт по кругу, «attempts_exhausted» нет: попытки ограничивает счётчик стадии.
  #   5. Неудача агента с пустым diff, ошибка модели или запрет модели — следующее место
  #      в той же попытке; неудача стадии — следующая попытка (счётчик +1).
  # Стадия с selection (execute-task) шаг 4 заменяет выбором модели: кандидаты шага 2 (пулы —
  # участниками) делятся на уровни по оценкам, селектор называет самый низкий достаточный
  # уровень, обход — сначала бесплатные от этого уровня вверх, затем платные, затем слабее;
  # проваленные на тикете уровни не берутся (README, «Выбор модели стадии»).
  #
  # Специальные значения stage:
  #   "end" — завершение пайплайна
  #
  # Встроенный тип стейджа (type: update-counter):
  #   Инкрементирует счётчик без вызова агента.
  #   type:    update-counter  — встроенный обработчик runner'а
  #   counter: <string>        — имя счётчика
  #   max:     <int>           — при достижении max возвращает статус "max_reached"
  #   goto:
  #     default:    <stage>    — следующий стейдж (счётчик < max)
  #     max_reached: <stage>   — стейдж при достижении max
  # ===========================================================================
  stages:

    # -------------------------------------------------------------------------
    # 0. pick-first-task
    # Выбирает следующую задачу из ready/ по приоритету и зависимостям
    # Если ready/ пуст — проверяет review/
    # -------------------------------------------------------------------------
    pick-first-task:
      description: "Выбрать задачу задачу из ready по приоритету"
      agent: script-pick
      goto:
        found:
          stage: move-to-in-progress
          params:
            ticket_id: "$result.ticket_id"
            task_type: "$result.type"
            required_capabilities: "$result.required_capabilities"
            target: in-progress
            # evidence_file предыдущего тикета: контекст раннера между тикетами не очищается,
            # и исполнитель читал чужой файл evidence (PulseProxy, 2026-09-27, шесть сессий).
            evidence_file: ""
        human_ready:
          stage: manual-gate-human
          params:
            ticket_id: "$result.ticket_id"
        in_review:
          stage: verify-artifacts
          params:
            ticket_id: "$result.ticket_id"
            required_capabilities: "$result.required_capabilities"
            attempt: "1"
        completed_in_progress:
          stage: move-to-review
          params:
            ticket_id: "$result.ticket_id"
            required_capabilities: "$result.required_capabilities"
        in_progress:
          stage: check-relevance
          params:
            ticket_id: "$result.ticket_id"
            task_type: "$result.type"
            required_capabilities: "$result.required_capabilities"
            evidence_file: ""
        empty: check-plan-templates
        error: create-report

    # -------------------------------------------------------------------------
    # 0a. check-plan-templates
    # Проверяет шаблоны планов в plans/templates/.
    # Если триггер сработал — создаёт план в plans/current/ со статусом approved.
    # Всегда переходит на check-plan-decomposition.
    # -------------------------------------------------------------------------
    check-plan-templates:
      description: "Проверить шаблоны планов и создать планы по триггерам"
      agent: script-check-templates
      goto:
        plan_created: check-plan-decomposition
        no_triggers: check-plan-decomposition
        default: check-plan-decomposition
        error: check-plan-decomposition

    # -------------------------------------------------------------------------
    # 0b. check-plan-decomposition
    # Проверяет состояние декомпозиции планов и статус активации.
    # Результаты:
    #   - needs_decomposition  — approved-план без тикетов → allocate-ticket-ids → decompose
    #   - awaiting_atomicity   — approved-план с тикетами, но без активации → verify-atomicity
    #                            (защита от сценария: decompose отработал, но verify-atomicity
    #                            был пропущен/прерван — план не должен тихо уйти в check-conditions
    #                            со статусом approved; атомарность обязана быть проверена до активации).
    #   - decomposed           — active-план с тикетами → штатный check-conditions
    #   - no_plan / default    — нет работы для pipeline → check-conditions
    # -------------------------------------------------------------------------
    check-plan-decomposition:
      description: "Проверить состояние декомпозиции и активации планов"
      agent: script-check-plan-decomposed
      goto:
        needs_decomposition:
          stage: allocate-ticket-ids
          params:
            plan_file: "$result.plan_file"
        awaiting_atomicity:
          stage: check-atomicity-limit
          params:
            plan_file: "$result.plan_file"
        decomposed: check-conditions
        no_plan: check-conditions
        default: check-conditions
        error: check-conditions

    # -------------------------------------------------------------------------
    # 0c. allocate-ticket-ids
    # Выделяет стартовые номера для всех префиксов из config.yaml → task_types
    # ДО запуска декомпозиции. Результат (id_ranges) передаётся в context и
    # далее в decompose-plan через instructions. Это устраняет класс ошибок
    # с коллизиями ID, когда агент-декомпозитор начинает нумерацию с 001
    # Архитектурный принцип: решения про ID принимает инфраструктура, а не агент.
    # -------------------------------------------------------------------------
    allocate-ticket-ids:
      description: "Выделить стартовые номера ID для всех префиксов перед декомпозицией"
      agent: script-get-all-ids
      timeout: 60
      goto:
        default:
          stage: decompose-plan
          params:
            plan_file: "$context.plan_file"
            id_ranges_json: "$result.id_ranges_json"
        error: check-conditions

    # -------------------------------------------------------------------------
    # 0d. decompose-plan
    # Декомпозирует план на тикеты в backlog/
    # На входе ОБЯЗАТЕЛЬНО: plan_file и id_ranges_json (выделенные стадией
    # allocate-ticket-ids). id_ranges_json — это JSON-строка вида
    # {"QA":26,"HUMAN":2,...}; декомпозитор парсит её сам (гейт нумерации P10G3
    # в workflows/decompose.md). Передача именно строки, а не объекта, обусловлена тем, что
    # runner workflow-ai при подстановке $context.* в instructions применяет
    # неявный toString() — объекты превращаются в "[object Object]".
    # Декомпозитор НЕ вызывает get-next-id.js самостоятельно.
    # -------------------------------------------------------------------------
    decompose-plan:
      description: "Декомпозировать план на тикеты"
      agents: [claude-sonnet, gpt-luna]
      skill: decompose-plan
      instructions: "Декомпозируй план .workflow/$context.plan_file на тикеты. ID тикетов бери ТОЛЬКО из JSON-карты id_ranges_json=$context.id_ranges_json — это стартовые номера по префиксам в формате {\"PREFIX\":N_start,...}, уже выделенные стадией allocate-ticket-ids. Распарси JSON, используй значения как есть. НЕ вызывай get-next-id.js и НЕ изобретай номера самостоятельно. Подробности: гейт нумерации P10G3 в workflows/decompose.md. Если в Context есть atomicity_failures — учти их при декомпозиции: исправь неатомарные тикеты."
      goto:
        default: check-atomicity-limit

    # -------------------------------------------------------------------------
    # 0e. check-atomicity-limit
    # Проверяет counter atomicity_check_attempts без инкремента перед запуском verify-atomicity.
    # Если counter >= max (3) — bypass на check-conditions (защита от бесконечного цикла).
    # ВАЖНО: использует скрипт (НЕ update-counter), чтобы НЕ инкрементировать счётчик.
    # Инкремент происходит только в increment-atomicity-counter при failed verify-atomicity.
    # -------------------------------------------------------------------------
    check-atomicity-limit:
      description: "Проверить лимит попыток проверки атомарности (без инкремента)"
      agent: script-check-atomicity-limit
      timeout: 10
      goto:
        passed:
          stage: verify-atomicity
          params:
            plan_file: "$context.plan_file"
        failed:
          stage: check-conditions
        default:
          stage: verify-atomicity
          params:
            plan_file: "$context.plan_file"
        error:
          stage: check-conditions

    # -------------------------------------------------------------------------
    # 0f. verify-atomicity
    # Машинная проверка атомарности тикетов после декомпозиции.
    # При passed → plan.status: approved → active (activatePlan в скрипте, только с --activate в args агента) → check-conditions.
    # При failed → increment-atomicity-counter → decompose-plan (feedback loop с atomicity_failures).
    # plan_file берётся из $context (передан через decompose-plan.params или через
    # check-plan-decomposition → check-atomicity-limit при awaiting_atomicity-сценарии).
    # -------------------------------------------------------------------------
    verify-atomicity:
      description: "Машинная проверка атомарности тикетов и активация плана при passed"
      agent: script-verify-atomicity
      timeout: 60
      goto:
        passed:
          stage: check-conditions
        failed:
          stage: increment-atomicity-counter
          params:
            atomicity_failures: "$result.atomicity_failures"
        default:
          stage: check-conditions
        error:
          stage: check-conditions

    # -------------------------------------------------------------------------
    # 0g. increment-atomicity-counter
    # Инкрементирует counter при failed verify-atomicity.
    # При max_reached — bypass на check-conditions. Иначе — возврат на decompose-plan.
    # -------------------------------------------------------------------------
    increment-atomicity-counter:
      description: "Инкрементировать счётчик попыток проверки атомарности"
      type: update-counter
      counter: atomicity_check_attempts
      max: 3
      goto:
        default:
          stage: decompose-plan
          params:
            atomicity_failures: "$context.atomicity_failures"
        max_reached:
          stage: check-conditions

    # -------------------------------------------------------------------------
    # 1. check-conditions
    # Проверяет условия тикетов в backlog/, выводит список готовых
    # -------------------------------------------------------------------------
    check-conditions:
      description: "Проверить условия тикетов в backlog, вывести готовые"
      agent: script-check-conditions
      goto:
        has_ready:
          stage: move-to-ready
          params:
            ready_tickets: "$result.ready_tickets"
        default: pick-next-task
        empty: check-report-needed
        error: create-report

    # Работы нет — отчёт, только если доска изменилась с прошлого: иначе каждый запуск
    # писал новый отчёт на той же доске (2026-09-28 PulseProxy, REPORT-024…026 подряд).
    check-report-needed:
      description: "Нужен ли новый отчёт: доска изменилась с последнего отчёта?"
      agent: script-check-report-needed
      timeout: 60
      goto:
        needed: create-report
        analyze:
          stage: analyze-report
          params:
            report_id: "$result.report_id"
        # Разбор по этой доске — completed: закрытие плана бесплатно и повтор ничего не
        # меняет, а прогон с этим разбором могли остановить до complete-plan. plan_id —
        # план отчёта: без него complete-plan закрыл бы первый активный план.
        close_plan:
          stage: complete-plan
          params:
            plan_id: "$result.plan_id"
        unchanged: end
        # План стоит: у плана отчёта тикеты в blocked/, разбиение их не сняло (plan_id,
        # blocked_tickets и строка WARN с blocked_reason каждого). Отчёт и разбор на той же
        # доске ничего не дадут — конец, а раннер пишет итог «Pipeline stopped: plan … is
        # stuck» вместо «Pipeline completed successfully!»: нужно решение человека.
        stuck: end
        default: create-report
        error: create-report

    # -------------------------------------------------------------------------
    # 1b. move-to-ready
    # Перемещает тикеты из backlog/ в ready/ (по списку из check-conditions)
    # -------------------------------------------------------------------------
    move-to-ready:
      description: "Переместить готовые тикеты из backlog в ready"
      agent: script-move-ready
      timeout: 120
      goto:
        default: pick-next-task

    # -------------------------------------------------------------------------
    # 2. pick-next-task
    # Выбирает следующую задачу из ready/ по приоритету и зависимостям
    # Если ready/ пуст — проверяет review/
    # -------------------------------------------------------------------------
    pick-next-task:
      description: "Выбрать следующую задачу из ready по приоритету"
      agent: script-pick
      goto:
        found:
          stage: move-to-in-progress
          params:
            ticket_id: "$result.ticket_id"
            task_type: "$result.type"
            required_capabilities: "$result.required_capabilities"
            target: in-progress
            # evidence_file предыдущего тикета: контекст раннера между тикетами не очищается,
            # и исполнитель читал чужой файл evidence (PulseProxy, 2026-09-27, шесть сессий).
            evidence_file: ""
        human_ready:
          stage: manual-gate-human
          params:
            ticket_id: "$result.ticket_id"
        in_review:
          stage: verify-artifacts
          params:
            ticket_id: "$result.ticket_id"
            required_capabilities: "$result.required_capabilities"
            attempt: "1"
        completed_in_progress:
          stage: move-to-review
          params:
            ticket_id: "$result.ticket_id"
            required_capabilities: "$result.required_capabilities"
        in_progress:
          stage: check-relevance
          params:
            ticket_id: "$result.ticket_id"
            task_type: "$result.type"
            required_capabilities: "$result.required_capabilities"
            evidence_file: ""
        empty: check-conditions
        default: check-conditions
        error: create-report

    # -------------------------------------------------------------------------
    # 2b. move-to-in-progress
    # Перемещает тикет из ready/ в in-progress/ перед выполнением
    # -------------------------------------------------------------------------
    move-to-in-progress:
      description: "Переместить тикет из ready в in-progress"
      agent: script-move
      timeout: 120
      goto:
        default:
          stage: check-relevance
          params:
            ticket_id: "$context.ticket_id"
        error:
          stage: check-relevance
          params:
            ticket_id: "$context.ticket_id"

    # -------------------------------------------------------------------------
    # 2c. check-relevance
    # Проверяет актуальность тикета перед выполнением (план активен, DoD не выполнен)
    # Fail-safe: default fallback → execute-task (лучше выполнить лишний, чем пропустить)
    # -------------------------------------------------------------------------
    check-relevance:
      description: "Проверить актуальность тикета перед выполнением (детерминированный скрипт)"
      agent: script-check-relevance
      timeout: 120
      goto:
        relevant:
          stage: check-mcp
          params:
            ticket_id: "$context.ticket_id"
        irrelevant:
          stage: move-ticket
          params:
            ticket_id: "$context.ticket_id"
            target: done
        default:
          stage: check-mcp
          params:
            ticket_id: "$context.ticket_id"

    # -------------------------------------------------------------------------
    # 2d. check-mcp
    # Проверяет доступность MCP-серверов перед запуском задач, которым они нужны.
    # Список типов тикетов задаётся в context.mcp_require_for (см. секцию context
    # в конце файла). Это проектная настройка — менять там.
    #
    # Поведение:
    #   - task_type входит в mcp_require_for + MCP доступны → status: ok      → execute-task
    #   - task_type входит в mcp_require_for + MCP упали   → status: fail    → blocked
    #   - task_type НЕ входит в mcp_require_for             → status: skipped → execute-task
    # -------------------------------------------------------------------------
    check-mcp:
      description: "Проверить доступность MCP-серверов для типов тикетов из mcp_require_for"
      agent: script-check-mcp
      timeout: 60
      # ВАЖНО: workflow-ai runner нормализует статусы через STATUS_ALIASES:
      #   "ok"   → "passed"
      #   "fail" → "failed"
      # Поэтому в goto используются канонические passed/failed, а не ok/fail из вывода скрипта.
      # "skipped" не входит в таблицу синонимов, остаётся как есть.
      goto:
        passed:
          stage: execute-task
          params:
            ticket_id: "$context.ticket_id"
        skipped:
          stage: execute-task
          params:
            ticket_id: "$context.ticket_id"
        failed:
          stage: move-ticket
          params:
            ticket_id: "$context.ticket_id"
            target: blocked
        default:
          stage: execute-task
          params:
            ticket_id: "$context.ticket_id"

    # -------------------------------------------------------------------------
    # 3. execute-task
    # Выполняет выбранную задачу (код, документация, план и т.д.)
    # -------------------------------------------------------------------------
    execute-task:
      description: "Выполнить выбранную задачу"
      skill: execute-task
      counter: task_attempts
      # Выбор модели стадии (README, «Выбор модели стадии»): самая слабая достаточная модель
      # среди выживших фильтров, бесплатные — первыми. Уровни — полосы оценок кандидатов,
      # их число — число текстов levels; уровней агентам и порогов в конфиге нет.
      # agents_by_type ниже наследуют выбор; `selection: false` у типа — прежний курсор.
      selection:
        selector: jev-place
        scores: ["node", ".workflow/src/scripts/model-scores.js", "--benchmarks-url", "https://openrouter.ai/api/v1/benchmarks?source=artificial-analysis", "--models-url", "https://openrouter.ai/api/v1/models", "--key-file", "~/.workflow/secrets/openrouter.key"]
        escalate_on: [blocked]
        levels:
          - "mechanical edit from a precise recipe, 1-2 files, DoD checked by one command"
          - "routine change in a known place, clear DoD, up to ~5 files"
          - "change needing mcp/browser checks, or debugging with a known cause"
          - "unknown root cause, several modules, repeat after a failed attempt"
          - "regression after others failed, architecture, ambiguous DoD"
      agents: [free-kilo, free-openrouter, gpt-luna, gemini-flash-lite, claude-haiku, claude-sonnet, claude-opus, deepseek-flash]
      # instructions типа — содержание работы, а не скил. Скил стадии раннер передаёт агенту в
      # WORKFLOW_RAILS_SKILL: по нему хук ведёт состояние рельс, по его терминалу раннер
      # проверяет финальный ответ, `start` другого скила рельсы отклоняют (src/rails/README.md §5).
      # Прежние «Твоя роль: coach» / «Твоя роль: manual-testing» (b86303d, 2026-04-15, замена
      # агентов claude-coach / claude-qa с именем скила в аргументах) агенты принимали за скил:
      # прогон PulseProxy 2026-09-27, QA-тикеты — старт manual-testing вместо execute-task.
      agents_by_type:
        coach:
          agents: [claude-opus, gpt-sol, gemini-flash, deepseek-pro]
          instructions: "Скил этого запуска — execute-task: пройди его граф рельс от входа до терминального узла, финальный ответ — только там. Тип тикета описывает содержание работы, а не скил: правка скилов по описанию и DoD тикета."
        qa:
          agents: [claude-haiku, gpt-luna, gemini-flash-lite, claude-sonnet, claude-opus]
          instructions: "Скил этого запуска — execute-task: пройди его граф рельс от входа до терминального узла, финальный ответ — только там. Тип тикета описывает содержание работы, а не скил: по описанию и DoD тикета напиши и реально запусти тесты и проверки: каждый случай тикета — отдельный тест против продукта (модуль, сборка, запущенное приложение в среде из тикета, плана или shared), значения в отчёте — измеренные, расхождение с ожиданием — в «### Найденные дефекты»."
        arch:
          agents: [claude-opus, gpt-sol]
      goto:
        default:
          stage: move-to-review
          params:
            ticket_id: "$context.ticket_id"
            attempt: "$counter.task_attempts"
            target: review
        # status: blocked — раннер не нашёл агента (no_capable_agent; all_unhealthy или
        # all_banned, пока в попытке не было сбоя; StageExecutor.executeWithFallback) или
        # агент сам ответил blocked, а сильнее его уровня кандидатов нет (эскалация selection).
        # Направляем тикет сразу в blocked/, минуя move-to-review → verify-artifacts →
        # increment-task-attempts: иначе тикет крутится 6 итераций вхолостую (execute-task
        # не может его взять, verify-artifacts фейлится с пустым result, счётчик достигает
        # max → blocked всё равно). Прямой маршрут экономит ~6 пустых итераций на тикет.
        blocked:
          stage: move-ticket
          params:
            ticket_id: "$context.ticket_id"
            target: blocked
        error:
          stage: move-to-review
          params:
            ticket_id: "$context.ticket_id"
            attempt: "$counter.task_attempts"
            target: review

    # -------------------------------------------------------------------------
    # 3b. move-to-review
    # Перемещает тикет в review/ после выполнения задачи
    # -------------------------------------------------------------------------
    move-to-review:
      description: "Переместить тикет в review после выполнения"
      agent: script-move-to-review
      timeout: 120
      goto:
        skipped:
          stage: pick-next-task
        default:
          stage: verify-artifacts
          params:
            ticket_id: "$context.ticket_id"
            attempt: "$counter.task_attempts"

    # -------------------------------------------------------------------------
    # 2d. manual-gate-human
    # Используется для созревших human-тикетов (pick-first-task возвращает human_ready).
    # Ждёт решения по approval-файлу (approved/rejected/timeout).
    # -------------------------------------------------------------------------
    manual-gate-human:
      description: "Ожидание ручного выполнения созревшего human-тикета"
      type: manual-gate
      poll_interval_ms: 2000
      timeout_seconds: 86400
      goto:
        # Одобрение — только «продолжить»: скрипт проверяет, передан ли результат
        # (тикет в review/done/archive), иначе ветка заканчивается ожиданием человека
        # вместо холостого цикла pick → gate (дефект 2026-10-04, ~1360 переходов).
        approved: human-gate-route
        rejected:
          stage: mark-human-rejected
          params:
            ticket_id: "$context.ticket_id"
        timeout:
          stage: mark-human-rejected
          params:
            ticket_id: "$context.ticket_id"
            reason: "human_gate_timeout"
        aborted: end

    # -------------------------------------------------------------------------
    # 2e. human-gate-route / review-failure-route
    # Детерминированные маршруты после human-ворот и после отказа ревью:
    # human-тикет не возвращается молча в ready/ и не отдаётся агентской
    # переделке — решает человек (дефект 2026-10-04: цикл ~1360 переходов).
    # -------------------------------------------------------------------------
    human-gate-route:
      description: "Проверить передачу human-результата после открытия gate"
      agent: script-human-gate-route
      timeout: 30
      goto:
        continue: pick-first-task
        human_action_required: end
        human_route_error: end
        default: end
        error: end

    review-failure-route:
      description: "Отказ human-ревью требует человека, агентского — новой попытки"
      agent: script-review-failure-route
      timeout: 30
      goto:
        agent_failed:
          stage: increment-task-attempts
          params:
            ticket_id: "$context.ticket_id"
        human_action_required: end
        human_route_error: end
        default: end
        error: end

    # -------------------------------------------------------------------------
    # 3b. mark-blocked
    # Записывает причину автоблокировки в frontmatter тикета и эмитит alert
    # в alerts.jsonl. Вставлен между increment-task-attempts.max_reached и
    # move-ticket(blocked).
    # -------------------------------------------------------------------------
    mark-blocked:
      description: "Записать причину автоблокировки в frontmatter и эмитить alert"
      agent: script-mark-blocked
      timeout: 30
      goto:
        default:
          stage: move-ticket
          params:
            ticket_id: "$context.ticket_id"
            target: blocked
        error:
          stage: move-ticket
          params:
            ticket_id: "$context.ticket_id"
            target: blocked

    # -------------------------------------------------------------------------
    # 3b'. mark-human-rejected
    # Записывает причину отклонения human-тикета (reject/timeout) и переходит
    # в move-ticket(blocked). Используется ветками rejected и timeout стейджа
    # manual-gate-human.
    # -------------------------------------------------------------------------
    mark-human-rejected:
      description: "Записать причину отклонения human-тикета и переместить в blocked"
      agent: script-mark-human-rejected
      timeout: 30
      goto:
        default:
          stage: move-ticket
          params:
            ticket_id: "$context.ticket_id"
            target: blocked
        error:
          stage: move-ticket
          params:
            ticket_id: "$context.ticket_id"
            target: blocked

    # -------------------------------------------------------------------------
    # 3c. verify-artifacts
    # Механическая предпроверка артефактов тикета перед AI-ревью.
    # Блокирует AI-рационализацию: если DoD пустой или Result не заполнен —
    # сразу failed → increment-task-attempts, без вызова дорогой модели.
    # Критерии failed: result_filled==false | dod_completion_pct==0 | missing_files.
    # Runner нормализует ok→passed, fail→failed через STATUS_ALIASES.
    # Исходы по тикетам dod_format: 2 (PLAN-002): all_green — все пункты DoD
    # закрыты зелёными проверками → move-ticket done без модели; passed и default →
    # review-result с evidence_file и required_capabilities из результата.
    # legacy (тикет без dod_format: 2, а также тикет executor_type: human с файлами
    # проекта вне своей области — context.files, маски пунктов visual, пути после -- в
    # проверках check; warnings: human_out_of_scope_changes) и error →
    # review-result-legacy, агент со скилом: правку продукта человеком смотрит агент с
    # инструментами, а не модель по evidence. Обе ветки явно обнуляют evidence_file: updateContext только
    # присваивает ключи из params и ничего не удаляет, а переходы pick-* его не
    # задают — без пустого значения в промпт review-result-legacy попал бы файл
    # evidence предыдущего тикета прогона. Пустое значение в промпт не попадает.
    # required_capabilities задают переходы pick-* выбранного тикета; ветка error
    # его обнуляет (PLAN-002, задача 16) — review-result-legacy выбирает агента
    # без фильтра по способностям тикета, ветка legacy фильтр сохраняет.
    # -------------------------------------------------------------------------
    verify-artifacts:
      description: "Механическая предпроверка артефактов тикета перед AI-ревью"
      agent: script-verify-artifacts
      timeout: 60
      goto:
        all_green:
          stage: move-ticket
          params:
            ticket_id: "$context.ticket_id"
            target: done
        passed:
          stage: review-result
          params:
            ticket_id: "$context.ticket_id"
            attempt: "$counter.task_attempts"
            evidence_file: "$result.evidence_file"
            required_capabilities: "$result.required_capabilities"
        legacy:
          stage: review-result-legacy
          params:
            ticket_id: "$context.ticket_id"
            attempt: "$counter.task_attempts"
            evidence_file: ""
        failed:
          stage: review-failure-route
          params:
            ticket_id: "$context.ticket_id"
        default:
          stage: review-result
          params:
            ticket_id: "$context.ticket_id"
            attempt: "$counter.task_attempts"
            evidence_file: "$result.evidence_file"
            required_capabilities: "$result.required_capabilities"
        error:
          stage: review-result-legacy
          params:
            ticket_id: "$context.ticket_id"
            attempt: "$counter.task_attempts"
            evidence_file: ""
            required_capabilities: ""

    # -------------------------------------------------------------------------
    # 4. review-result
    # Ревью тикета dod_format: 2 по собранным evidence (PLAN-002): prepare-review.js
    # задаёт вопросы по пунктам prose и visual, модель отвечает уровнем по шкале,
    # apply-review.js выносит вердикт и пишет строку ревью. В списке — только агенты
    # без инструментов (kind: http или tool_less: true): модель видит только evidence.
    # Скриншоты — первый агент списка с multimodal (required_capabilities от
    # verify-artifacts). При failed — increment-task-attempts для учёта попытки.
    # Неуверенная оценка (уверенность ниже min_confidence, уверенного провала нет)
    # провалом не считается, пока в попытке есть другой агент списка: пункты
    # переоценивает он, строку ревью пишет тот, кто вынес вердикт (раннер,
    # REVIEW_UNCERTAIN). ListeningGlass 2026-09-29: уровень 5 из 5 при уверенности
    # 0.79 засчитывался провалом, и Opus четыре раза переделывал готовую работу.
    # При error (модель ревью не ответила: bad_request, сеть, неразобранный ответ) —
    # increment-review-errors: ревью повторяется, попытка исполнения не тратится.
    # До 2026-09-28 error тоже вёл в increment-task-attempts: у PulseProxy QA-160 судья
    # пять раз упал «Too many images», и готовую работу пять раз переделывали заново.
    # -------------------------------------------------------------------------
    review-result:
      description: "Оценить прозаические пункты и пункты со скриншотами по собранным evidence"
      # 2026-10-04: Claude недоступен (аккаунт на холде) — скриншоты оценивает
      # gpt-luna-vision; claude-haiku-vision возвращается после разблокировки.
      agents: [jev, gpt-luna-vision]
      counter: task_attempts
      model_io:
        prepare: ".workflow/src/skills/review-result/scripts/prepare-review.js"
        apply: ".workflow/src/skills/review-result/scripts/apply-review.js"
        options: { pass_level: 4, min_confidence: 0.8 }
      goto:
        passed:
          stage: move-ticket
          params:
            ticket_id: "$context.ticket_id"
            target: done
        failed:
          stage: review-failure-route
          params:
            ticket_id: "$context.ticket_id"
        default:
          stage: move-ticket
          params:
            ticket_id: "$context.ticket_id"
            target: backlog
        error:
          stage: increment-review-errors
          params:
            ticket_id: "$context.ticket_id"

    # -------------------------------------------------------------------------
    # 4'. review-result-legacy
    # Прежнее ревью агентом со скилом review-result — для тикетов без
    # dod_format: 2, для тикета человека с файлами вне своей области
    # (human_out_of_scope_changes, ветка legacy verify-artifacts) и для ветки error
    # предпроверки (PLAN-002). Копия записи review-result, какой она была до PLAN-002:
    # агенты, скил, счётчик, переходы.
    # -------------------------------------------------------------------------
    review-result-legacy:
      description: "Проверить результат выполнения на соответствие DoD тикета (тикеты без dod_format: 2, тикет человека с правками вне своей области)"
      agents: [claude-haiku, gpt-luna, gemini-flash-lite, claude-sonnet]
      skill: review-result
      counter: task_attempts
      goto:
        passed:
          stage: move-ticket
          params:
            ticket_id: "$context.ticket_id"
            target: done
        failed:
          stage: review-failure-route
          params:
            ticket_id: "$context.ticket_id"
        default:
          stage: move-ticket
          params:
            ticket_id: "$context.ticket_id"
            target: backlog
        error:
          stage: increment-legacy-review-errors
          params:
            ticket_id: "$context.ticket_id"

    # -------------------------------------------------------------------------
    # 4b. increment-task-attempts
    # Отдельный стейдж обновления счётчика попыток выполнения тикета.
    # При достижении max — блокирует тикет. Иначе — возвращает в очередь.
    # -------------------------------------------------------------------------
    increment-task-attempts:
      description: "Обновить счётчик попыток выполнения тикета"
      type: update-counter
      counter: task_attempts
      max: 6
      goto:
        default:
          stage: move-ticket
          params:
            ticket_id: "$context.ticket_id"
            target: ready
        max_reached:
          stage: mark-blocked
          params:
            ticket_id: "$context.ticket_id"
            attempts: "$counter.task_attempts"
            reason: "max_review_attempts"

    # Сбой legacy-ревью повторяет именно legacy-ревью (без evidence-стадии
    # review-result) и не расходует попытку исполнения. Три сбоя — блокировка
    # с причиной review_error, как у основного increment-review-errors.
    increment-legacy-review-errors:
      description: "Повторить legacy-ревью после сбоя без попытки исполнения"
      type: update-counter
      counter: review_error_attempts
      max: 3
      goto:
        default:
          stage: review-result-legacy
          params:
            ticket_id: "$context.ticket_id"
            attempt: "$counter.task_attempts"
            evidence_file: ""
        max_reached:
          stage: mark-blocked
          params:
            ticket_id: "$context.ticket_id"
            attempts: "$counter.review_error_attempts"
            reason: "review_error"

    # -------------------------------------------------------------------------
    # 4c. increment-review-errors
    # Сбой самого ревью (review-result → error): модель не ответила или ответ не
    # разобран. Работа исполнителя не отклонена, поэтому попытка исполнения не
    # тратится — ревью повторяется. Третий сбой ревью на одном тикете — блокировка с
    # причиной review_error: такой сбой повтором не лечится. Имя счётчика содержит
    # attempt — раннер обнуляет его при смене тикета.
    # -------------------------------------------------------------------------
    increment-review-errors:
      description: "Учесть сбой ревью, не расходуя попытки исполнения"
      type: update-counter
      counter: review_error_attempts
      max: 3
      goto:
        default:
          stage: review-result
          params:
            ticket_id: "$context.ticket_id"
            attempt: "$counter.task_attempts"
            evidence_file: "$context.evidence_file"
            required_capabilities: "$context.required_capabilities"
        max_reached:
          stage: mark-blocked
          params:
            ticket_id: "$context.ticket_id"
            attempts: "$counter.review_error_attempts"
            reason: "review_error"

    # -------------------------------------------------------------------------
    # 5. move-ticket
    # Перемещает тикет в целевую директорию (done/ или blocked/)
    # -------------------------------------------------------------------------
    move-ticket:
      description: "Переместить тикет (done / blocked)"
      agent: script-move
      timeout: 120
      goto:
        default: pick-next-task
        error: pick-next-task

    # -------------------------------------------------------------------------
    # 6. create-report
    # Создаёт итоговый отчёт по выполненным задачам текущего цикла
    # -------------------------------------------------------------------------
    create-report:
      description: "Создать итоговый отчёт по выполненным задачам"
      agents: [gpt-luna, gemini-flash-lite, claude-sonnet, deepseek-flash]
      skill: create-report
      counter: create_report_attempts
      # Стадия уровня плана: ключей тикета (ticket_id, task_type, required_capabilities, …)
      # раннер ей не передаёт — ни в промпт, ни в выбор агента, ни в журнал запусков и
      # историю работы тикета; при пустом plan_id и заданном report_id — plan_id из
      # related_plan отчёта (runner.mjs, stageContext). Контекст раннера между стадиями не
      # очищается: 2026-09-29/30 create-report, analyze-report и decompose-gaps шли с
      # последним тикетом (HUMAN-003 в ListeningGlass, QA-180 в PulseProxy).
      scope: plan
      goto:
        default:
          stage: analyze-report
          params:
            report_id: "$result.report_id"
        # blocked — все агенты стадии нездоровы по health-реестру (all_unhealthy) или агент
        # ответил status: blocked. Это не фатально — завершаем пайплайн, отчёт не создан, но
        # данные не теряются. Прежний повод — required_capabilities предыдущего тикета
        # (no_capable_agent, 2026-04-20) — снят scope: plan.
        blocked: end
        error:
          stage: increment-create-report-attempts

    # Счётчик попыток для create-report (ротация моделей при API-ошибках)
    increment-create-report-attempts:
      description: "Обновить счётчик попыток create-report"
      type: update-counter
      counter: create_report_attempts
      max: 3
      goto:
        default: create-report
        max_reached: end

    # -------------------------------------------------------------------------
    # 7. analyze-report
    # Анализирует отчёт: план выполнен полностью или есть пробелы?
    # При has_gaps — переходит на increment-plan-iterations для учёта итерации.
    # -------------------------------------------------------------------------
    analyze-report:
      description: "Проанализировать отчёт: план выполнен полностью?"
      agents: [gpt-luna, gemini-flash-lite, claude-sonnet, deepseek-flash]
      skill: analyze-report
      counter: analyze_report_attempts
      scope: plan   # см. create-report
      goto:
        completed: complete-plan
        has_gaps:
          stage: increment-plan-iterations
          params:
            gaps: "$result.gaps"
            report_id: "$context.report_id"
        # blocked по тем же причинам, что и в create-report — завершаем пайплайн.
        blocked: end
        error:
          stage: increment-analyze-report-attempts

    # Счётчик попыток для analyze-report (ротация моделей при API-ошибках)
    increment-analyze-report-attempts:
      description: "Обновить счётчик попыток analyze-report"
      type: update-counter
      counter: analyze_report_attempts
      max: 3
      goto:
        default: analyze-report
        max_reached: end

    # -------------------------------------------------------------------------
    # 7a. complete-plan
    # Завершает план: обновляет status → completed, архивирует done-тикеты.
    # Если plan_id не задан в контексте — план отчёта report_id (scope: plan), нет и его —
    # единственный активный план.
    # completed — план закрыт сейчас или раньше (повтор на закрытом плане —
    # already_completed: true, без изменений). not_ready — у плана открытые тикеты (тикеты
    # в blocked/ — в blocked_tickets и строкой WARN с первой строкой blocked_reason) или
    # готовый тикет записал в «### Найденные дефекты» дефект без исправления (defects и
    # строка WARN). Все исходы — end: план закрывает только эта стадия, а not_ready ждёт
    # тикетов или решения человека.
    # -------------------------------------------------------------------------
    complete-plan:
      description: "Завершить план (status: completed) и архивировать тикеты"
      agent: script-complete-plan
      timeout: 120
      scope: plan   # см. create-report
      goto:
        completed: end
        not_ready: end
        no_plan: end
        default: end
        error: end

    # -------------------------------------------------------------------------
    # 7b. increment-plan-iterations
    # Отдельный стейдж обновления счётчика итераций анализа плана.
    # При достижении max — завершает пайплайн. Иначе — декомпозирует пробелы.
    # -------------------------------------------------------------------------
    increment-plan-iterations:
      description: "Обновить счётчик итераций анализа плана"
      type: update-counter
      counter: plan_iterations
      max: 2
      goto:
        default:
          stage: decompose-gaps
        max_reached: end

    # -------------------------------------------------------------------------
    # 8. decompose-gaps
    # Декомпозирует недочёты из анализа отчёта в новые тикеты (backlog/)
    # -------------------------------------------------------------------------
    decompose-gaps:
      description: "Декомпозировать недочёты из отчёта в новые тикеты"
      agents: [claude-sonnet, gpt-luna, deepseek-flash]
      skill: decompose-gaps
      # plan_id, которого требует скил (узлы P0R2 и P0Q1), при запуске без --plan — из
      # related_plan отчёта report_id; см. create-report.
      scope: plan
      # Без новых тикетов check-conditions → empty → check-report-needed: доска та же, после
      # разбора было разбиение — unchanged, конец. Прежняя стадия check-decompose-result
      # (1.16.3) читала поле created_tickets блока RESULT, а список без отступа под ключом
      # парсер RESULT теряет: 2026-09-28 PulseProxy, созданные FIX-032 и QA-163 прочитаны
      # как «тикетов нет», и пайплайн завершился, не взяв их в работу.
      goto:
        default: check-conditions

  # ===========================================================================
  # Точка входа (entry)
  # ===========================================================================
  # Stage, с которого начинается выполнение пайплайна.
  # ===========================================================================
  entry: pick-first-task

  # ===========================================================================
  # Контекст (context)
  # ===========================================================================
  # Переменные, доступные всем stages через $context.*.
  # Runner автоматически обновляет context через params в goto-переходах.
  # Начальные значения задаются здесь или через CLI:
  #   node runner.mjs --plan PLAN-003
  # ===========================================================================
  context:
    plan_id: ""              # ID плана (задаётся при запуске)
    mcp_require_for: "qa"    # comma-separated типы тикетов, для которых check-mcp проверяет MCP

  # ===========================================================================
  # Защита файлов (protected_files)
  # ===========================================================================
  # Glob-паттерны файлов, в которые агентам запрещена запись.
  # Runner проверяет эти паттерны и блокирует изменения.
  # Пути указываются относительно корня проекта (без префикса .workflow/)
  # ===========================================================================
  protected_files:
    - ".workflow/plans/**"       # Планы — только для чтения
    - ".workflow/config/**"      # Конфигурация
    - pattern: ".workflow/tickets/**"
      mode: structure            # Защита только структуры (создание/удаление файлов)

  # ===========================================================================
  # Доверенные агенты (trusted_agents)
  # ===========================================================================
  # Агенты, для которых FileGuard не откатывает изменения в protected_files.
  # Поддерживает glob-паттерны: "script-*" соответствует "script-move" и т.д.
  # ===========================================================================
  trusted_agents:
    - "script-check-templates"   # Создаёт планы в plans/current/
    - "script-*"                  # Все скрипты

  # ===========================================================================
  # Доверенные стейджи (trusted_stages)
  # ===========================================================================
  # Стейджи, которые могут создавать/удалять файлы в protected_files.
  # Например, decompose-plan и decompose-gaps создают тикеты.
  # ===========================================================================
  trusted_stages:
    - "decompose-plan"
    - "decompose-gaps"

  # ===========================================================================
  # Настройки выполнения (execution)
  # ===========================================================================
  # Параметры, управляющие поведением runner'а.
  #
  #   max_steps:             — абсолютный лимит шагов за один запуск (защита от зацикливания)
  #   delay_between_stages:  — пауза между этапами в секундах
  #   timeout_per_stage:     — таймаут на один этап в секундах (по истечении — ошибка)
  #   log_file:              — путь к файлу логов (относительно корня проекта)
  # ===========================================================================
  execution:
    max_steps: 1500
    delay_between_stages: 5
    timeout_per_stage: 1800
    log_file: ".workflow/logs/pipeline.log"
