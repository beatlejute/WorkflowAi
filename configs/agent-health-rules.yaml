version: "1.0"

common:
  # Ограничение провайдера (HTTP 429, rate limit, quota exceeded) — не дефект модели:
  # агент недоступен 15 минут, запрета модели за такой запуск нет (src/lib/agent-runs.mjs,
  # градация `throttled`). В серию «модель недоступна» (unavailableBans, с 2026-10-01)
  # он не идёт и её не прерывает — как и сбои `network_error`, `auth_error` и `aborted`
  # без пройденного контроля. Серию дают только не меньше 3 сбоев процесса `error` и
  # `timeout` подряд без пройденного контроля, и запрет от часа до суток — по ней.
  # Шаблон — дословно PROVIDER_RATE_LIMIT_PATTERN, класс `rate_limit`
  # classifyAgentResult (src/lib/agent-history.mjs): ограничение в трёх последних
  # строках stderr, то есть запуск на нём закончился; 429 из середины, после которых
  # агент продолжил работу, не в счёт. Правило стоит первым, как проверка там: при
  # ограничении в конце и сетевой ошибке раньше побеждает ограничение. Общее правило
  # в онлайн-скане stderr не участвует: агент, который сам повторяет запросы после
  # 429, не снимается. Шаблон — без флагов и модификаторов вида `(?i)`: файл читают и
  # раннеры прежних версий (обычный `new RegExp` Node 18), регистр — классами `[Rr]`.
  # В одинарных кавычках YAML обратная косая черта — как есть, `''` — кавычка.
  - id: "provider-rate-limit"
    class: "unavailable"
    ttl: "15m"
    pattern: '(?:[Rr]ate.?[Ll]imit|RATE.?LIMIT|[Qq]uota.?[Ee]xceeded|QUOTA.?EXCEEDED|[Tt]oo [Mm]any [Rr]equests|TOO MANY REQUESTS|(?:[Ss]tatus|[Cc]ode|[Ee]rror|HTTP(?:/[\d.]+)?)["'']?[ :=]*429\b(?!:\d))[^\n]*(?:\n[^\n]*){0,2}\s*$'
    exit_codes: "any"
  - id: "net-econnreset"
    class: "transient"
    ttl: "5m"
    pattern: "ECONNRESET|ETIMEDOUT|EAI_AGAIN|connection reset by peer|socket hang up"
    exit_codes: "any"
  - id: "http-5xx-transient"
    class: "transient"
    ttl: "5m"
    pattern: "\\b(502|503|504)\\b.*(Bad Gateway|Service Unavailable|Gateway Timeout)"
    exit_codes: "any"
  - id: "http-auth"
    class: "misconfigured"
    ttl: "1h"
    pattern: "\\b(401|403)\\b|Unauthorized|Forbidden|API key (not found|invalid|missing)"
    exit_codes: "any"

agents:
  claude-sonnet:
    rules:
      - id: "claude-overloaded"
        class: "unavailable"
        ttl: "10m"
        pattern: "overloaded_error|\\b529\\b|Overloaded"
        exit_codes: "any"
      - id: "claude-rate-limit"
        class: "unavailable"
        ttl: "1h"
        pattern: "rate_limit_error|\\b429\\b.*rate|usage limit"
        exit_codes: "any"

  claude-opus:
    extends: claude-sonnet

  # Правила шага 0 (PLAN-004): снятие kilo-агента онлайн по строке stderr самого
  # kilo 7.7.9 (`timestamp=… level=ERROR … message="stream error" …`), без ожидания
  # исчерпания повторов. Раньше был снят только 429 в общем формате разных
  # клиентов (`provider-rate-limit` выше) — роутер kilo сам повторяет запрос после
  # 429 и не отдаёт такой текст последней строкой, поэтому общее правило не
  # срабатывало и агент шёл в retry-цикл: 0 из 5 запусков с 429 восстановились
  # (PulseProxy, 25–27.09.2026). Порядок правил важен: дневной лимит — первым,
  # иначе строка с `limit_rpd` попала бы под поминутное правило `kilo-provider-
  # rate-limit` (у неё есть и текст "Rate limit exceeded"). Привязка к началу
  # строки (`(?:^|\n)timestamp=…`) — чтобы не сработать на эхе этих же строк в
  # исходниках тестов и в диффах тикетов. Шаблоны — без флагов и модификаторов
  # (?i): файл читают и раннеры прежних версий (обычный `new RegExp` Node 18).
  kilo-free:
    rules:
      - id: "kilo-provider-daily-limit"
        class: "unavailable"
        ttl: "until_utc_midnight"
        pattern: '(?:^|\n)timestamp=[^ \n]+ level=ERROR [^\n]*message="stream error"[^\n]*(?:limit_rpd|[Dd]aily limit|[Ff]ree tier[^\n]*exhaust)'
        exit_codes: "any"
      - id: "kilo-provider-rate-limit"
        class: "unavailable"
        ttl: "15m"
        pattern: '(?:^|\n)timestamp=[^ \n]+ level=ERROR [^\n]*message="stream error"[^\n]*(?:Rate limit exceeded|rate-limited upstream)'
        exit_codes: "any"
      # Перегрузка провайдера восстанавливается сама (замер 25.09 15:53 — запуск
      # прошёл после одного overloaded), поэтому снятие — на третьей такой строке
      # за запуск (не обязательно подряд), а не на первой.
      - id: "kilo-provider-overloaded"
        class: "unavailable"
        ttl: "15m"
        pattern: '(?:(?:^|\n)timestamp=[^ \n]+ level=ERROR [^\n]*message="stream error"[^\n]*(?:[Oo]verloaded|ResourceExhausted)[\s\S]*?){3}'
        exit_codes: "any"

  # Пулы моделей (PLAN-004): правила участника `<пул>@<id>` ищутся по id пула — состав
  # пула известен только после раскрытия, поэтому в файле он не описывается. Пометка
  # нездоровья — по id участника (маршрут). Участника, получившего 429, выводит из
  # выбора `kilo-provider-rate-limit` на 15 минут. Своего правила дневного лимита
  # аккаунта OpenRouter у free-openrouter нет: по документации тело такого 429 от
  # общего не отличается, место пула до 00:00 UTC закрывает шлагбаум models.gate
  # (free-quota-gate.js по счётчику GET /api/v1/key).
  free-kilo:
    extends: kilo-free

  free-openrouter:
    extends: kilo-free

  deepseek-flash:
    rules:
      - id: "deepseek-provider-down"
        class: "transient"
        ttl: "15m"
        pattern: "deepseek.*unavailable|upstream error"
        exit_codes: "any"

  deepseek-pro:
    extends: deepseek-flash

  gemini-flash-lite:
    rules:
      - id: "gemini-free-tier-quota"
        class: "unavailable"
        ttl: "10m"
        pattern: "exceeded your current quota|generate_content_free_tier|generativelanguage.googleapis.com"
        exit_codes: "any"
